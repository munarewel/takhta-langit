<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen god view. Pixel world fills the stage, GM tools under it, panel docks below on phones and right on desktop. Single deliberate night-vault look. */
:root{
  --ink:#0f1018; --vault:#161725; --vault-2:#1d1e30; --vault-3:#25263b; --line:#2b2c42;
  --parch:#ece5d3; --mute:#9a95ad; --gold:#e3b75e; --gold-dim:#8a6d33;
  --war:#e0645a; --life:#7fc98a; --love:#ff8fa8; --hero:#c9b8ff; --dun:#e9c7a0;
  --s1:#b9b4a4; --s2:#7fd8ff; --s3:#c78aff; --s4:#ffd36a; --s5:#ff8a5a;
  --display:"Marcellus SC","Cinzel",Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--parch);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:100%;grid-template-rows:auto minmax(0,1fr) auto minmax(0,42%)}
header{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--vault);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:19px;letter-spacing:.06em;color:var(--gold);white-space:nowrap}
.stats{display:flex;gap:4px 12px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--mute)}
.stats b{color:var(--parch);font-weight:700}
.hctl{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.hctl button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:13px;color:var(--mute)}
.hctl .mnu{display:none}
@media (max-width:619px){ .hctl .mnu{display:inline-block} .hctl:not(.open) .mi{display:none} .app{grid-template-rows:auto minmax(0,1fr) auto minmax(0,38%)} .brand{font-size:17px} .stats{font-size:12.5px;gap:2px 10px} }
.hctl button[aria-pressed="true"]{border-color:var(--gold-dim);color:var(--gold);background:rgba(227,183,94,.08)}

.stage{position:relative;min-height:0;overflow:hidden;background:#1d3a5f;touch-action:none}
.stage canvas{touch-action:none;-webkit-user-select:none;user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:rgba(22,23,37,.9);font-size:18px}
.opts{position:absolute;left:10px;right:56px;top:10px;display:flex;gap:5px;flex-wrap:wrap}
.opts button{border:1px solid var(--line);background:rgba(22,23,37,.92);border-radius:999px;padding:3px 10px;font-size:13px}
.opts button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.toast{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);background:var(--vault-2);border:1px solid var(--gold-dim);border-radius:8px;padding:6px 14px;font-size:14px;max-width:calc(100% - 32px);text-align:center;pointer-events:none;transition:opacity .3s;z-index:3}
.alert{position:absolute;left:10px;right:56px;bottom:10px;background:rgba(40,16,20,.94);border:1px solid #7a3a3a;border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;font-size:14px;z-index:2}
.alert span{flex:1;min-width:0}
.possess{position:absolute;left:8px;right:52px;top:8px;background:rgba(22,20,40,.93);border:1px solid #5a4a8a;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:5px;font-size:13px;z-index:2;max-height:48%;overflow:auto}
.possess .btn{padding:3px 8px;font-size:12.5px}
.possess .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.possess b{color:var(--hero)}
.setup{position:absolute;inset:0;background:rgba(10,10,18,.82);display:flex;align-items:center;justify-content:center;z-index:5;padding:16px}
.setup .card{max-width:420px;width:100%}
.dream{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(40,30,80,.92),rgba(8,6,20,.96));display:flex;align-items:center;justify-content:center;z-index:6;padding:12px}
.dream .dbox{max-width:560px;width:100%;max-height:100%;overflow:auto;border:1px solid #6a5aa8;border-radius:12px;background:rgba(18,15,36,.96);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dream .dhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.dream canvas.portrait{position:static;inset:auto;width:72px;height:90px;flex:0 0 auto}
.dream .dlog{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4;max-height:min(260px,38vh);min-height:72px;flex:0 0 auto;overflow:auto;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04)}
.dream .dbox>*{flex-shrink:0}
.dream .me{color:var(--gold);font-style:italic}
.dream .npc{color:var(--parch)}
.dream .note{color:var(--hero);font-size:12.5px}
.dream h4{margin:4px 0 0;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500}
.dream .btn{padding:3px 8px;font-size:12.5px}
.dream .btn.dark{border-color:#7a2a3a;color:#f0a0b0}
.dview{position:absolute;inset:0;background:#0b0910;z-index:5;overflow:hidden}
.dview canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:default}
.dvhud{position:absolute;left:8px;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none;font-size:13px}
.dvhud .box{background:rgba(14,12,22,.82);border:1px solid #4a3a6a;border-radius:8px;padding:6px 9px;max-width:420px}
.dvhud .log{color:var(--parch);font-size:12.5px;margin:0;padding-left:16px}
.dvx{position:absolute;right:8px;bottom:8px}
.tstop{position:absolute;left:50%;transform:translateX(-50%);bottom:44px;background:rgba(22,20,40,.9);border:1px solid #5a4a8a;border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--hero);z-index:3;display:flex;gap:8px;align-items:center}
.tstop button{background:none;border:0;color:var(--gold);text-decoration:underline;font-size:12.5px;padding:0}
.chipbtn{border:1px solid var(--line);background:var(--vault-2);border-radius:999px;padding:2px 9px;font-size:13px}
.chipbtn[aria-pressed="true"]{border-color:var(--hero);color:var(--hero)}
.btn{border:1px solid var(--gold-dim);background:rgba(227,183,94,.1);color:var(--gold);border-radius:7px;padding:4px 10px;font-size:13.5px}
.btn.warn{border-color:#7a3a3a;color:#f0a59d;background:rgba(224,100,90,.08)}
.btn[disabled]{opacity:.45;cursor:default}

.tools{display:flex;gap:6px;overflow-x:auto;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--vault);border-top:1px solid var(--line);border-bottom:1px solid var(--line);scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:0;min-width:60px;padding:5px 7px;border-radius:8px;border:1px solid var(--line);background:var(--vault-2)}
.tool .g{font-size:17px;line-height:1.15;color:var(--gold)}
.tool .n{font-size:12px;white-space:nowrap}
.tool[aria-pressed="true"]{border-color:var(--gold);background:rgba(227,183,94,.12)}

.panel{min-height:0;display:flex;flex-direction:column;background:var(--vault)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding-top:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 7px 7px;font-family:var(--display);letter-spacing:.05em;font-size:14px;color:var(--mute);display:flex;gap:5px;align-items:center;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.badge{background:var(--war);color:#fff;border-radius:999px;font-family:var(--body);font-size:11px;padding:0 6px;font-weight:700}
.body{flex:1;min-height:0;overflow-y:auto;padding-block:8px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.chron{list-style:none;margin:0;padding:0}
.chron li{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35;cursor:pointer}
.chron .y{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px;padding-top:2px}
.k-war .t{color:#f0b0a8}.k-god .t{color:var(--gold)}.k-hero .t{color:var(--hero)}.k-life .t{color:#bfe6c4}.k-dun .t{color:var(--dun)}.k-love .t{color:var(--love)}
.empty{color:var(--mute);font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--vault-2);display:flex;flex-direction:column;gap:7px;min-width:0}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.04em;display:flex;align-items:center;gap:8px;text-wrap:balance}
.card h4{margin:2px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500}
.dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:13.5px;font-variant-numeric:tabular-nums;margin:0}
.kv dt{color:var(--mute)} .kv dd{margin:0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--parch);background:var(--vault)}
.chip.war{border-color:rgba(224,100,90,.5);color:#f0a59d}
.chip.gold{border-color:var(--gold-dim);color:var(--gold)}
.chip.x{cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.sub{font-size:12.5px;color:var(--mute)}
.link{color:var(--gold);cursor:pointer;text-decoration:underline;text-decoration-color:var(--gold-dim);text-underline-offset:2px}
.dead{color:var(--mute)}
.log{font-size:13px;color:var(--mute);margin:0;padding-left:16px}
.head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.portrait{image-rendering:pixelated;background:var(--vault);border:1px solid var(--line);border-radius:8px}
.stars{color:var(--gold);letter-spacing:1px}
.peek{font-size:12.5px;color:var(--hero);border:1px dashed #5a4a8a;border-radius:6px;padding:3px 8px}
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.wrow small{color:var(--mute)}
.search{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.search input{flex:1;min-width:140px;background:var(--vault-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
select{background:var(--vault-2);border:1px solid var(--line);border-radius:7px;padding:4px 6px;max-width:100%}
.god{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px}
.god .gl{font-size:24px;line-height:36px;text-align:center;border-radius:8px;background:var(--vault)}
.plan{border:1px solid #7a3a3a;border-radius:8px;padding:6px 9px;background:rgba(224,100,90,.07);font-size:13.5px}

@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr) auto}
  header{grid-column:1/-1}
  .stage{grid-column:1;grid-row:2}
  .tools{grid-column:1;grid-row:3;border-bottom:0}
  .panel{grid-column:2;grid-row:2/4;border-left:1px solid var(--line)}
  .tabs{padding-left:12px} .body{padding-left:14px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ---------- pembuatan medan ---------- */
function genTerrain(seed){
  const h=(x,y)=>{const v=Math.sin(x*127.1+y*311.7+seed*0.1371)*43758.5453;return v-Math.floor(v);};
  const sm=t=>t*t*(3-2*t);
  const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const a=h(xi,yi),b=h(xi+1,yi),c=h(xi,yi+1),d=h(xi+1,yi+1);const u=sm(xf),v=sm(yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};
  const fbm=(x,y,o)=>{let t=0,amp=.5,f=1,n=0;for(let i=0;i<o;i++){t+=vn(x*f,y*f)*amp;n+=amp;amp*=.5;f*=2.03;}return t/n;};
  const E=new Float32Array(MW*MH), M=new Float32Array(MW*MH);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const nx=x/MW, ny=y/MH, dx=(nx-.5)*2, dy=(ny-.5)*2;
    const d=Math.sqrt(dx*dx*.8+dy*dy*1.1);
    E[y*MW+x]=fbm(nx*3.2+7,ny*2.4+3,5)-d*d*.38;
    M[y*MW+x]=fbm(nx*3+51,ny*3+17,4);
  }
  const q=(arr,p)=>{const s=Array.from(arr).sort((a,b)=>a-b);return s[Math.floor(clamp(p,0,.999)*s.length)];};
  const eDeep=q(E,.18), eWater=q(E,.30), eSand=q(E,.34), eHill=q(E,.82), eMount=q(E,.92), eSnow=q(E,.983);
  const landM=[]; for(let i=0;i<MW*MH;i++) if(E[i]>=eSand&&E[i]<eHill) landM.push(M[i]);
  landM.sort((a,b)=>a-b);
  const mDry=landM[Math.floor(landM.length*.14)], mWet=landM[Math.floor(landM.length*.62)];
  const tiles=new Uint8Array(MW*MH);
  for(let i=0;i<MW*MH;i++){
    const e=E[i], m=M[i]; let t;
    if(e<eDeep)t=T.DEEP; else if(e<eWater)t=T.WATER; else if(e<eSand)t=T.SAND;
    else if(e>=eSnow)t=T.SNOW; else if(e>=eMount)t=T.MOUNT; else if(e>=eHill)t=T.HILLS;
    else if(m<mDry)t=T.DESERT; else if(m>mWet)t=T.FOREST; else t=T.GRASS;
    tiles[i]=t;
  }
  return {tiles,E};
}

/* ---------- sifat ---------- */
function conflicts(t,list){ for(const [a,b] of SIFAT_CONFLICT){ if(t===a&&list.includes(b)) return true; if(t===b&&list.includes(a)) return true; } return list.includes(t); }
function genTraits(ma,pa){
  const out=[];
  for(const p of [ma,pa]) if(p) for(const t of p.traits) if(rnd()<.28&&!conflicts(t,out)&&out.length<3) out.push(t);
  const n=rnd()<.55?2:3;
  let guard=0;
  while(out.length<n&&guard++<40){
    const t=pick(SIFAT_LIST);
    if(SIFAT_RARE.has(t)&&rnd()>.3) continue;
    if(t==='Adil'||t==='Kejam'||t==='Bijak'){ if(rnd()>.5) continue; }
    if(!conflicts(t,out)) out.push(t);
  }
  return out;
}
const has = (u,t) => u.traits.includes(t);

/* ---------- berkat ---------- */
function rollBerkat(ma,pa,race){
  // nubuat Pahlawan
  if(G.prophecy&&!G.units.some(u=>!u.dead&&u.b===BIDX('Pahlawan'))){ G.prophecy=false; return BIDX('Pahlawan'); }
  if(race==='iblis'&&G.demonCount>=3&&!G.units.some(u=>!u.dead&&u.b===BIDX('Raja Iblis'))&&rnd()<.03) return BIDX('Raja Iblis');
  if((ma||pa)&&G.step>YEAR*10&&G.dungeons.some(d=>!d.demon)&&G.units.filter(u=>!u.dead&&u.b===BIDX('Raja Iblis')).length<2&&rnd()<(race==='iblis'?.008:.001)) return BIDX('Raja Iblis');
  for(const p of [ma,pa]){
    if(p&&p.b!=null&&rnd()<.35){
      const pb=BERKAT[p.b];
      let s=pb.s; const r=rnd(); if(r<.25) s=Math.max(1,s-1); else if(r>.9) s=Math.min(5,s+1);
      const opts=BERKAT.map((b,i)=>[b,i]).filter(([b])=>!b.uniq&&b.s===s&&b.role===pb.role);
      if(opts.length) return pick(opts)[1];
    }
  }
  const luck=G.luck||0;
  let r=rnd(), s=1;
  const odds=STAR_ODDS.map((o,i)=>i>=2?o*(1+luck):o);
  let acc=0; for(let i=5;i>=1;i--){ acc+=odds[i]; }
  r*=acc; let c=0; for(let i=1;i<=5;i++){ c+=odds[i]; if(r<=c){ s=i; break; } }
  const opts=BERKAT.map((b,i)=>[b,i]).filter(([b])=>!b.uniq&&b.s===s);
  return pick(opts)[1];
}
function pickDream(u){
  const b=BERKAT[u.b]; const pool=[];
  const add=(id,w)=>{ for(let i=0;i<w;i++) pool.push(id); };
  add('nikah',3); add('rumah',2); add('tua',2); add('sahabat',2); add('kaya',1);
  if(COMBAT_ROLES.has(b.role)){ add('rankB',3); add('rankS',b.s>=3?3:1); add('monster',2); add('dungeon',2); add('ksatria',2); }
  if(b.role==='tempa') add('legenda',4);
  if(b.role==='dagang'||b.role==='kurir'){ add('kaya',4); add('jelajah',3); }
  if(has(u,'Romantis')) add('nikah',4);
  if(has(u,'Penyayang Anak')) add('anak3',5);
  if(has(u,'Ambisius')){ add('raja',2); add('kaya',2); }
  if(has(u,'Jiwa Petualang')) add('jelajah',3);
  if(has(u,'Serakah')) add('kaya',3);
  return pick(pool);
}

/* ---------- warga ---------- */
function makeUnit(o){
  const race=o.race, sex=o.sex||(rnd()<.5?'m':'f');
  const ma=o.mother?person(o.mother):null, pa=o.father?person(o.father):null;
  const R=RACE[race];
  const u={
    id:newId(), name:o.name||genName(race,sex), marga:o.marga||(pa?pa.marga:genMarga(race)), race, sex,
    bornStep: G.step - Math.round((o.age||0)*YEAR), life:0,
    b: o.b!=null?o.b:rollBerkat(ma,pa,race), revealed: (o.age||0)>=5,
    traits: o.traits||genTraits(ma,pa), dream:null, dreamDone:false,
    gold: o.gold!=null?o.gold:ri(5,30), lvl:1, xp:0, hp:1, maxHp:1, atk:1, def:0,
    town:o.town||null, kingdom:o.kingdom||null, home:o.home||null,
    spouse:null, widowOf:null, mournUntil:0, noRemarry:false, consortOf:null,
    mother:o.mother||null, father:o.father||null, children:[],
    rel:{}, crush:null, app:genApp(race,sex,ma&&ma.app,pa&&pa.app),
    x:o.x||0, y:o.y||0, px:o.x||0, py:o.y||0, path:[], task:null, dir:'down', flip:false, moving:false, inside:false,
    career:null, party:null, sick:0, happy:60, hunger:0, cd:0, mounted:null, carry:null,
    title:o.title||null, royal:o.royal||null, flags:{}, hist:[], kills:0, maxKillRank:-1, deepest:0, visited:{}, dead:false, worked:false, possessed:false,
    lastHelp:0, iq:0, motif:null,
  };
  u.iq=rollIQ(ma,pa)+(u.traits.includes('Cerdas')?15:0);
  u.life = Math.round(ri(R.life[0],R.life[1])*(has(u,'Panjang Umur')?1.2:1));
  u.dream = pickDream(u);
  recalcStats(u, true);
  if(o.lvl){ for(let i=1;i<o.lvl;i++) levelUp(u,true); }
  G.units.push(u); G.uMap.set(u.id,u);
  if(ma) ma.children.push(u.id); if(pa) pa.children.push(u.id);
  return u;
}
function ageOf(u){ return (G.step-u.bornStep)/YEAR; }
function stageOf(u){
  if(u.race==='monster') return 'dewasa';
  const a=ageOf(u), R=RACE[u.race], k=R.adult/18;
  if(a<2.5*k) return 'bayi';
  if(a<11*k) return 'anak';
  if(a<R.adult) return 'remaja';
  if(a>u.life*.78) return 'tua';
  return 'dewasa';
}
function isAdult(u){ const s=stageOf(u); return s==='dewasa'||s==='tua'; }
function canWork(u){ return ageOf(u)>=RACE[u.race].adult*.75; }
function roleOf(u){ return u.jobOverride||BERKAT[u.b].role; }
function starMult(u){ const b=BERKAT[u.b]; const m=[1,1,1.5,2.2,3.2,4.6][b.s]; return COMBAT_ROLES.has(b.role)?m:Math.max(.8,m*.6); }
function recalcStats(u,full){
  const R=RACE[u.race]; const m=starMult(u);
  let hp=26+(u.race==='dwarf'?8:0)+(u.race==='beastkin'?4:0);
  let atk=3+(u.race==='iblis'?1.5:0)+(u.race==='beastkin'?1:0);
  hp*=m; atk*=m;
  hp+= (u.lvl-1)*(3+m*2); atk+=(u.lvl-1)*(.5+m*.45);
  if(has(u,'Tangguh')) hp*=1.3; if(has(u,'Kuat')) atk*=1.25;
  u.maxHp=Math.round(hp); u.atk=atk; u.def=(u.lvl*.3)+(BERKAT[u.b].s-1)*1.2;
  extraStats(u);
  if(full) u.hp=u.maxHp; else u.hp=Math.min(u.hp,u.maxHp);
}
function xpNeed(l){ return Math.floor(11*Math.pow(l,1.5)); }
function gainXp(u,x){
  if(u.race==='monster'||u.lvl>=50) return;
  if(has(u,'Cerdas')) x*=1.25; if(has(u,'Haus Ilmu')) x*=1.1;
  if(u.b===BIDX('Pahlawan')) x*=1.8;
  if(u.isekai) x*=1.7;
  if(u.career==='petualang'||u.career==='hunter'||u.career==='penjaga') x*=1.6;
  x*=iqMult(u);
  u.xp+=x;
  while(u.lvl<50&&u.xp>=xpNeed(u.lvl)){ u.xp-=xpNeed(u.lvl); levelUp(u); }
}
function levelUp(u,silent){
  u.lvl++; recalcStats(u,true);
  if(silent) return;
  hist(u,`merasakan berkah dewa (Lv ${u.lvl})`);
  FX_QUEUE.push({k:'lvl',x:u.x,y:u.y,t:30});
  if(u.lvl%10===0) log(`${fullName(u)} kembali merasakan "berkah dewa" yang tak bisa dijelaskannya. Tubuhnya pulih dan terasa lebih kuat dari sebelumnya. (Lv ${u.lvl})`,'hero',{x:u.x,y:u.y});
  const rk=rankOf(u.lvl), pr=rankOf(u.lvl-1);
  if(rk!==pr&&u.career==='petualang'&&RANK_ORDER.indexOf(rk)>=3) log(`Guild mengakui ${fullName(u)} sebagai petualang peringkat ${rk}.`,'hero',{x:u.x,y:u.y});
}
function rankOf(l){ return l>=40?'S':l>=30?'A':l>=22?'B':l>=15?'C':l>=10?'D':l>=5?'E':'F'; }
function fullName(u){ if(!u) return '?'; const t=u.title?u.title+' ':''; return `${t}${u.name} ${u.flags&&u.flags.epithet||u.marga||''}`.trim(); }
function shortName(u){ if(!u) return '?'; return (u.title?u.title+' ':'')+u.name; }
function pronoun(u){ return u.sex==='m'?'ia':'ia'; }

/* ---------- hubungan ---------- */
function relOf(a,bId){ let r=a.rel[bId]; if(!r){ r=a.rel[bId]={f:0,r:0,t:G.step}; pruneRel(a); } return r; }
function pruneRel(a){ const ks=Object.keys(a.rel); if(ks.length<=40) return; ks.sort((x,y)=>(Math.abs(a.rel[x].f)+a.rel[x].r)-(Math.abs(a.rel[y].f)+a.rel[y].r)); for(let i=0;i<ks.length-36;i++){ if(+ks[i]!==a.spouse) delete a.rel[ks[i]]; } }
function related(a,b){
  if(a.mother&&(a.mother===b.id||a.mother===b.mother)) return true;
  if(a.father&&(a.father===b.id||a.father===b.father)) return true;
  if(b.mother===a.id||b.father===a.id) return true;
  return false;
}
function romanceEligible(a){
  if(a.dead||a.spouse||a.consortOf||a.noRemarry||a.royal&&a.title==='Raja'&&false) return false;
  if(!isAdult(a)) return false;
  if(a.mournUntil>nowY()) return false;
  if(stageOf(a)==='tua'&&!a.widowOf) return false;
  return true;
}
function canRomance(a,b){
  if(a.sex===b.sex) return false;
  if(!romanceEligible(a)||!romanceEligible(b)) return false;
  if(related(a,b)) return false;
  const ra=RACE[a.race].life[0], rb=RACE[b.race].life[0];
  const ag=ageOf(a)/ra, bg=ageOf(b)/rb;
  if(Math.abs(ag-bg)>.25) return false;
  return true;
}
function compat(a,b){
  // nilai cocok bawaan yang stabil per pasangan
  const lo=Math.min(a.id,b.id), hi=Math.max(a.id,b.id);
  const v=Math.sin(lo*12.9898+hi*78.233)*43758.5453; let c=(v-Math.floor(v));
  if(a.race!==b.race) c*=.75;
  for(const t of a.traits) if(b.traits.includes(t)) c+=.08;
  if(has(a,'Sombong')||has(b,'Sombong')) c-=.05;
  if(has(a,'Ramah')||has(b,'Ramah')) c+=.04;
  return clamp(c,0,1);
}
function charm(u){
  let c=1; if(has(u,'Karismatik')) c+=.6; if(has(u,'Penggoda')) c+=.8; if(has(u,'Romantis')) c+=.4; if(has(u,'Pemalu')) c-=.4; if(has(u,'Sombong')) c-=.2; if(has(u,'Rendah Hati')) c+=.2;
  if(u.royal) c+=.3; c+=Math.min(.6,u.gold/600); return c;
}

/* ---------- perencanaan kota ---------- */
function rectFree(t,x,y,w,h){
  for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){
    if(!buildable(tileAt(xx,yy))) return false;
    if(G.occ[yy*MW+xx]) return false;
  }
  return true;
}
function occupy(x,y,w,h,v=1){ for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++) if(xx>=0&&yy>=0&&xx<MW&&yy<MH){ G.occ[yy*MW+xx]=v; G.trees[yy*MW+xx]=0; } }
function paintRoad(x,y,w,h,kind=1){ for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++) if(xx>=0&&yy>=0&&xx<MW&&yy<MH&&isLand(tileAt(xx,yy))){ G.road[yy*MW+xx]=kind; G.trees[yy*MW+xx]=0; G.occ[yy*MW+xx]=G.occ[yy*MW+xx]||2; } }

function planTown(t){
  const {cx,cy,R}=t;
  t.slots=[]; t.fields=[]; t.gates=[];
  if(t.cap){
    // istana di utara pusat
    occupy(cx-6,cy-10,12,8,3); t.palace={x:cx-6,y:cy-10};
  }
  // jalan utama
  paintRoad(cx-R-4,cy,2*R+8,2);
  paintRoad(cx,cy,2,R+4);
  paintRoad(cx,cy-R-4,2,R+4-(t.cap?10:0));
  paintRoad(cx-4,cy-2,10,6,2); // alun-alun
  // gerbang
  if(t.cap||t.walled){
    t.gates=[[Math.PI,'W'],[0,'E'],[Math.PI/2,'S'],[-Math.PI/2,'N']].map(([a,side])=>({x:Math.round(cx+1+Math.cos(a)*(R+.5)),y:Math.round(cy+1+Math.sin(a)*(R+.5)),side}));
  }
  // petak bangunan
  const cand=[];
  for(let k=0;k<12;k++){
    const xs=[cx+2+k*6+(k>0?0:0), cx-6-k*6];
    for(let j=0;j<12;j++){
      const ys=[cy+2+j*5, cy-5-j*5];
      for(const x of xs) for(const y of ys){
        const ccx=x+3, ccy=y+2.5;
        if(dist(ccx,ccy,cx+1,cy+1)>R-3.5) continue;
        cand.push({x,y,d:dist(ccx,ccy,cx+1,cy+1)});
      }
    }
  }
  cand.sort((a,b)=>a.d-b.d);
  for(const c of cand){ if(rectFree(t,c.x,c.y,6,5)){ occupy(c.x,c.y,6,5,4); t.slots.push({x:c.x,y:c.y,used:false}); } }
  // ladang di luar tembok
  const fc=[];
  for(let i=0;i<220;i++){
    const a=rnd()*Math.PI*2, r=R+2.5+rnd()*8;
    const x=Math.round(cx+Math.cos(a)*r), y=Math.round(cy+Math.sin(a)*r);
    fc.push({x,y,d:r});
  }
  fc.sort((a,b)=>a.d-b.d);
  const maxF=t.cap?10:5;
  for(const f of fc){ if(t.fields.length>=maxF) break; if(rectFree(t,f.x,f.y,6,4)){ occupy(f.x,f.y,6,4,5); t.fields.push({x:f.x,y:f.y,w:6,h:4}); } }
  // kandang ternak
  for(const f of fc){ if(rectFree(t,f.x,f.y,7,5)){ occupy(f.x,f.y,7,5,6); t.pen={x:f.x,y:f.y,w:7,h:5}; break; } }
  // dinding: daftar tile cincin
  t.wallTiles=[];
  if(t.gates.length){
    for(let a=0;a<720;a++){
      const ang=a/720*Math.PI*2;
      const x=Math.round(cx+1+Math.cos(ang)*(R+.5)), y=Math.round(cy+1+Math.sin(ang)*(R+.5));
      const key=y*MW+x;
      if(t.wallTiles.length&&t.wallTiles[t.wallTiles.length-1].k===key) continue;
      if(t.wallTiles.some(w=>w.k===key)) continue;
      const nearGate=t.gates.some(g=>Math.abs(g.x-x)<=1.5&&Math.abs(g.y-y)<=1.5);
      t.wallTiles.push({x,y,k:key,gate:nearGate,ang});
    }
  }
  G.dirty.terrain=true;
}

function townOfPx(x,y){ for(const t of G.towns){ if(dist(x/TS,y/TS,t.cx+1,t.cy+1)<t.R+0.3) return t; } return null; }
function insideWalls(t,x,y){ return t.wall.state==='done'&&dist(x/TS,y/TS,t.cx+1,t.cy+1)<t.R-.2; }
function gatePx(g,t,inner){
  const cxp=(t.cx+1)*TS, cyp=(t.cy+1)*TS;
  const gx=(g.x+.5)*TS, gy=(g.y+.5)*TS;
  const dx=gx-cxp, dy=gy-cyp, d=Math.hypot(dx,dy)||1;
  const o=inner?-14:14;
  return {x:gx+dx/d*o, y:gy+dy/d*o};
}
function setRoute(u,tx,ty){
  const pts=[]; let cx=u.x, cy=u.y;
  for(const t of G.towns){
    if(t.wall.state!=='done') continue;
    const inA=insideWalls(t,cx,cy), inB=insideWalls(t,tx,ty);
    if(inA&&!inB){ const g=nearestGate(t,tx,ty); const a=gatePx(g,t,true), b=gatePx(g,t,false); pts.push(a,b); cx=b.x; cy=b.y; }
  }
  for(const t of G.towns){
    if(t.wall.state!=='done') continue;
    const inA=insideWalls(t,cx,cy), inB=insideWalls(t,tx,ty);
    if(!inA&&inB){ const g=nearestGate(t,cx,cy); const a=gatePx(g,t,false), b=gatePx(g,t,true); a.gate={town:t.id,gi:t.gates.indexOf(g)}; pts.push(a,b); cx=b.x; cy=b.y; }
  }
  pts.push({x:tx,y:ty});
  u.path=pts;
}
function nearestGate(t,x,y){ let best=t.gates[0],bd=1e9; for(const g of t.gates){ const d=dist((g.x+.5)*TS,(g.y+.5)*TS,x,y); if(d<bd){bd=d;best=g;} } return best; }

function addBuilding(t,type,slot,extra={}){
  const def=BLD[type];
  let x,y,w=def.w,h=def.h;
  if(type==='istana'){ x=t.palace.x; y=t.palace.y; }
  else if(type==='tenda'){ x=extra.x; y=extra.y; }
  else { x=slot.x; y=slot.y; slot.used=true; }
  const b={id:newId(),type,town:t.id,x,y,w,h,race:t.race,progress:0,work:def.work,paid:false,done:type==='tenda',owner:extra.owner||null,slot:slot?t.slots.indexOf(slot):-1,built:yearInt()};
  G.blds.push(b); G.bMap.set(b.id,b);
  if(!b.done) t.queue.push(b.id);
  return b;
}
function bldDoor(b){ return {x:(b.x+b.w/2)*TS, y:(b.y+b.h)*TS+2}; }
function freeSlot(t){ return t.slots.find(s=>!s.used)||null; }
function townBuildings(t,type){ return G.blds.filter(b=>b.town===t.id&&(!type||b.type===type)); }
function hasDone(t,type){ return G.blds.some(b=>b.town===t.id&&b.type===type&&b.done); }
function houseResidents(b){ return G.units.filter(u=>!u.dead&&u.home===b.id); }

function newWorld(seed,races,startPop){
  races = races&&races.length?races:['manusia','elf','dwarf'];
  seed = seed ?? Math.floor(Math.random()*1e6);
  srand(seed);
  const {tiles,E}=genTerrain(seed);
  G={seed,tiles,E,trees:new Uint8Array(MW*MH),road:new Uint8Array(MW*MH),occ:new Uint8Array(MW*MH),
     step:0,units:[],uMap:new Map(),blds:[],bMap:new Map(),towns:[],kingdoms:[],dungeons:[],parties:[],nests:[],chron:[],grave:{},
     gods:GODS.map(g=>({id:g.id,sanity:80+ri(0,15),auto:true,pending:null,cool:0})),
     nextId:1,dirty:{terrain:true,chron:true,fields:true},luck:0,prophecy:false,demonCount:0,possess:null,colorIdx:0,firstContact:{}};
  for(let i=0;i<MW*MH;i++){ const t=tiles[i]; if(t===T.FOREST) G.trees[i]=rnd()<.85?1:0; else if(t===T.GRASS&&rnd()<.04) G.trees[i]=1; else if(t===T.HILLS&&rnd()<.08) G.trees[i]=1; }
  const sites=[];
  for(const race of races){
    const s=findSite(race,sites,26); if(s){ sites.push(s); foundKingdom(race,s.x,s.y,true); }
  }
  if(startPop&&startPop>G.units.length) setupPopulation(startPop);
  for(let i=0;i<15+Math.floor((startPop||0)/150);i++) placeNest();
  for(let i=0;i<4;i++) placeDungeon(true);
  placeVeins(34); placeDen('goblin'); placeDen('goblin'); placeDen('orc'); worldUpgrade(); worldUpgrade8();
  log(`Tahun 0. ${['','Satu','Dua','Tiga','Empat','Lima'][G.kingdoms.length]} rombongan pendiri tiba di tanah baru, berjauhan satu sama lain. Mereka belum tahu ada yang mengawasi dari langit.`,'god');
  return G;
}

function findSite(race,taken,R){
  let best=null,bs=-1e9;
  const home=RACE[race].home;
  for(let i=0;i<900;i++){
    const x=ri(R+8,MW-R-10), y=ri(R+8,MH-R-10);
    if(!buildable(tileAt(x,y))) continue;
    if(taken.some(s=>dist(s.x,s.y,x,y)<(i<600?105:75))) continue;
    if(G.towns.some(t=>dist(t.cx,t.cy,x,y)<t.R+R+14)) continue;
    let s=0;
    for(let dy=-R;dy<=R;dy+=2)for(let dx=-R;dx<=R;dx+=2){
      if(dx*dx+dy*dy>R*R) continue;
      const t=tileAt(x+dx,y+dy);
      if(t===T.GRASS||t===T.SAND) s+=2; else if(t===T.FOREST||t===T.DESERT) s+=1.3; else if(t===T.HILLS) s+=.9; else s-=4;
    }
    for(let dy=-R-10;dy<=R+10;dy+=4)for(let dx=-R-10;dx<=R+10;dx+=4){ const t=tileAt(x+dx,y+dy); if(home.includes(t)) s+=.8; if(t===T.WATER) s+=.3; }
    if(s>bs){bs=s;best={x,y};}
  }
  return best;
}

function newTown(k,cx,cy,cap,R){
  const t={id:newId(),name:townName(k.race),kingdom:k.id,race:k.race,cx,cy,R,cap,walled:cap,
    stock:{food:cap?300:80,wood:cap?170:40,stone:cap?150:20,ore:0,goods:0},queue:[],wall:{state:'none',progress:0,paid:false},
    founded:yearInt(),phase:cap?'awal':'desa',welfare:60,fed:true};
  G.towns.push(t);
  planTown(t);
  initHerd(t);
  return t;
}
function townName(race){ const R=RACE[race]; const suf={manusia:['ford','burg','vale','helm','ton'],elf:['lorien','thil','dell','wyn','loth'],dwarf:['heim','dun','forge','hold','delve'],beastkin:['taka','mura','den','rock'],iblis:['gorath','zul','mora','nox'],halfelf:['wyn','vale']}[race]; return pick(R.syl[0])+pick(suf); }

function adultAge(race,f){ const R=RACE[race]; return R.adult+(R.life[0]*.62-R.adult)*f; }
function foundKingdom(race,cx,cy,initial){
  const R=RACE[race];
  const k={id:newId(),race,name:`${R.kpre} ${genName(race,'m')}`,color:KCOLS[G.colorIdx++%KCOLS.length],capital:null,king:null,queen:null,consorts:[],
    treasury:420,tax:.15,welfare:60,founded:yearInt(),alive:true,heir:null};
  G.kingdoms.push(k);
  const t=newTown(k,cx,cy,true,22); k.capital=t.id;
  const cxp=(cx+1)*TS, cyp=(cy+1)*TS;
  const spot=()=>{ for(let i=0;i<60;i++){ const a=rnd()*Math.PI*2, r=3+rnd()*9; const x=Math.round(cx+Math.cos(a)*r), y=Math.round(cy+3+Math.sin(a)*r*.7); if(buildable(tileAt(x,y))&&!G.road[y*MW+x]&&(G.occ[y*MW+x]===0||G.occ[y*MW+x]===4)) return {x,y}; } return {x:cx+ri(-8,8),y:cy+ri(3,8)}; };
  const mkFamily=(head,partnerSex,kids,royal)=>{
    const ts=spot(); const tent=addBuilding(t,'tenda',null,{x:ts.x,y:ts.y});
    const px=(ts.x+1.5)*TS, py=(ts.y+3)*TS;
    head.home=tent.id; head.x=px; head.y=py;
    let partner=null;
    if(partnerSex){
      partner=makeUnit({race,sex:partnerSex,age:adultAge(race,rnd()*.6),town:t.id,kingdom:k.id,home:tent.id,x:px+6,y:py,marga:head.marga});
      marry(head,partner,true);
    }
    for(let i=0;i<kids;i++){
      const mom=head.sex==='f'?head:partner, dad=head.sex==='m'?head:partner;
      const c=makeUnit({race,age:rnd()*R.adult*.9,mother:mom&&mom.id,father:dad&&dad.id,town:t.id,kingdom:k.id,home:tent.id,x:px+ri(-8,8),y:py+ri(2,8),marga:head.marga});
      if(royal){ c.royal=k.id; c.title=c.sex==='m'?'Pangeran':'Putri'; }
    }
    head.ownsTent=true;
    return {tent,partner};
  };
  // raja & ratu
  const strong=BERKAT.map((b,i)=>[b,i]).filter(([b])=>!b.uniq&&b.s>=2&&b.s<=4);
  const ks=rnd()<.7?'m':'f';
  const king=makeUnit({race,sex:ks,age:adultAge(race,.25+rnd()*.3),town:t.id,kingdom:k.id,b:pick(strong)[1],lvl:ri(6,14),gold:120});
  king.royal=k.id; king.title=ks==='m'?'Raja':'Ratu'; k.king=king.id;
  if(rnd()<.5&&!has(king,'Adil')&&!has(king,'Kejam')) king.traits.push(pick(['Adil','Bijak','Serakah','Kejam','Karismatik']));
  const {partner:queen}=mkFamily(king,ks==='m'?'f':'m',ri(1,2),true);
  queen.royal=k.id; queen.title=ks==='m'?'Permaisuri':'Pangeran Konsor'; k.queen=queen.id;
  // keluarga rakyat
  const fam=initial?7:5;
  for(let i=0;i<fam;i++){
    const h=makeUnit({race,sex:'m',age:adultAge(race,rnd()*.7),town:t.id,kingdom:k.id});
    mkFamily(h,'f',wpick([0,1,2,3],x=>[2,3,3,1][x]),false);
  }
  // lajang
  const singles=initial?10:4;
  const ts=spot(); const tent=addBuilding(t,'tenda',null,{x:ts.x,y:ts.y});
  for(let i=0;i<singles;i++){
    makeUnit({race,sex:i%2?'f':'m',age:adultAge(race,rnd()*.25),town:t.id,kingdom:k.id,home:tent.id,x:(ts.x+1.5)*TS+ri(-10,10),y:(ts.y+3)*TS+ri(0,8)});
  }
  for(const u of G.units) if(u.town===t.id&&isAdult(u)) assignCareer(u);
  updateTax(k);
  // antrean awal
  addBuilding(t,'istana');
  if(!initial) t.stock.food+=50;
  log(`${k.name} didirikan oleh ${shortName(king)} beserta ${G.units.filter(u=>u.town===t.id).length} pengikut ${R.nama}. Fokus pertama mereka: membangun istana.`,'life',{x:cxp,y:cyp});
  return {k,t,king};
}

function updateTax(k){
  const r=U(k.king); let tax=.15;
  if(r){ if(has(r,'Adil')) tax-=.07; if(has(r,'Bijak')) tax-=.03; if(has(r,'Dermawan')) tax-=.04; if(has(r,'Serakah')) tax+=.12; if(has(r,'Kejam')) tax+=.15; if(has(r,'Boros')) tax+=.05; }
  k.tax=clamp(tax,.05,.45);
}

function placeNest(){
  for(let i=0;i<300;i++){
    const x=ri(4,MW-5), y=ri(4,MH-5), t=tileAt(x,y);
    if(![T.FOREST,T.HILLS,T.MOUNT,T.DESERT,T.GRASS].includes(t)) continue;
    if(G.towns.some(tw=>dist(tw.cx,tw.cy,x,y)<tw.R+34)) continue;
    if(G.nests.some(n=>dist(n.x,n.y,x,y)<18)) continue;
    const far=Math.min(...G.towns.map(tw=>dist(tw.cx,tw.cy,x,y)),999);
    const pool=t===T.FOREST?['slime','kelelawar','wolf','babi','goblin','gobShaman','spider','hob','shadowWolf','beruang','slimeRacun']
      :t===T.DESERT?['slime','slimeApi','kobold','zombie','skel','lizard','orc','spider','golem']
      :t===T.MOUNT?['kelelawar','serigalaSalju','orc','orcLord','ogre','troll','golem','minotaur','wyvern']
      :t===T.HILLS?['kobold','goblin','babi','wolf','hob','orc','troll','beruang','gobShaman']
      :['slime','slimeAir','babi','wolf','goblin','kobold','kelelawar','lizard','rajaSlime'];
    const danger=clamp((far-55)/60,0,1);
    G.nests.push({id:newId(),x,y,pool,danger,name:`Sarang ${pick(['Lembah Kabut','Bukit Abu','Hutan Gelap','Batu Merah','Rawa Sunyi','Tebing Angin','Akar Tua','Padang Tulang','Gua Lumut','Sungai Mati'])}`});
    return;
  }
}
function placeDungeon(silent,at){
  for(let i=0;i<400;i++){
    const x=at?at.x:ri(5,MW-6), y=at?at.y:ri(5,MH-6), t=tileAt(x,y);
    if(!at&&![T.HILLS,T.MOUNT,T.FOREST,T.DESERT].includes(t)) continue;
    if(!at&&G.towns.some(tw=>dist(tw.cx,tw.cy,x,y)<tw.R+22)) continue;
    if(!at&&G.dungeons.some(d=>dist(d.x,d.y,x,y)<25)) continue;
    const d={id:newId(),name:`${pick(['Labirin','Gua','Reruntuhan','Menara','Makam','Kuil','Jurang'])} ${pick(['Bayangan','Naga Tidur','Raja Lich','Kristal','Seribu Mata','Abisal','Api Hitam','Dewa Terlupa','Kabut Merah'])}`,
      x,y,maxFloor:ri(6,16),deep:0,demon:false,born:yearInt()};
    G.dungeons.push(d);
    if(!silent) log(`Sebuah dungeon terbuka: ${d.name}. Kedalamannya belum diketahui siapa pun.`,'dun',{x:x*TS,y:y*TS});
    return d;
  }
  return null;
}

/* ---------- pernikahan ---------- */
function marry(a,b,silent){
  a.spouse=b.id; b.spouse=a.id; a.crush=null; b.crush=null;
  const ra=relOf(a,b.id), rb=relOf(b,a.id); ra.r=Math.max(ra.r,70); rb.r=Math.max(rb.r,70); ra.f=Math.max(ra.f,40); rb.f=Math.max(rb.f,40);
  a.widowOf=null; b.widowOf=null;
  const wife=a.sex==='f'?a:b, hus=a.sex==='m'?a:b;
  if(!silent){
    if(wife.royal==null&&hus.royal==null) wife.marga=hus.marga;
    hist(a,`menikah dengan ${b.name}`); hist(b,`menikah dengan ${a.name}`);
    const cross=a.race!==b.race?` Pernikahan antar-ras ${RACE[a.race].nama} dan ${RACE[b.race].nama} ini jadi buah bibir.`:'';
    const widow=(a.flags.wasWidow||b.flags.wasWidow)?' Setelah masa duka, cinta datang lagi.':'';
    log(`${fullName(hus)} dan ${fullName(wife)} menikah di ${TN(hus.town)?TN(hus.town).name:'perjalanan'}.${cross}${widow}`,'love',{x:hus.x,y:hus.y});
    FX_QUEUE.push({k:'heart',x:hus.x,y:hus.y,t:60});
    // pria lain yang menaruh hati pada pengantin
    for(const u of G.units){
      if(u.dead||u===hus||u===wife||u.sex===wife.sex) continue;
      const r=u.rel[wife.id]; if(r&&r.r>=45&&u.crush===wife.id){ u.crush=null; u.happy-=12; hist(u,`ditikung ${hus.name}`);
        if(rnd()<.6) log(`${shortName(u)} terlambat. Hati ${wife.name} sudah direbut ${hus.name}.`,'love',{x:u.x,y:u.y}); }
    }
    for(const u of G.units){
      if(u.dead||u===hus||u===wife||u.sex===hus.sex) continue;
      const r=u.rel[hus.id]; if(r&&r.r>=45&&u.crush===hus.id){ u.crush=null; u.happy-=10; hist(u,`patah hati karena ${hus.name} menikah`); }
    }
    checkDream(a); checkDream(b);
  }
}

function die(u,killer,cause){
  if(u.dead) return;
  if(has(u,'Pantang Menyerah')&&!u.flags.grit&&killer){ u.flags.grit=yearInt(); u.hp=1; hist(u,'menolak tumbang dan bangkit lagi'); if(isAdult(u)&&u.lvl>=8) log(`${fullName(u)} seharusnya tumbang, tapi menolak menyerah dan bangkit lagi.`,'hero',{x:u.x,y:u.y}); return; }
  const wasInside=u.inside&&!u.patient;
  u.dead=true; u.hp=0; u.inside=false; u.downed=null; u.patient=null; u.fx=null;
  if(u.ally) allyDeath(u);
  if(killer&&killer.flags&&killer.flags.murder&&killer.flags.murder.target===u.id) murderResolved(killer,u);
  if(u.possessed){ u.possessed=false; G.possess=null; G.dirty.possess=true; }
  for(const p of u.pets||[]){ const m=U(p); if(m&&!m.dead) releasePet(m,u); }
  if(u.race==='monster'){
    addCorpse(u);
    if(u.named){ const o=U(u.tamer); const sp=U(u.spouse); if(sp) sp.spouse=null; if(o){ hist(o,`kehilangan ${u.petName}`); o.happy-=12; } log(`${u.name}, monster bernama yang mengabdi pada ${o?fullName(o):'keluarganya'}, gugur${killer?' melawan '+killer.name:''}.`,'war',{x:u.x,y:u.y}); return; }
    if(u.tamer){ const o=U(u.tamer); if(o){ o.pets=(o.pets||[]).filter(i=>i!==u.id); hist(o,`kehilangan ${u.petName}`); o.happy-=10; } log(`${u.petName}, ${MON[u.mk].n} jinak milik ${o?fullName(o):'seseorang'}, gugur${killer?' melawan '+killer.name:''}.${o&&tamerInfo(o)?` ${o.name} bisa menjinakkan makhluk lain.`:''}`,'war',{x:u.x,y:u.y}); return; }

function succeed(k,old){

  if(!heir){ const pool=G.units.filter(u=>!u.dead&&u.kingdom===k.id&&isAdult(u)&&u.race!=='monster'); pool.sort((a,b)=>(b.lvl+(has(b,'Karismatik')?8:0)+(has(b,'Pemimpin Lahir')?6:0))-(a.lvl+(has(a,'Karismatik')?8:0))); heir=pool[0]; }

  if(cap){ const pal=G.blds.find(b=>b.town===cap.id&&b.type==='istana'); if(pal&&pal.done){ heir.home=pal.id; const sp=U(heir.spouse); if(sp){ sp.home=pal.id; sp.royal=k.id; sp.title=heir.sex==='m'?'Permaisuri':'Pangeran Konsor'; k.queen=sp.id; } } }

  checkDream(heir);
}

/* ---------- karier ---------- */
function assignCareer(u){
  if(BERKAT[u.b]&&BERKAT[u.b].hv&&isAdult(u)){ u.career=BERKAT[u.b].n==='Hunter'||BERKAT[u.b].n==='Hunter & Tamer'?'hunter':'kurir'; return; }
  if(u.royal&&['Raja','Ratu','Permaisuri','Pangeran Konsor','Selir'].includes(u.title)) { u.career='istana'; return; }
  const role=roleOf(u);
  if(tamerInfo(u)){ u.career='petualang'; return; }
  if(role==='buru'&&!u.career&&(has(u,'Pemberani')||has(u,'Jiwa Petualang')||rnd()<.3)){ u.career='petualang'; return; }
  if(!COMBAT_ROLES.has(role)){ u.career=(has(u,'Jiwa Petualang')||has(u,'Pemberani')||has(u,'Ambisius'))&&!has(u,'Penakut')&&rnd()<.55?'petualang':'kerja'; return; }
  if(u.career==='petualang'||u.career==='penjaga') return;
  const t=TN(u.town);
  const guards=t?G.units.filter(v=>!v.dead&&v.town===t.id&&v.career==='penjaga').length:0;
  const combat=t?G.units.filter(v=>!v.dead&&v.town===t.id&&isAdult(v)&&COMBAT_ROLES.has(roleOf(v))).length:0;
  const target=Math.max(2,Math.round(combat*.42));
  let adv=has(u,'Pemberani')||has(u,'Jiwa Petualang')||has(u,'Ambisius')||rnd()<.5;
  if(has(u,'Penakut')||has(u,'Rumahan')) adv=false;
  if(guards<2) adv=false;
  if(guards>=target) adv=true;
  if(role==='pencuri') adv=true;
  u.career=adv?'petualang':'penjaga';
  if(BERKAT[u.b].s>=3&&u.career==='penjaga'&&!u.title) u.title='Ksatria';
}

/* ---------- grid spasial ---------- */
let GRID=new Map();
function buildGrid(){
  GRID=new Map();
  for(const u of G.units){ if(u.dead||u.inside) continue; const k=((u.x>>5)<<10)|(u.y>>5); let b=GRID.get(k); if(!b){b=[];GRID.set(k,b);} b.push(u); }
}
function near(x,y,r,fn){
  const out=[]; const cx=x>>5, cy=y>>5, rr=Math.ceil(r/32);
  for(let gy=cy-rr;gy<=cy+rr;gy++)for(let gx=cx-rr;gx<=cx+rr;gx++){
    if(gx<0||gy<0) continue; const b=GRID.get((gx<<10)|gy); if(!b) continue;
    for(const v of b) if(!v.dead&&dist(x,y,v.x,v.y)<r&&fn(v)) out.push(v);
  }
  return out;
}
function nearest(x,y,r,fn){ let best=null,bd=r; const cx=x>>5, cy=y>>5, rr=Math.ceil(r/32);
  for(let gy=cy-rr;gy<=cy+rr;gy++)for(let gx=cx-rr;gx<=cx+rr;gx++){
    if(gx<0||gy<0) continue; const b=GRID.get((gx<<10)|gy); if(!b) continue;
    for(const v of b){ if(v.dead) continue; const d=dist(x,y,v.x,v.y); if(d<bd&&fn(v)){bd=d;best=v;} } }
  return best; }

/* ---------- gerak ---------- */
function speedOf(u){
  if(u.race==='monster') return MON[u.mk].spd*1.4*(u.variant&&VARIANTS[u.variant].spd||1)*(hasFx(u,'slow')?.5:1)*(u.tamer?1.25:1);
  let s=2.4; const st=stageOf(u);
  if(st==='tua') s*=.65; else if(st==='anak') s*=.85; else if(st==='bayi') s*=.4;
  if(has(u,'Lincah')) s*=1.2; if(u.mounted) s*=2.1; if(u.mountMon) s*=1.9; if(u.sick) s*=.6;
  if(!isLand(tileOfPx(u.x,u.y))) s*=.45;
  if(hasFx(u,'slow')) s*=.5;
  return s;
}
function followPath(u){
  const p=u.path[0];
  const dx=p.x-u.x, dy=p.y-u.y, d=Math.hypot(dx,dy);
  const s=speedOf(u);
  if(d<=s){ u.x=p.x; u.y=p.y; u.path.shift(); if(p.gate) onGate(u,p.gate); if(!u.path.length) u.moving=false; return; }
  u.x+=dx/d*s; u.y+=dy/d*s; u.moving=true;
  if(Math.abs(dx)>Math.abs(dy)*1.1){ u.dir='side'; u.flip=dx<0; } else { u.dir=dy<0?'up':'down'; u.flip=false; }
}
function goTo(u,x,y){ setRoute(u,x,y); }
function jitter(p,r=8){ return {x:p.x+(rnd()*2-1)*r, y:p.y+(rnd()*2-1)*r*.6}; }

    return playTask(u,t,home); }

function playTask(u,t,home){

/* ---------- ladang & ternak ---------- */
const CROPS={gandum:{n:'Gandum',yield:26},kubis:{n:'Kubis',yield:22},labu:{n:'Labu',yield:30},jagung:{n:'Jagung',yield:28}};
const ANIMAL_N={cow:'sapi',sheep:'domba',chicken:'ayam'};
function plotState(f){ return f.st||'kosong'; }
function farmTask(u,t){
  if(!t.fields||!t.fields.length) return false;
  const s=seasonIdx();
  const score=f=>{ const st=plotState(f); let p=st==='matang'?100:st==='layu'?70:st==='kosong'?(s===3?-99:55):(G.step-(f.care||0))>DAY*1.1?42:6;
    const b=U(f.busy); if(b&&b!==u&&b.task&&b.task.k==='farm'&&b.task.plot===t.fields.indexOf(f)) p-=80;
    return p-dist(u.x/TS,u.y/TS,f.x+3,f.y+2)*.25; };
  const f=t.fields.slice().sort((a,b)=>score(b)-score(a))[0];
  if(!f||score(f)<0) return false;
  const st=plotState(f);
  const act=st==='matang'?'panen':st==='layu'?'bersihkan':st==='kosong'?'tanam':'rawat';
  f.busy=u.id;
  goTo(u,(f.x+.6+rnd()*(f.w-1.2))*TS,(f.y+.8+rnd()*(f.h-1.4))*TS);
  u.task={k:'farm',plot:t.fields.indexOf(f),act,t:{tanam:45,rawat:30,panen:55,bersihkan:35}[act]};

}
function farmStep(u,k){

  const t=TN(u.town); const f=t&&t.fields[k.plot]; if(!f){ u.task=null; return; }
  f.busy=null; const r=workRate(u);
  if(k.act==='tanam'){ f.st='bibit'; f.g=0; f.care=G.step; f.planted=G.step; f.crop=pick(Object.keys(CROPS)); f.owner=u.id; gainXp(u,1); u.task=null; return; }
  if(k.act==='rawat'){ f.care=G.step; f.g=Math.min(100,(f.g||0)+5*r); f.owner=f.owner||u.id; gainXp(u,.6); u.task=null; return; }
  if(k.act==='bersihkan'){ f.st='kosong'; f.g=0; f.care=G.step; gainXp(u,.5); u.task=null; return; }
  if(k.act==='panen'){
    if(plotState(f)!=='matang'){ u.task=null; return; }
    const late=Math.max(0,(G.step-(f.ripe||G.step))/DAY);
    let amt=(CROPS[f.crop]||CROPS.gandum).yield*r*(1-Math.min(.5,late*.1))*(has(u,'Pencinta Alam')?1.1:1)*(inDisaster(u.town,'kemarau')?.35:1);
    if(stageOf(u)==='remaja') amt*=.6;

    u.carry={res:'food',amt}; gainXp(u,2);

    goTo(u,d.x+ri(-6,6),d.y); u.task={k:'deposit'};

function fieldsDaily(t){

      if(sf>0&&G.step-(f.care||0)>DAY*5){ f.st='layu'; }

    case 'patrol': if(--k.t<=0) u.task=null; break;
    case 'chat': {
      const o=U(k.with); if(!o||o.dead||o.inside){ u.task=null; return; }
      if(dist(u.x,u.y,o.x,o.y)>30){ if(G.step%10===0) goTo(u,o.x+(u.x<o.x?-8:8),o.y); if(--k.t<=-80) u.task=null; return; }

      if(--k.t<=0){ socialize(u,o,k.court,k.gift); u.task=null; }
      break; }
    case 'shop': if(--k.t<=0){ spend(u); u.task=null; } break;

    case 'trade': tradeStep(u,k); break;
    case 'party': partyStep(u,k); break;
    case 'fight': fightStep(u,k); break;
    case 'flee': if(--k.t<=0) u.task=null; break;
    case 'steal': infilStep(u,k); break;
    default: u.task=null;

}
function faceEach(a,b){ a.dir='side'; a.flip=b.x<a.x; b.dir='side'; b.flip=a.x<b.x; a.moving=false; b.moving=false; }
function workRate(u){ let r=1; if(has(u,'Stamina Kuat')) r*=1.15; if(has(u,'Rajin')) r*=1.3; if(has(u,'Pekerja Keras')) r*=1.2; if(has(u,'Pemalas')) r*=.7; if(stageOf(u)==='tua') r*=.7; if(u.hunger>2) r*=.7; return r; }

/* ---------- waktu luang & hubungan ---------- */
function leisureTask(u,t,home){
  if(!t){ u.task={k:'idle',t:40}; return; }
  if(romanceEligible(u)&&rnd()<(u.sex==='m'?(u.crush?.85:.6):has(u,'Romantis')?.4:.12)&&courtTask(u,t)) return;
  const opts=[];
  const add=(k,w)=>opts.push([k,w]);
  add('chat',4); add('wander',1.5);
  if(romanceEligible(u)){ add('court',u.sex==='m'?(has(u,'Romantis')||has(u,'Penggoda')?6:3.2):(has(u,'Romantis')?2.2:.9)); }
  if(u.spouse) add('spouse',3);
  if(has(u,'Religius')||has(u,'Haus Ilmu')) add('pray',3);
  if(hasDone(t,'guild')&&(has(u,'Pemabuk')||u.career==='petualang')) add('drink',has(u,'Pemabuk')?5:1.2);
  if(hasDone(t,'pasar')&&u.gold>12) add('shop',has(u,'Boros')?4:1.4);
  if(has(u,'Rumahan')&&home) add('home',3);
  if(has(u,'Penyendiri')) add('wander',3);
  const k=wpick(opts,o=>o[1])[0];
  if(k==='court'&&courtTask(u,t)) return;
  if(u.spouse&&(has(u,'Bergairah')||has(U(u.spouse)||u,'Bergairah'))&&rnd()<.1&&isAdult(u)){ const s=U(u.spouse); if(s&&!s.inside&&!s.possessed&&dist(s.x,s.y,u.x,u.y)<500&&(!s.task||['idle','chat','shop','pray','drink'].includes(s.task.k))&&startIntimate(u,s)) return; }
  if(k==='spouse'){ const s=U(u.spouse); if(s&&!s.inside&&dist(s.x,s.y,u.x,u.y)<400){ pinFor(s,u); goTo(u,s.x+8,s.y); u.task={k:'chat',with:s.id,t:0,court:true}; return; } }
  if(k==='pray'){ const kb=townBuildings(t,'kuil').find(b=>b.done); if(kb){ const d=bldDoor(kb); goTo(u,d.x+ri(-8,8),d.y+ri(0,5)); u.task={k:'pray',t:60}; return; } }
  if(k==='drink'){ const gb=townBuildings(t,'guild').find(b=>b.done); const d=bldDoor(gb); goTo(u,d.x+ri(-10,10),d.y+ri(0,6)); u.task={k:'drink',t:60}; return; }
  if(k==='shop'){ const pb=townBuildings(t,'pasar').find(b=>b.done); const d=bldDoor(pb); goTo(u,d.x+ri(-12,12),d.y+ri(0,6)); u.task={k:'shop',t:50}; return; }
  if(k==='home'&&home){ const d=bldDoor(home); goTo(u,d.x,d.y); u.task={k:'idle',t:80}; return; }
  if(k==='chat'){ const o=chatPartner(u,t); if(o){ pinFor(o,u); goTo(u,o.x+(u.x<o.x?-8:8),o.y); u.task={k:'chat',with:o.id,t:0}; return; } }
  const c={x:(t.cx+1)*TS,y:(t.cy+1)*TS}; const p=jitter(c,60); goTo(u,p.x,p.y); u.task={k:'idle',t:ri(30,70)};
}
function chatPartner(u,t){
  const cands=near(u.x,u.y,130,v=>v!==u&&v.race!=='monster'&&v.town===u.town&&!v.inside&&isAdult(v)===isAdult(u)&&!(v.task&&['fight','trade','party','build','work'].includes(v.task.k)));
  if(!cands.length) return null;
  return wpick(cands,v=>{ const r=u.rel[v.id]; return 1+(r?Math.max(0,r.f)/20:0); });
}
function courtTask(u,t){
  let c=U(u.crush);
  if(!c||c.dead||!canRomance(u,c)){ u.crush=null; c=null; }
  if(!c||rnd()<.02){
    const cands=G.units.filter(v=>!v.dead&&v.race!=='monster'&&v.town===u.town&&canRomance(u,v));
    if(!cands.length) return false;
    let best=null,bs=-1;
    for(const v of cands){ const r=u.rel[v.id]; const s=(r?r.r:0)+compat(u,v)*35+rnd()*10; if(s>bs){bs=s;best=v;} }
    if(!best) return false;
    u.crush=best.id; c=best;
  }
  if(c.inside||dist(c.x,c.y,u.x,u.y)>200) return false;
  const gift=u.gold>=10&&(has(u,'Romantis')||rnd()<.3)&&u.sex==='m'||u.gold>=10&&rnd()<.1;
  pinFor(c,u); goTo(u,c.x+(u.x<c.x?-8:8),c.y); u.task={k:'chat',with:c.id,t:0,court:true,gift};
  return true;
}
function pinFor(o,u,dur){ if(o.possessed||o.inside||o.dead) return false; const k=o.task&&o.task.k; if(k&&!['idle','chat','shop','pray','drink','work','patrol','stall','craft','wander','guildwork','clerk'].includes(k)) return false; if(k&&!dur&&!['idle','chat','shop','pray','drink'].includes(k)) return false; if(o.carry&&dur){ deposit(o,o.carry.res,o.carry.amt); o.carry=null; } o.path=[]; o.task={k:'idle',t:dur||70}; o.dir='side'; o.flip=u.x<o.x; return true; }
function socialize(a,b,court,gift){
  const ra=relOf(a,b.id), rb=relOf(b,a.id);
  ra.t=G.step; rb.t=G.step;
  let df=3+rnd()*3; if(has(a,'Ramah')||has(b,'Ramah')) df+=2; if(has(a,'Penyendiri')) df-=1.5; if(has(a,'Sabar')) df+=1;
  if((has(a,'Pemarah')||has(b,'Pemarah'))&&!has(a,'Sabar')&&!has(b,'Sabar')&&rnd()<.12){ ra.f-=10; rb.f-=10; FX_QUEUE.push({k:'anger',x:(a.x+b.x)/2,y:a.y-22,t:40}); if(rb.f<-40&&rnd()<.3) log(`${shortName(a)} dan ${shortName(b)} bertengkar hebat di depan umum.`,'',{x:a.x,y:a.y}); return; }
  ra.f=clamp(ra.f+df,-100,100); rb.f=clamp(rb.f+df,-100,100);

    if(gift&&(a.gifts>0||a.gold>=8)){ let cost=0; if(a.gifts>0){ a.gifts--; } else { cost=ri(5,Math.min(25,Math.floor(a.gold))); a.gold-=cost; } gain+=9+rnd()*10+(has(b,'Serakah')?4:0); const g=pick(GIFTS); hist(b,`menerima ${g} dari ${a.name}`); FX_QUEUE.push({k:'gift',x:b.x,y:b.y-24,t:50});
      if(rnd()<.08) log(`${shortName(a)} memberikan ${g} kepada ${shortName(b)}. Wajah ${b.name} memerah.`,'love',{x:a.x,y:a.y}); }
    rb.r=clamp(rb.r+gain,0,100);

}
function bestSuitor(w){
  let best=null,bs=-1;
  for(const id in w.rel){ const v=U(+id); if(!v||v.dead||v.sex===w.sex||!canRomance(w,v)) continue; if(w.rel[id].r>bs){bs=w.rel[id].r;best=v;} }
  return [best,bs];
}
function tryPropose(a,b){
  const ra=a.rel[b.id], rb=b.rel[a.id]; if(!ra||!rb) return;
  if(ra.r<56) return;
  const man=a.sex==='m'?a:b, woman=a.sex==='m'?b:a;
  if(a.sex==='f'&&!has(a,'Romantis')) return; // biasanya pria yang melamar
  const her=woman.rel[man.id].r;
  const [best,bs]=bestSuitor(woman);
  if(her>=50&&(best===man||bs-her<8)){ marry(man,woman); housingFor(man); return 'ya'; }
  if(ra.r>=85&&her<40){ ra.r-=25; a.happy-=10; hist(a,`lamarannya ditolak ${b.name}`); if(rnd()<.35) log(`${shortName(a)} memberanikan diri melamar ${shortName(b)}, tapi ditolak dengan halus.`,'love',{x:a.x,y:a.y}); return 'tolak'; }
  return null;
}
function housingFor(head){
  const t=TN(head.town); if(!t) return;
  const sp=U(head.spouse);
  // pindah ke rumah kosong bila ada
  const empty=G.blds.find(b=>b.town===t.id&&b.type==='rumah'&&b.done&&houseResidents(b).length===0);
  if(empty){ empty.owner=head.id; moveFamily(head,empty); return; }
  const own=G.blds.find(b=>b.type==='rumah'&&(b.owner===head.id||sp&&b.owner===sp.id));
  if(own){ moveFamily(head,own); return; }
  const s=freeSlot(t); if(s) addBuilding(t,'rumah',s,{owner:head.id});
}
function spend(u){
  const k=K(u.kingdom); const t=TN(u.town);
  // belanja barang di pasar: uang masuk ke pedagang yang berjaga
  if(t&&t.stock.goods>=1&&u.gold>priceOf(t,'goods')+2&&!has(u,'Hemat')||t&&has(u,'Boros')&&t.stock.goods>=1){
    const cost=priceOf(t,'goods'); t.stock.goods-=1; u.gold-=cost; u.happy+=3; u.gifts=(u.gifts||0)+(rnd()<.4?1:0);
    const sellers=G.units.filter(v=>!v.dead&&v.town===u.town&&v.task&&v.task.k==='stall');
    if(sellers.length){ const s=pick(sellers); s.gold+=cost; s.flags.sales=(s.flags.sales||0)+1; FX_QUEUE.push({k:'coin',x:s.x,y:s.y-22,t:30}); } else if(k) k.treasury+=cost;
  }

    if(rnd()<.25){ u.app.cloth=pick(CLOTH); if(rnd()<.4) u.app.outfit=u.sex==='f'&&rnd()<.4?'gaun':pick(OUTFITS); } }
}

/* ---------- penjaga gerbang & penyusup ---------- */
function onGate(u,info){
  const t=TN(info.town); if(!t||t.wall.state!=='done') return;
  if(u.kingdom===t.kingdom&&!u.flags.infil) return;
  const g=t.gates[info.gi];
  const guards=near(gatePx(g,t,false).x,gatePx(g,t,false).y,40,v=>v.career==='penjaga'&&v.town===t.id&&v.task&&v.task.k==='guard');
  if(!guards.length) return;
  const gd=guards.sort((a,b)=>b.lvl-a.lvl)[0];
  const k=K(t.kingdom);
  if(u.flags.infil){
    let p=.4+gd.lvl*.015-u.lvl*.015+(has(gd,'Jujur')?.15:0)+(guards.length>1?.1:0); if((gd.corrupt||0)>=50) p*=.4;
    if(rnd()<p){ u.flags.caught=true; hist(gd,`menangkap penyusup di gerbang ${t.name}`); gainXp(gd,15);
      log(`${fullName(gd)} memergoki penyusup di gerbang ${g.side==='N'?'utara':g.side==='S'?'selatan':g.side==='E'?'timur':'barat'} ${t.name}. Penyusup itu kabur sambil terluka.`,'war',{x:u.x,y:u.y});
      u.hp*=.5; u.path=[]; u.task={k:'steal',phase:'flee'}; const out=gatePx(g,t,false); goTo(u,out.x+(out.x-(t.cx+1)*TS)*3,out.y+(out.y-(t.cy+1)*TS)*3); }
    return;
  }
  // pedagang asing
  const toll=Math.min(u.gold,2); u.gold-=toll; if(k) k.treasury+=toll;
  if(u.flags.smuggle){ const p=.35+gd.lvl*.01+(has(gd,'Jujur')?.15:0);
    if(rnd()<p){ const fine=Math.floor(u.gold*.5); u.gold-=fine; if(k) k.treasury+=fine; u.flags.smuggle=false; log(`Penjaga ${t.name} menyita barang selundupan ${shortName(u)} dan mendendanya ${fine} emas.`,'war',{x:u.x,y:u.y}); } }
}
function spawnInfiltrator(t){
  const a=rnd()*Math.PI*2, r=(t.R+22)*TS;
  const x=(t.cx+1)*TS+Math.cos(a)*r, y=(t.cy+1)*TS+Math.sin(a)*r;
  if(!isLand(tileOfPx(x,y))) return;
  const race=pick(PLAY_RACES);
  const u=makeUnit({race,age:adultAge(race,.2),b:BIDX(rnd()<.8?'Pencuri Bayangan':'Assassin'),x,y,lvl:ri(3,14),gold:0});
  u.flags.infil=true; u.flags.target=t.id; u.title='Penyusup'; u.traits=['Licik',pick(['Lincah','Pemberani','Penakut'])];
  u.task=null; u.path=[];
}
function infilTask(u){
  const t=TN(u.flags.target);
  if(!t||u.flags.done){ u.task={k:'steal',phase:'flee'}; const a=rnd()*Math.PI*2; goTo(u,u.x+Math.cos(a)*400,u.y+Math.sin(a)*400); return; }
  const pal=G.blds.find(b=>b.town===t.id&&b.type==='istana'&&b.done)||G.blds.find(b=>b.town===t.id&&b.done&&b.type!=='tenda');
  if(!pal){ u.flags.done=true; return; }
  const d=bldDoor(pal); goTo(u,d.x,d.y); u.task={k:'steal',phase:'in',town:t.id};

function infilStep(u,k){
  if(k.phase==='in'){
    const t=TN(k.town); const kd=t&&K(t.kingdom);
    if(kd){ const amt=Math.floor(Math.min(kd.treasury*.15,90)); kd.treasury-=amt; u.gold+=amt; u.flags.done=true;
      log(`Pagi harinya ${t.name} gempar: kas kerajaan berkurang ${amt} emas. Seorang penyusup berhasil masuk dan kabur.`,'war',{x:u.x,y:u.y}); }
    u.task=null; return;
  }

/* ---------- perdagangan ---------- */
function tradeTask(u,t){
  const dests=G.towns.filter(o=>o!==t&&dist(o.cx,o.cy,t.cx,t.cy)<320);
  if(!dests.length) return stallTask(u,t);
  const foreign=dests.filter(o=>o.kingdom!==t.kingdom);
  const d=foreign.length&&rnd()<.75?pick(foreign):pick(dests);
  updatePrices(t); updatePrices(d);
  const cargo={}; const pop=G.units.filter(v=>v.town===t.id).length;
  const surplus={food:t.stock.food-pop*8-30,wood:t.stock.wood-80,stone:t.stock.stone-80,ore:t.stock.ore-10,goods:t.stock.goods-6};
  const opts=Object.keys(surplus).filter(r=>surplus[r]>5).sort((a,b)=>priceOf(d,b)/priceOf(t,b)-priceOf(d,a)/priceOf(t,a));
  let load=0; const capL=(t.carts||0)>0?60:30;

  if(!load){ return stallTask(u,t); }
  u.flags.smuggle=has(u,'Licik')&&rnd()<.35;
  u.mounted={c:pick(['#7a4a2a','#2a2220','#e8e2d6','#a8602a','#9a9a98']),mane:pick(['#2a1a12','#e8d8a8','#141010']),saddle:u.app.cloth2,cart:capL>30};
  const pb=G.blds.find(b=>b.town===d.id&&b.type==='pasar'&&b.done);
  const p=pb?bldDoor(pb):{x:(d.cx+1)*TS,y:(d.cy+2)*TS};
  goTo(u,p.x,p.y); u.task={k:'trade',phase:'go',dest:d.id,cargo,t:0,from:t.id};
}
const RES_N={food:'pangan',wood:'kayu',stone:'batu',ore:'bijih',goods:'barang'};
function tradeStep(u,k){

  if(k.phase==='go'&&k.tribute){ if(u.path.length) return; k.phase='rest'; k.t=40; return; }
  if(k.phase==='go'){
    if(!d){ k.phase='back'; }
    else {
      updatePrices(d);
      let val=0; for(const r in k.cargo){ val+=k.cargo[r]*priceOf(d,r); d.stock[r]=(d.stock[r]||0)+k.cargo[r]; }
      const kd=K(d.kingdom); const pay=val+3; if(kd) kd.treasury=Math.max(0,kd.treasury-pay); u.gold+=pay;
      const ownK=K(u.kingdom); if(ownK){ const tax=pay*ownK.tax*.5; u.gold-=tax; ownK.treasury+=tax;
        const st=ownK.trade||(ownK.trade={y:yearInt(),trips:0,value:0,partners:{}}); if(st.y!==yearInt()){ ownK.lastTrade={...st}; st.y=yearInt(); st.trips=0; st.value=0; st.partners={}; }
        st.trips++; st.value+=pay; if(d.kingdom!==u.kingdom) st.partners[d.kingdom]=(st.partners[d.kingdom]||0)+1; }
      if(d.kingdom!==u.kingdom){ u.visited[d.kingdom]=true; checkDream(u);
        const key=[u.kingdom,d.kingdom].sort().join('-'); if(!G.firstContact[key]){ G.firstContact[key]=1; log(`Kafilah pertama dari ${K(u.kingdom)?.name||'negeri jauh'} tiba di ${d.name}. ${shortName(u)} membuka jalur dagang antara dua kerajaan.`,'life',{x:u.x,y:u.y}); }
        else if(rnd()<.1) log(`Kafilah ${shortName(u)} dari ${home?.name||'?'} tiba di ${d.name} membawa ${Object.entries(k.cargo).map(([r,q])=>q+' '+RES_N[r]).join(', ')} dan pulang dengan ${Math.round(pay)} emas.`,'life',{x:u.x,y:u.y}); }
      gainXp(u,4);
    }
    k.phase='rest'; k.t=60;
  } else if(k.phase==='rest'){
    if(--k.t>0) return;
    if(home){ const pb=G.blds.find(b=>b.town===home.id&&b.type==='pasar'&&b.done); const p=pb?bldDoor(pb):{x:(home.cx+1)*TS,y:(home.cy+2)*TS}; goTo(u,p.x,p.y); }
    k.phase='back';
  } else if(k.phase==='back'){ u.mounted=null; u.flags.smuggle=false; u.task=null; }
}

  // berburu sendiri di sekitar ladang

function isHostile(a,b){
  if(a.downed||b.downed||a.dead||b.dead) return false;
  if(a.flags&&a.flags.den&&denPeace(a)||b.flags&&b.flags.den&&denPeace(b)) return false;
  if(b.flags&&b.flags.sea&&(a.tamer||a.race!=='monster'&&attackRange(a)<30)) return false;
  if(a.flags&&a.flags.sea&&(b.tamer||b.race!=='monster'&&attackRange(b)<30)) return false;
  const sa=sideOf(a), sb=sideOf(b);
  if(sa!==sb) return !b.inside&&!a.inside;
  if(sa==='M') return false;
  if(a.race==='monster'||b.race==='monster') return false;
  if(a.flags.infil&&b.career==='penjaga'||b.flags.infil&&a.career==='penjaga') return a.flags.caught||b.flags.caught;
  if(a.flags.murder&&a.flags.murder.target===b.id&&a.flags.murderActive>G.step||b.flags.murder&&b.flags.murder.target===a.id&&b.flags.murderActive>G.step) return true;
  if(b.flags.wanted>G.step&&a.career==='penjaga'||a.flags.wanted>G.step&&b.career==='penjaga') return true;
  return false;
}
function canFight(u){ if(u.downed||u.patient) return false; return u.race==='monster'||u.career==='petualang'&&isAdult(u)||isAdult(u)&&(COMBAT_ROLES.has(roleOf(u))||roleOf(u)==='buru')&&!u.royal||u.title==='Raja'&&COMBAT_ROLES.has(roleOf(u)); }
function threatCheck(u){

  if(hasFx(u,'fear')||hasFx(u,'charm')) return;
  if(u.task&&u.task.k==='trade'&&u.task.phase==='go'&&rnd()<.5) return;
  const r=canFight(u)?(u.career==='penjaga'||u.party?90:60):40;
  const e=nearest(u.x,u.y,r,v=>isHostile(u,v));
  if(!e) return;
  let brave=canFight(u)&&!(has(u,'Penakut')&&e.hp>u.hp);
  if(brave&&sideOf(e)==='M'){
    const allies=near(u.x,u.y,90,v=>v.race!=='monster'&&canFight(v)&&!v.inside);
    const mine=allies.reduce((s,v)=>s+v.hp*v.atk,0)+1, theirs=near(e.x,e.y,70,v=>sideOf(v)==='M').reduce((s,v)=>s+v.hp*v.atk,0);
    const inHunt=u.party&&partyOf(u)?.state==='hunt'; if(theirs*(has(u,'Pemberani')||has(u,'Pantang Menyerah')||inHunt?.9:1.5)>mine&&!inTownZone(u.x,u.y)) brave=false;
  }
  if(brave&&!u.ally&&e.race==='monster'&&MON[e.mk]&&RANK_ORDER.indexOf(MON[e.mk].rank)>=6&&u.lvl<28&&!u.possessed) brave=false;
  if(u.ally&&canFight(u)) brave=true;
  if(brave){ u.path=[]; u.task={k:'fight',target:e.id,t:0}; }
  else if(isAdult(u)||stageOf(u)!=='bayi'){
    const h=B(u.home); u.path=[];
    if(h){ const d=bldDoor(h); goTo(u,d.x,d.y); u.task={k:'sleep'}; }
    else { goTo(u,u.x+(u.x-e.x)*2,u.y+(u.y-e.y)*2); u.task={k:'flee',t:60}; }
  }
}
function attackRange(u){ if(u.race==='monster') return MON[u.mk]&&MON[u.mk].ranged||11; return RANGED_ROLES.has(roleOf(u))?44:11; }
function fightStep(u,k){
  const e=U(k.target);
  if(!e||e.dead||e.inside||e.downed||!isHostile(u,e)){ u.task=null; return; }
  if(hasFx(u,'fear')||hasFx(u,'charm')){ u.task=null; return; }
  if(hasFx(u,'stun')){ u.path=[]; u.moving=false; return; }
  if(hasFx(u,'blind')){ u.path=[]; u.moving=false; if(G.step%20===0) FX_QUEUE.push({k:'say',x:u.x,y:u.y-24,t:16,s:'?!'}); return; }
  const d=dist(u.x,u.y,e.x,e.y);
  if(d>200){ u.task=null; return; }
  if(u.race==='monster'&&!u.tamer&&!raiding(u)&&inTownZone(e.x,e.y)){ u.task=null; u.path=[]; return; }
  if(u.race==='monster'&&!u.tamer&&u.cd<=0&&castSkill(u,e)) return;
  const rng=attackRange(u);
  if(d>rng){ if(!u.path.length||G.step%6===0) u.path=[{x:e.x,y:e.y}]; return; }
  u.path=[]; u.moving=false; u.dir='side'; u.flip=e.x<u.x;
  if(u.cd>0) return;

  if(u.race==='monster'&&u.tamer&&castSkill(u,e)) return;

  if(!e.dead&&u.isekai&&e.race==='monster') tryName(u,e);
  if(!e.dead&&e.race!=='monster'&&e.task&&e.task.k!=='fight'&&canFight(e)&&!hasFx(e,'fear')&&!hasFx(e,'charm')){ e.task={k:'fight',target:u.id}; e.path=[]; }

}

function stepMonster(u){

    let bt=null,bd=55*TS; for(const t of G.towns){ const d=dist((t.cx+1)*TS,(t.cy+1)*TS,u.x,u.y); if(d<bd){bd=d;bt=t;} }

  }
  if(rnd()<.03){ const a=rnd()*Math.PI*2, r=rnd()*12*TS; const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r; if(isLand(tileOfPx(x,y))&&(raiding(u)||!inTownZone(x,y))) u.path=[{x,y}]; }
}

      let h=50;
      h+=t.fed?8:-18; h-=u.hunger*4;
      const hb=B(u.home); h+= hb&&hb.type!=='tenda'?10:-6;

    for(const u of ppl){

  }

  // monster

  densDaily();
  for(const t of G.towns) armoryDaily(t);
  warbandDaily();

  for(const n of G.nests){

    const local=near((n.x+.5)*TS,(n.y+.5)*TS,16*TS,v=>v.race==='monster').length;
    if(local<3&&rnd()<.35){ const maxR=Math.min(yearInt()<12?4:5,1+Math.floor(yearInt()/8)+(n.danger>1.2&&yearInt()>=6?1:0)); const pool=n.pool.filter(k=>RANK_ORDER.indexOf(MON[k].rank)<=maxR&&!(RANK_ORDER.indexOf(MON[k].rank)>=5&&rnd()<.6)); if(!pool.length) continue; const kind=pick(pool); maybeVariant(spawnMonster(kind,(n.x+.5+rnd()*3)*TS,(n.y+.5+rnd()*3)*TS,n),yearInt()<4?.05:.12); }
  }
  for(const m of G.units){ if(m.race==='monster'&&!m.dead&&!m.tamer&&!MON[m.mk].legend&&!m.flags.sea&&!m.flags.warband&&!m.flags.den&&G.step-m.bornStep>YEAR*3) m.dead=true; }
  if(G.mcorpses) G.mcorpses=G.mcorpses.filter(c=>G.step-c.step<DAY*.5);
  godsDaily();
}
function lifeDaily(u){
  if(isAdult(u)) corruptionDaily(u);
  const st=stageOf(u), a=ageOf(u), R=RACE[u.race];
  if(u.flags.infil) return;
  // tumbuh dewasa
  if(isAdult(u)&&!u.career){ assignCareer(u); hist(u,'tumbuh dewasa'); }
  if(isAdult(u)&&!u.motif) u.motif=rollMotif(u);
  if(u.flags.terbuang) terbuangCheck(u);
  // sakit
  if(u.sick>0){ u.sick--; u.hp-=u.maxHp*.08*(st==='tua'||st==='bayi'?1.5:1); if(u.hp<=0){ die(u,null,'meninggal karena sakit'); return; } }
  else { let p=.0018; if(has(u,'Rentan Sakit')) p*=3; if(st==='tua'||st==='bayi') p*=2; if(u.hunger>1) p*=2; if(rnd()<p){ u.sick=ri(2,6); hist(u,'jatuh sakit'); } }
  if(!u.sick&&u.hp<u.maxHp) u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.25);
  // usia
  if(a>u.life&&rnd()<.3){ die(u,null,'wafat dengan tenang karena usia tua'); return; }
  // kehamilan
  if(u.preg&&G.step>=u.preg.due){ const dad=person(u.preg.father); u.preg=null; u.lastBirth=G.step; if(dad) birth(u,dad); }
  // tahun duka berakhir
  if(u.widowOf&&!u.noRemarry&&u.mournUntil<=nowY()&&!u.flags.mournDone){ u.flags.mournDone=true; hist(u,'masa duka berakhir'); }
  checkDream(u);
}
function childRace(m,f){
  const a=m.race,b=f.race;
  if(a===b) return a;
  const set=new Set([a,b]);
  if(set.has('elf')&&(set.has('manusia')||set.has('halfelf'))) return 'halfelf';
  return rnd()<.5?a:b;
}

function foundVillage(t,k){

    if(x<16||y<16||x>MW-17||y>MH-17) continue; if(G.towns.some(o=>dist(o.cx,o.cy,x,y)<o.R+16)) continue;
    if(G.nests.some(n=>n.legend&&dist(n.x,n.y,x,y)<46)||(G.dens||[]).some(d=>dist(d.x,d.y,x,y)<30)||G.dungeons.some(d=>dist(d.x,d.y,x,y)<18)) continue;
    let s=0; for(let dy=-12;dy<=12;dy+=2)for(let dx=-12;dx<=12;dx+=2){ const tt=tileAt(x+dx,y+dy); s+=buildable(tt)?1:-3; }
    for(const n of G.nests){ const dd=dist(n.x,n.y,x,y); if(dd<26) s-=(26-dd)*1.5*(1+(n.danger||1)); }
    if(s>bs){bs=s;best={x,y};} }
  if(!best||bs<30) return;
  const v=newTown(k,best.x,best.y,false,13); v.stock.food=120; v.stock.wood=80; v.stock.stone=30;
  const s0=freeSlot(v); if(!s0){ G.towns=G.towns.filter(x=>x!==v); return; }

  let n=0;
  for(const h of fams){ const s=freeSlot(v); if(!s) break; const b=addBuilding(v,'rumah',s,{owner:h.id});
    const sp=U(h.spouse); const fam=[h,sp,...h.children.map(U).filter(c=>c&&!isAdult(c))].filter(Boolean);
    for(const m of fam){ m.town=v.id; m.home=null; m.task=null; goTo(m,(v.cx+1)*TS+ri(-20,20),(v.cy+2)*TS+ri(-10,10)); n++; }
    b.pendingFamily=true; }

}

function divorce(a,b,why){
  if(a.spouse!==b.id) return;
  a.spouse=null; b.spouse=null; a.flags.ex=b.id; b.flags.ex=a.id;
  const ra=relOf(a,b.id), rb=relOf(b,a.id); ra.r=Math.min(ra.r,8); rb.r=Math.min(rb.r,8); ra.f-=35; rb.f-=35;
  a.mournUntil=b.mournUntil=nowY()+.5; a.happy-=20; b.happy-=20;
  const hus=a.sex==='m'?a:b, wife=a.sex==='m'?b:a;
  const hb=B(wife.home);
  if(hb&&hb.type==='rumah'&&hb.owner===hus.id){ const par=U(wife.mother)||U(wife.father); const ph=par&&B(par.home); wife.home=ph?ph.id:(G.blds.find(x=>x.town===wife.town&&x.type==='tenda')?.id||null); }
  else if(hb&&hb.owner===wife.id){ const par=U(hus.mother)||U(hus.father); const ph=par&&B(par.home); hus.home=ph?ph.id:(G.blds.find(x=>x.town===hus.town&&x.type==='tenda')?.id||null); }
  hist(a,`bercerai dengan ${b.name}`); hist(b,`bercerai dengan ${a.name}`);
  log(`${fullName(hus)} dan ${fullName(wife)} resmi bercerai${why?' '+why:''}.`,'love',{x:a.x,y:a.y});
}
function affairsDaily(t,people){
  for(const u of people){
    if(u.affair){ const l=U(u.affair); if(!l||l.dead){ u.affair=null; continue; }
      if(u.id<l.id){
        const ra=relOf(u,l.id), rb=relOf(l,u.id); ra.r=Math.min(100,ra.r+2); rb.r=Math.min(100,rb.r+2); ra.t=rb.t=G.step;
        if(rnd()<.05) FX_QUEUE.push({k:'heart',x:(u.x+l.x)/2,y:Math.min(u.y,l.y)-24,t:40});
        for(const [cheater,victimId] of [[u,u.spouse],[l,l.spouse]]){

          let p=.06+(has(v,'Cerdas')?.04:0)-(has(cheater,'Licik')?.03:0); if(rnd()<p){ scandal(cheater,cheater===u?l:u,v,t); return; }

    if(spR<40) p*=3; if(has(u,'Penggoda')) p*=3; if(has(u,'Bergairah')) p*=2; if((u.corrupt||0)>=40) p*=4; if(has(u,'Jujur')) p*=.3; if(has(u,'Rendah Hati')) p*=.6;
    if(rnd()>p) continue;
    const cands=people.filter(v=>v!==u&&v!==sp&&v.sex!==u.sex&&isAdult(v)&&!related(u,v)&&!v.affair&&!has(v,'Setia Abadi')&&!(v.title==='Raja'||v.title==='Ratu')&&((v.rel[u.id]?.r||0)>=25||compat(u,v)>.65)&&Math.abs(ageOf(u)/RACE[u.race].life[0]-ageOf(v)/RACE[v.race].life[0])<.25);
    const l=cands.sort((a,b)=>((b.rel[u.id]?.r||0)+compat(u,b)*30)-((a.rel[u.id]?.r||0)+compat(u,a)*30))[0];

  }

function scandal(cheater,lover,victim,t){

/* ---------- langkah utama ---------- */
function step(){
  G.step++;
  buildGrid();
  const us=G.units;
  for(let i=0;i<us.length;i++){
    const u=us[i]; if(u.dead) continue;
    u.px=u.x; u.py=u.y;
    if(u.race==='monster'){ stepMonster(u); continue; }
    if(u.flags.abroad) continue;
    if(u.cd>0) u.cd--;
    if(u.captive) continue;
    if(u.fx){ fxTick(u); if(u.dead) continue; }
    if(u.downed){ if(G.step>u.downed.until){ die(u,null,`tewas karena luka parah setelah diserang ${u.downed.by}`); continue; } const c=U(u.downed.carrier); if(c){ u.x=c.x+3; u.y=c.y-1; u.flip=c.flip; } continue; }
    if(u.bag){ if(u.bag.phoenix) phoenixCheck(u); if(u.maxMp) mpRegen(u); }
    if(u.patient&&!u.possessed){ patientStep(u); continue; }
    if(u.inside&&u.party&&G.parties.find(p=>p.id===u.party)?.state==='in'){ partyStep(u,{}); continue; }
    if(u.possessed){ possessStep(u); continue; }
    if((G.step+u.id)%6===0&&!u.inside) threatCheck(u);
    if(u.path.length){ u.inside=false; followPath(u); continue; }
    if(!u.task) chooseTask(u);

/* ---------- IQ & motif ---------- */
function rollIQ(ma,pa){
  let base=100, sd=14;
  const ps=[ma,pa].filter(p=>p&&p.iq); if(ps.length){ base=ps.reduce((s,p)=>s+p.iq,0)/ps.length; sd=10; }
  let v=base+((rnd()+rnd()+rnd()-1.5)/1.5)*sd*1.7;
  return Math.round(clamp(v,55,165));
}
function iqLabel(iq){ return iq>=145?'Jenius':iq>=125?'Sangat cerdas':iq>=110?'Cerdas':iq>=90?'Rata-rata':iq>=75?'Lamban':'Sangat lamban'; }
function iqMult(u){ return .55+(u.iq||100)/220; }
const MOTIF={uang:'Hidup untuk uang',keluarga:'Hidup untuk keluarga',ilmu:'Hidup untuk ilmu',kejayaan:'Hidup untuk kejayaan',kekuasaan:'Hidup untuk kekuasaan',iman:'Hidup untuk iman',kebebasan:'Hidup untuk kebebasan',dendam:'Hidup untuk balas dendam'};
function rollMotif(u){
  const w={uang:2,keluarga:4,ilmu:1,kejayaan:1.5,kekuasaan:.6,iman:1,kebebasan:1};
  if(has(u,'Serakah')||has(u,'Hemat')) w.uang+=4; if(has(u,'Penyayang Anak')||has(u,'Romantis')||has(u,'Setia Abadi')) w.keluarga+=4;
  if(has(u,'Haus Ilmu')||has(u,'Cerdas')||(u.iq||100)>=125) w.ilmu+=4; if(has(u,'Pemberani')||has(u,'Jiwa Petualang')) w.kejayaan+=4;
  if(has(u,'Ambisius')||has(u,'Licik')) w.kekuasaan+=3; if(has(u,'Religius')) w.iman+=5; if(has(u,'Penyendiri')||has(u,'Jiwa Petualang')) w.kebebasan+=2;
  if(COMBAT_ROLES.has(roleOf(u))) w.kejayaan+=2; if(roleOf(u)==='dagang') w.uang+=3;
  return wpick(Object.keys(w),k=>w[k]);
}

/* ---------- keluarga monster & dendam ---------- */
function monFamily(mk){
  if(['goblin','gobShaman','hob','kobold'].includes(mk)) return 'goblin';
  if(['orc','orcLord'].includes(mk)) return 'orc';
  if(['zombie','skel','arwah','lichIblis'].includes(mk)) return 'mayat';
  if(['wolf','shadowWolf','serigalaSalju'].includes(mk)) return 'serigala';
  if(MON[mk]&&MON[mk].demon) return 'iblis';
  if(['wyvern','nagaBayangan'].includes(mk)) return 'naga';
  return 'buas';
}
const SLAYER={goblin:['Goblin Slayer',25],orc:['Pemburu Orc',14],mayat:['Pembasmi Mayat Hidup',18],serigala:['Pemburu Serigala',18],iblis:['Pemburu Iblis',10],naga:['Pembunuh Naga',2],buas:['Pemburu Binatang Buas',18]};

function witnessTrigger(victim,killer){
  if(!killer||killer.race!=='monster'||killer.tamer) return;
  const fam=monFamily(killer.mk);

    const saw=dist(k.x,k.y,victim.x,victim.y)<140&&!k.inside;
    if(!saw&&k.town!==victim.town) continue;
    let p=saw?.09:.025; if(fam==='goblin') p*=1.4; if(stageOf(k)==='anak'||stageOf(k)==='remaja') p*=1.3; if(has(k,'Pendendam')) p*=2.5; if(has(k,'Pemaaf')) p*=.3;
    k.flags.vendTried=1;
    if(rnd()>p) continue;
    k.vendetta={fam,kills:0,since:yearInt(),who:victim.name,saw}; k.motif='dendam';
    if(!has(k,'Pendendam')&&!conflicts('Pendendam',k.traits)) k.traits.push('Pendendam');
    hist(k,`bersumpah memburu setiap ${FAMN[fam]} setelah ${victim.name} tewas${saw?' di depan matanya':''}`);
    log(`${fullName(k)} ${saw?'menyaksikan':'mendengar kabar'} ${victim.name} tewas oleh ${killer.name}. Sejak hari itu ${k.sex==='m'?'ia':'ia'} hanya hidup untuk satu hal: memburu setiap ${FAMN[fam]}.`,'hero',{x:k.x,y:k.y});

const ORE={besi:{n:'Besi',atk:4,c:'#b8b0a8',w:60},perak:{n:'Perak',atk:6,c:'#e0e8f0',w:25},mithril:{n:'Mithril',atk:10,c:'#7fe0ff',w:10},adamantit:{n:'Adamantit',atk:15,c:'#c78aff',w:3}};

function placeVeins(n){
  G.veins=G.veins||[];
  for(let k=0;k<n;k++) for(let i=0;i<200;i++){
    const x=ri(3,MW-4), y=ri(3,MH-4), t=tileAt(x,y); if(t!==T.HILLS&&t!==T.MOUNT) continue;
    if(G.veins.some(v=>dist(v.x,v.y,x,y)<6)||G.occ[y*MW+x]) continue;
    const far=Math.min(...G.towns.map(tw=>dist(tw.cx,tw.cy,x,y)),999);
    let type=wpick(Object.keys(ORE),o=>ORE[o].w*(o==='mithril'&&far>45?3:1)*(o==='adamantit'&&(far>60||t===T.MOUNT)?3:1));
    if(type==='adamantit'&&t!==T.MOUNT) type='mithril';
    const amt={besi:ri(300,600),perak:ri(150,300),mithril:ri(60,140),adamantit:ri(25,70)}[type];
    G.veins.push({id:newId(),x,y,type,amt,max:amt}); break;
  }
}
function oreStock(t){ t.ores=t.ores||{besi:0,perak:0,mithril:0,adamantit:0}; return t.ores; }
function syncOre(t){ const o=oreStock(t); t.stock.ore=o.besi+o.perak+o.mithril+o.adamantit; }
function mineTask(u,t){
  const vs=(G.veins||[]).filter(v=>v.amt>0&&dist(v.x,v.y,t.cx,t.cy)<70).sort((a,b)=>dist(a.x,a.y,t.cx,t.cy)-dist(b.x,b.y,t.cx,t.cy));
  if(!vs.length) return false;
  const want=wpick(['besi','perak','mithril','adamantit'],o=>({besi:6,perak:3,mithril:1.5,adamantit:1})[o]*(vs.some(v=>v.type===o)?1:0)||0.0001);
  const v=vs.find(x=>x.type===want)||vs[0];

function smithSkill(u){

  if(has(u,'Perfeksionis')) s+=.06; if(b.n==='Penempa Legendaris') s+=.12; if(b.n==='Empu Para Dewa') s+=.22; if(u.race==='dwarf') s+=.04;

function makeWeapon(u,t){

function wName(w){ return !w?'':typeof w==='string'?w:w.name; }
function wAtk(w){ return !w?0:typeof w==='string'?10:w.atk+wAtkBonus(w); }
function wPrice(w){ return Math.round(w.atk*4*(1+w.rar*.6)); }
function equip(u,w,how){ if(martial(u)&&w.type!=='Tinju'&&how!=='paksa'){ const t=TN(u.town); if(t){ t.armory=t.armory||[]; t.armory.push(w); } return; } if(u.weapon&&typeof u.weapon==='object'){ const t=TN(u.town); if(t&&how!=='warisan'){ t.armory=t.armory||[]; t.armory.push(u.weapon); } } w.owners=(w.owners||[]).concat(u.name).slice(-6); u.weapon=w; hist(u,`${how==='warisan'?'mewarisi':how==='hadiah'?'menerima':'membeli'} ${w.name}`); }
function armoryDaily(t){
  if(!t.armory||!t.armory.length) return;
  const k=K(t.kingdom);
  const fighters=G.units.filter(u=>!u.dead&&u.town===t.id&&isAdult(u)&&(u.career==='petualang'||u.career==='penjaga'||(u.title==='Raja'&&COMBAT_ROLES.has(roleOf(u)))));

      if(u.gold>=price){ u.gold-=price; const mk=U(w.maker); if(mk) mk.gold+=price*.6; if(k) k.treasury+=price*.4; t.armory=t.armory.filter(x=>x!==w); equip(u,w,'beli'); if(w.rar>=3&&rnd()<.5) log(`${fullName(u)} membeli "${w.name}" (${RARITY[w.rar][0]}) seharga ${price} emas.`,'life',{x:u.x,y:u.y}); break; }
    }

function inheritWeapon(u){
