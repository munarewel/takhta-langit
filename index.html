function pickAt(wx,wy){
  const r=14/Math.min(1,R_.cam.z/2);
  let best=null,bd=r;
  for(const u of G.units){ if(u.dead||u.inside) continue; const d=dist(u.x,u.y-8,wx,wy); if(d<bd){bd=d;best=u;} }
  if(best) return {type:'unit',id:best.id};
  for(const d of G.dungeons){ if(dist((d.x+.5)*TS,(d.y+.5)*TS,wx,wy)<12) return {type:'dun',id:d.id}; }
  for(const c of G.corpses||[]){ if(dist(c.x,c.y-4,wx,wy)<10) return {type:'unit',id:c.id}; }
  for(const d of G.dens||[]){ if(dist((d.x+.5)*TS,(d.y+.5)*TS,wx,wy)<14) return {type:'den',id:d.id}; }
  for(const t of G.towns){ if(!t.graves) continue; const sl=graveSlots(t); for(const gr of t.graves){ const s=sl[gr.slot]; if(s&&Math.abs(s.x-wx)<5&&wy<s.y+3&&wy>s.y-12) return {type:'grave',id:t.id,pid:gr.pid}; } }
  for(const b of G.blds){ if(wx>=b.x*TS&&wx<=(b.x+b.w)*TS&&wy>=(b.y-1)*TS&&wy<=(b.y+b.h)*TS) return {type:'bld',id:b.id}; }
  for(const t of G.towns){ if(t.pen){ const p=t.pen; if(wx>=p.x*TS&&wx<=(p.x+p.w)*TS&&wy>=p.y*TS&&wy<=(p.y+p.h)*TS) return {type:'pen',id:t.id}; }
    for(let i=0;i<(t.fields||[]).length;i++){ const f=t.fields[i]; if(wx>=f.x*TS&&wx<=(f.x+f.w)*TS&&wy>=f.y*TS&&wy<=(f.y+f.h)*TS) return {type:'plot',id:t.id,i}; } }
  const t=townOfPx(wx,wy); if(t) return {type:'town',id:t.id};
  return null;
}
function nearestTownTo(wx,wy,maxTiles){ let best=null,bd=maxTiles*TS; for(const t of G.towns){ const d=dist((t.cx+1)*TS,(t.cy+1)*TS,wx,wy); if(d<bd){bd=d;best=t;} } return best; }

  if(G.possess&&(UI.tool==='lihat'||UI.tool==='rasuki')){ const u=U(G.possess); if(u){ u.task=null; goTo(u,wx,wy); FX_QUEUE.push({k:'hit',x:wx,y:wy,t:12}); return; } }
  const t=UI.tool;

function possessAction(a){
  const u=U(G.possess); if(!u) return;
  const tg=U(UI.ptarget);
  let m=null;
  if(a==='lepas'){ unpossess(); return; }
  if(a==='batal'){ u.pendingAct=null; u.path=[]; m='Dibatalkan.'; }
  else if(a==='panggil') m=possessSummon(u,tg);
  else if(a==='mesra'){ const s=U(u.spouse); m=s?possessGoAct(u,s,'mesra'):'Kamu belum menikah.'; }
  else if(['ngobrol','hadiah','kencan','lamar','emas','tanding','ejek','bisik'].includes(a)) m=possessGoAct(u,tg,a);
  else if(a==='serang') m=possessAttack(u)||`${u.name} menerjang monster terdekat.`;
  else m=possessAct(u,a,tg);
  if(m) toast(m);
  setTimeout(renderPossess,60);
}

let statT=0, autoT=0;
function frame(t){
  if(UI.perf) PF.frameStart(t);
  const rawDt=t-lastT; const dt=Math.min(100,rawDt||16); lastT=t;
  if(!UI.skip&&rawDt>0&&rawDt<3000){ UI.fpsAcc=(UI.fpsAcc||0)+rawDt; UI.fpsN=(UI.fpsN||0)+1; if(UI.fpsAcc>3000){ const avg=UI.fpsAcc/UI.fpsN; UI.fps=Math.round(1000/avg); UI.fpsAcc=0; UI.fpsN=0; if(avg>70&&!UI.lowQ&&!UI.lowQAsked){ UI.lowQAsked=true; setLowQ(true); toast('Grafik otomatis diturunkan ke mode hemat supaya lebih lancar.'); } } }
  if(UI.skip){ skipTick(); requestAnimationFrame(frame); return; }
  const sp=timeHold()?0:UI.speed;
  if(sp>0){
    acc+=dt*sp*4/1000;
    let n=0; const maxN=Math.max(3,Math.ceil(sp*4/40)+2);
    { const t0=performance.now(); while(acc>=1&&n<maxN){ step(); acc-=1; n++; } if(UI.perf) PF.add('simulasi',performance.now()-t0); }
    if(n>=maxN) acc=Math.min(acc,1);
    R_.alpha=sp>=30?1:clamp(acc,0,1);
  } else R_.alpha=1;
  pullFx();
  if(UI.follow&&UI.sel&&UI.sel.type==='unit'){ const u=U(UI.sel.id); if(u){ const r={width:R_.cv.width/R_.dpr,height:R_.cv.height/R_.dpr}; const tx=u.x-r.width/2/R_.cam.z, ty=u.y-r.height/2/R_.cam.z; R_.cam.x+=(tx-R_.cam.x)*.15; R_.cam.y+=(ty-R_.cam.y)*.15; } else UI.follow=false; }
  { const t0=performance.now(); drawWorld(); if(UI.perf) PF.add('gambar',performance.now()-t0); }
  if(UI.dv) drawDV(); else dvAutoCheck();
  statT+=dt; if(statT>400){ statT=0; stats(); if(G.dirty.chron&&UI.tab==='kronik'){ G.dirty.chron=false; UI.pdirty=true; } if(['detail','dewa','kerajaan','party','arsip'].includes(UI.tab)&&possT%3===0) UI.pdirty=true; { const t0=performance.now(); renderPanel(false); if(UI.perf) PF.add('panel',performance.now()-t0); } possT++; if(G.possess&&possT%2===0) renderPossess(); }
  autoT+=dt; if(autoT>180000){ autoT=0; if(G.savedOnce) saveGame(true); }

}

function lordWhisper(d,act){

function startSkip(years){

function renderSkip(){
  const s=UI.skip; if(!s) return; const box=$('setup'); box.hidden=false;

  <div class="row"><button class="btn warn" data-sks="1">Berhenti di sini</button></div></div>`;
  box.onclick=e=>{ if(e.target.closest('[data-sks]')&&UI.skip) UI.skip.cancel=true; };
}
let skipRT=0;
function skipTick(){
  const s=UI.skip; if(!s) return;
  const t0=performance.now();
  while(performance.now()-t0<45&&G.step<s.to&&!s.cancel) step();
  FX_QUEUE.length=0; R_.fx.length=0;
  if(G.step>=s.to||s.cancel){ finishSkip(); return; }
  if(performance.now()-skipRT>250){ skipRT=performance.now(); renderSkip(); }
}
function finishSkip(){
  const s=UI.skip; UI.skip=null;
  const a=s.snap, b=worldSnap(); const log_=G.skipLog||[]; G.skipLog=null;
  const yrs=b.y-a.y;
  const oldK=a.kings.map(k=>k.id), newK=b.kings.filter(k=>!oldK.includes(k.id)), fell=a.kings.filter(k=>!b.kings.some(x=>x.id===k.id));
  const minor=/menyelesaikan quest|memasuki|keluar dari .*lantai|\(peringkat [FEDC]\)|Ketua Guild|membawa berkat ★★★ |Pencari Bakat .* menemukan|Sarang .* dibasmi|Kepala .* tumbang|dihancurkan sampai makhluk terakhir|lulus dari/;
  const pick40=log_.filter(e=>(e.kind==='hero'||/runtuh|didirikan|Eksodus|Kudeta|Legenda|Nubuat|Pahlawan|Raja Iblis bersemayam|dunia lain|dicuri/.test(e.text))&&!minor.test(e.text));
  const show=(pick40.length>40?pick40.filter((e,i)=>i%Math.ceil(pick40.length/40)===0):pick40);
  const box=$('setup'); box.hidden=false;

  ${tl.length?`<p class="sub" style="margin-top:6px">Juara turnamen: ${tl.map(x=>`Th ${x.y} ${personLink(x.champ)}`).join(' · ')}</p>`:''}</div>`;
}
function arenaPanel(bd){
  const t=TN(bd.town); const T=G.tourney&&G.tourney.ar===bd.id?G.tourney:null; const last=(G.tourneyLog||[]).find(x=>x.town===(t&&t.name));
  return `<div class="card"><h3>Arena Turnamen ${t?esc(t.name):''}</h3><p class="sub" style="margin:0">Turnamen Kerajaan digelar tiap 4 tahun di ibu kota terkaya. 8 petarung terkuat dunia bertarung sampai satu juara tersisa.</p>
  ${T?`<h4>Turnamen tahun ${T.y}</h4><p class="sub">${T.state==='gather'?'Peserta sedang berkumpul.':T.cur?`Laga sekarang: ${personLink(T.cur.a)} vs ${personLink(T.cur.b)}`:'Menunggu laga berikutnya.'}</p><p class="sub">Peserta: ${T.ent.map(id=>personLink(id)).join(', ')}</p>${T.log.length?`<ul class="log">${T.log.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}`:'<p class="sub">Belum ada turnamen berlangsung.</p>'}
  ${last&&!T?`<h4>Turnamen terakhir (Th ${last.y})</h4><ul class="log">${last.log.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}</div>`;
}

/* ---------- dunia lain: daftar koloni & penonton koloni ---------- */
HINT.layar="Ketuk dekat ibu kota kerajaan di tepi pantai. Sebagian warganya akan berlayar ke dunia lain yang hanya dihuni monster.";
function colonyHtml(k){
  const cs=(G.colonies||[]).filter(c=>c.from===k.id); const sail=(G.sailing||[]).filter(s=>s.from===k.id&&!s.ret);
  let h='';
  if(G.disaster&&G.disaster.towns.some(id=>TN(id)&&TN(id).kingdom===k.id)) h+=`<p class="sub" style="color:#f0b060;margin:4px 0">⚠ ${esc(DISASTERS[G.disaster.type].n)} sedang melanda wilayah ini.</p>`;
  const peace=(G.dens||[]).filter(d=>d.peace===k.id&&denMembers(d).length); if(peace.length) h+=`<p class="sub" style="margin:4px 0">Berdamai dengan: ${peace.map(d=>esc(d.name)).join(', ')}</p>`;
  if(!cs.length&&!sail.length) return h;
  h+=`<h4>Dunia lain</h4>`;
  for(const s of sail) h+=`<p class="sub" style="margin:2px 0">${esc(s.name)} ${s.mode==='wait'?'menunggu penumpang di pantai':'sedang berlayar'} menuju ${esc(s.world)} (${s.crew.length} orang).</p>`;
  for(const c of cs){ const n=colonyPeople(c).length; h+=`<div class="row" style="justify-content:space-between;margin:2px 0"><span class="sub">${esc(c.name)} · ${esc(c.world)} · ${c.lost?'<span style="color:#ff9a8a">hilang</span>':`${LEVELS[c.level]} · ${n} jiwa`}</span>${c.lost?'':`<button class="btn" data-colony="${c.id}">Lihat</button>`}</div>`; }
  return h;
}
function openColony(id){ UI.dv={colony:id}; $('dview').hidden=false; }
function drawColony(){
  const cv=$('dvc'); if(!cv) return; const r=cv.getBoundingClientRect(); const dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){ cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); }
  const g=cv.getContext('2d'); g.imageSmoothingEnabled=false; g.setTransform(1,0,0,1,0,0);
  const c=(G.colonies||[]).find(x=>x.id===UI.dv.colony); const hud=$('dvhud'); if(!c){ closeDV(); return; }
  const W=NEW_WORLDS.find(w=>w.n===c.world)||NEW_WORLDS[0];
  const GW=48, GH=30; const top=cv.height*.40, avail=cv.height*.46; const ts=Math.max(4,Math.floor(Math.min(cv.width/GW,avail/GH))); const ox=Math.floor((cv.width-ts*GW)/2), oy=Math.floor(top+(avail-ts*GH)/2);
  g.fillStyle='#1d3a5f'; g.fillRect(0,0,cv.width,cv.height);
  const rr=mulberry(c.seed); const blobs=[]; for(let i=0;i<7;i++) blobs.push({x:10+rr()*28,y:6+rr()*18,r:6+rr()*7}); const cx=blobs.reduce((s,b)=>s+b.x,0)/blobs.length, cy=blobs.reduce((s,b)=>s+b.y,0)/blobs.length+1; blobs.push({x:cx,y:cy,r:8});
  const land=(x,y)=>blobs.some(b=>Math.hypot(x-b.x,(y-b.y)*1.3)<b.r);
  const lc=W.c;
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){ if(land(x,y)){ g.fillStyle=(x+y)%2?lc:shade(lc,.08); g.fillRect(ox+x*ts,oy+y*ts,ts,ts); if(!land(x,y+1)){ g.fillStyle='#dcc994'; g.fillRect(ox+x*ts,oy+(y+.7)*ts,ts,ts*.3); } } }
  const now=performance.now(); const sc=ts/7; const frm=Math.floor(now/160)%4;
  const spr=(img,X,Y,s,fl)=>{ g.save(); g.translate(Math.round(X),Math.round(Y)); if(fl) g.scale(-1,1); g.drawImage(img,-FX*s,-FY*s,img.width*s,img.height*s); g.restore(); };
  // bangunan
  const nb=2+c.level*3; for(let i=0;i<nb;i++){ const a=i/nb*Math.PI*2, d=2+(i%3)*1.6; const X=ox+(cx+Math.cos(a)*d*1.6)*ts, Y=oy+(cy+Math.sin(a)*d)*ts;
    if(c.level<1||i%3===0&&c.level<2){ g.fillStyle='#b89a6a'; g.beginPath(); g.moveTo(X-ts*.9,Y); g.lineTo(X,Y-ts*1.3); g.lineTo(X+ts*.9,Y); g.fill(); g.fillStyle='#4a3a2a'; g.fillRect(X-ts*.15,Y-ts*.6,ts*.3,ts*.6); }
    else { g.fillStyle='#8a6a4a'; g.fillRect(X-ts*.8,Y-ts*1,ts*1.6,ts); g.fillStyle='#6a3a2a'; g.fillRect(X-ts*1,Y-ts*1.5,ts*2,ts*.6); g.fillStyle='#ffd36a'; g.fillRect(X-ts*.2,Y-ts*.7,ts*.4,ts*.4); } }
  if(c.wall){ g.strokeStyle='#7a5a3a'; g.lineWidth=Math.max(1,ts*.25); g.beginPath(); g.ellipse(ox+cx*ts,oy+cy*ts,ts*(7+c.level),ts*(4.5+c.level*.6),0,0,7); g.stroke(); }
  // api unggun
  g.fillStyle=Math.floor(now/150)%2?'#ffb040':'#ff7a2a'; g.fillRect(ox+cx*ts-ts*.3,oy+cy*ts-ts*.5,ts*.6,ts*.6);
  // warga
  const ppl=colonyPeople(c);
  ppl.slice(0,30).forEach((u,i)=>{ const t=now/4000+i*1.7; const X=ox+(cx+Math.cos(t+i)*(3+i%5))*ts, Y=oy+(cy+Math.sin(t*1.3+i)*(2+i%3))*ts+ts; spr(unitSprite(u,'side',frm),X,Y,sc,Math.cos(t+i)<0); });
  c.tamed.slice(-5).forEach((mk,i)=>{ const M=MON[mk]; if(!M) return; const t=now/3000+i; spr(monSprite({k:M.k,c:M.c,race:M.race,job:M.job,eye:M.eye,dir:'side'},frm),ox+(cx-4+i*2+Math.sin(t))*ts,oy+(cy+4)*ts,sc*Math.min(1.3,M.sc||1),false); });
  // monster liar di tepi
  W.mons.slice(0,4).forEach((mk,i)=>{ const M=MON[mk]; if(!M) return; const b=blobs[(i+2)%blobs.length]; const t=now/2500+i*2; const X=ox+(b.x+Math.cos(t)*b.r*.6)*ts, Y=oy+(b.y+Math.sin(t)*b.r*.4)*ts; spr(monSprite({k:M.k,c:M.c,race:M.race,job:M.job,eye:M.eye,dir:'side'},frm),X,Y,sc*Math.min(1.4,M.sc||1),Math.cos(t)>0); });
  hud.innerHTML=`<div class="box"><b style="color:#9fd8ff">${esc(c.name)}</b> · ${esc(c.world)} · ${LEVELS[c.level]}<br><span class="sub">${ppl.length} jiwa · ${c.births} lahir · ${c.deaths} gugur · didirikan th ${c.founded}${U(c.leader)&&!U(c.leader).dead?` · pemimpin ${esc(U(c.leader).name)}`:''}</span><br><span class="sub">${esc(W.d)}</span></div>
  <div class="box"><ul class="log">${c.log.slice(0,3).map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`;
}

function townHeadHtml(t){
  let h=''; const c=crowding(t);
  h+=`<dt>Kepadatan</dt><dd>${c.homeless} tanpa rumah tetap${c.full?' · lahan penuh':''}${c.walled?' · bertembok':''}${(t.crowd||0)>=2?' <span style="color:#f0b060">· sesak</span>':''}</dd>`;
  if(!t.cap&&!t.hunter){ const hd=U(t.head); h+=`<dt>${headTitle(t)}</dt><dd>${hd&&!hd.dead?personLink(hd.id):'belum ada'}${t.taxCut===yearInt()?' · keringanan pajak tahun ini':''}</dd>`;
    if(t.from&&TN(t.from)) h+=`<dt>Asal</dt><dd>Pecahan dari ${esc(TN(t.from).name)}</dd>`;
    if(t.headLog&&t.headLog.length) h+=`<dt>Catatan</dt><dd><ul class="log" style="margin:0">${t.headLog.slice(0,4).map(l=>`<li>${esc(l)}</li>`).join('')}</ul></dd>`; }
  return h;
}

function councilHtml(k){
  if(k.hunter) return ''; let h='';
  if(k.souls||k.lastSummon!=null) h+=`<p class="sub" style="margin:4px 0">Jiwa terkumpul untuk pemanggilan: ${Math.floor(k.souls||0)}/30${k.lastSummon!=null?` · pemanggilan terakhir th ${k.lastSummon}`:''}</p>`;
  const L=k.councilLog&&k.councilLog[0]; if(k.council) h+=`<p class="sub" style="margin:4px 0">Rapat Dewan sedang berlangsung (${k.council.att.length} peserta).</p>`;
  if(L) h+=`<h4>Rapat Dewan terakhir (Th ${L.y})</h4>${L.res.map(r=>`<div class="sub">${esc(r.text)}: <b style="color:${r.pass?'#7fd08a':'#ff8a7a'}">${r.pass?'diterima':'ditolak'}</b> (${r.yes}–${r.no})</div>`).join('')}`;
  return h;
}
function councilPanel(bd){
  const t=TN(bd.town); const k=t&&K(t.kingdom);
  if(bd.type==='panggil') return `<div class="card"><h3>Ruang Pemanggilan ${t?esc(t.name):''}</h3><p class="sub">Lingkaran sihir untuk memanggil orang dari dunia lain. Butuh 30 jiwa dari kuburan, dikumpulkan Black Summoner. Setiap pemanggilan membuka celah yang melahirkan Raja Iblis baru.</p><p>Jiwa terkumpul: <b>${Math.floor(k&&k.souls||0)}/30</b></p>${U(tower(t).summoner)?`<p class="sub">Black Summoner: ${personLink(tower(t).summoner)}</p>`:''}</div>`;
  const C=k&&k.council; const L=k&&k.councilLog||[];
  return `<div class="card"><h3>Balai Dewan ${t?esc(t.name):''}</h3><p class="sub" style="margin:0">Tiap 2 tahun raja, ratu, para Kepala Desa dan Walikota, Ketua Guild, Black Summoner, dan bangsawan berkumpul untuk memutuskan urusan kerajaan lewat pemungutan suara. Suara raja dihitung dua.</p>
  ${C?`<h4>Rapat berlangsung</h4><p class="sub">Peserta: ${C.att.map(id=>personLink(id)).join(', ')}</p>${C.ag.map((a,i)=>`<div class="sub">${i<C.i?'✓':i===C.i&&C.state==='vote'?'▶':'·'} ${esc(a.text)}${C.res[i]?` — <b style="color:${C.res[i].pass?'#7fd08a':'#ff8a7a'}">${C.res[i].pass?'diterima':'ditolak'} ${C.res[i].yes}–${C.res[i].no}</b>`:''}</div>`).join('')}`:''}
  ${L.map(x=>`<h4>Rapat Th ${x.y} (${x.n} peserta)</h4>${x.res.map(r=>`<div class="sub">${esc(r.text)}: <b style="color:${r.pass?'#7fd08a':'#ff8a7a'}">${r.pass?'diterima':'ditolak'}</b> (${r.yes}–${r.no})</div>`).join('')}`).join('')}</div>`;
}
