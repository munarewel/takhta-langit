/* ---------- kapal & kereta ---------- */
function coastPoint(t){
  if(t.coast!==undefined) return t.coast;
  let best=null,bd=1e9;
  for(let y=t.cy-t.R-16;y<=t.cy+t.R+16;y++) for(let x=t.cx-t.R-16;x<=t.cx+t.R+16;x++){
    if(tileAt(x,y)!==T.WATER&&tileAt(x,y)!==T.DEEP) continue;
    let land=false; for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) if(isLand(tileAt(x+dx,y+dy))) land=true;
    if(!land) continue; const d=dist(x,y,t.cx,t.cy); if(d<bd){bd=d;best={x,y};}
  }
  t.coast=best; return best;
}
function vehicleTask(u,t){
  const bn=BERKAT[u.b].n;
  if(bn==='Pembuat Kapal'){ const c=coastPoint(t); const cap=Math.ceil((t.pop||10)/14);
    if(!c||(t.boats||0)>=cap) return false;
    let land=null; for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) if(isLand(tileAt(c.x+dx,c.y+dy))) land={x:c.x+dx,y:c.y+dy};
    goTo(u,((land||c).x+.5)*TS,((land||c).y+.7)*TS); u.task={k:'vehicle',v:'kapal',t:ri(160,220)}; return true; }
  if(bn==='Pembuat Kereta'){ const cap=Math.max(1,Math.ceil((t.pop||10)/18)); if((t.carts||0)>=cap||!hasDone(t,'pasar')) return false;
    const pb=townBuildings(t,'pasar').find(b=>b.done); const d=bldDoor(pb); goTo(u,d.x+14,d.y+2); u.task={k:'vehicle',v:'kereta',t:ri(160,220)}; return true; }
  return false;
}
function vehicleStep(u,k){
  if(--k.t>0) return;
  const t=TN(u.town); if(!t){ u.task=null; return; }
  const need=k.v==='kapal'?14:10;
  if(t.stock.wood<need){ u.task=null; return; }
  t.vprog=t.vprog||{}; t.vprog[k.v]=(t.vprog[k.v]||0)+workRate(u)*iqMult(u);
  if(t.vprog[k.v]>=4){ t.vprog[k.v]=0; t.stock.wood-=need;
    if(k.v==='kapal'){ t.boats=(t.boats||0)+1; const c=coastPoint(t); G.boats=G.boats||[]; G.boats.push({id:newId(),town:t.id,x:(c.x+.5)*TS,y:(c.y+.5)*TS,tx:0,ty:0,t:0,flip:false}); if(t.boats===1) log(`${u.name} meluncurkan perahu pertama ${t.name}. Para nelayan kini bisa melaut.`,'life',{x:c.x*TS,y:c.y*TS}); }
    else { t.carts=(t.carts||0)+1; if(t.carts===1) log(`${u.name} menyelesaikan kereta kuda pertama ${t.name}. Kafilah kini bisa membawa muatan dua kali lipat.`,'life',{x:u.x,y:u.y}); }
    gainXp(u,4); }
  u.task=null;
}
function boatsMove(){
  if(!G.boats) return;
  for(const b of G.boats){
    if(--b.t<=0){ b.t=200+rnd()*300; for(let i=0;i<20;i++){ const tx=b.x+ri(-90,90), ty=b.y+ri(-70,70); const tt=tileOfPx(tx,ty); if(tt===T.WATER||tt===T.DEEP){ b.tx=tx; b.ty=ty; break; } } }
    const dx=(b.tx||b.x)-b.x, dy=(b.ty||b.y)-b.y, d=Math.hypot(dx,dy);
    if(d>1){ const s=.25; const nx=b.x+dx/d*s, ny=b.y+dy/d*s; const tt=tileOfPx(nx,ny); if(tt===T.WATER||tt===T.DEEP){ b.x=nx; b.y=ny; b.flip=dx<0; } else b.t=0; }
  }
}

/* ---------- desa & pajak ---------- */
function villagesYearly(){
  for(const k of G.kingdoms){
    if(!k.alive||k.hunter) continue; const cap=TN(k.capital); if(!cap) continue;
    for(const v of G.towns.filter(t=>t.kingdom===k.id&&t!==cap)){
      const ppl=G.units.filter(u=>!u.dead&&u.town===v.id&&isAdult(u)&&u.race!=='monster');
      let gold=0; if(!(v.taxCut&&yearInt()-v.taxCut<=1)) for(const u of ppl){ const g=Math.min(u.gold,u.gold*k.tax*.5+1); u.gold-=g; gold+=g; }
      const food=Math.max(0,Math.floor((v.stock.food-ppl.length*15)*.2));
      v.stock.food-=food; cap.stock.food+=food; k.treasury+=gold;
      const c=ppl.find(u=>['dagang','kurir'].includes(roleOf(u)))||ppl.find(u=>stageOf(u)==='dewasa');
      if(c&&!c.possessed&&!c.downed&&!c.patient){ const pb=townBuildings(cap,'istana').find(b=>b.done); const d=pb?bldDoor(pb):{x:(cap.cx+1)*TS,y:(cap.cy+2)*TS}; c.mounted={c:'#7a4a2a',mane:'#2a1a12',saddle:'#c8a050',cart:(v.carts||0)>0}; c.path=[]; goTo(c,d.x,d.y); c.task={k:'trade',phase:'go',dest:cap.id,cargo:{},tribute:1,t:0}; }
      v.lastTribute={y:yearInt(),gold:Math.round(gold),food};
      if((gold>5||food>10)&&(yearInt()%5===0||!v.taxLogged)){ v.taxLogged=1; log(`Desa ${v.name} menyetor pajak ${Math.round(gold)} emas${food?` dan ${food} pangan`:''} ke ibu kota ${cap.name}.`,'life',{x:(v.cx+1)*TS,y:(v.cy+1)*TS}); }
    }
    // warga kalangan bawah yang sesak membuka desa
    const vs=G.towns.filter(t=>t.kingdom===k.id&&t!==cap).length;
    if(vs<3&&cap.pop>(k.zoning?35:48)&&rnd()<.35&&!G.towns.some(o=>o.kingdom===k.id&&o!==cap&&yearInt()-o.founded<6)) foundVillage(cap,k);
  }
}

/* ---------- kelas sosial ---------- */
const KELAS={atas:'Kalangan atas',menengah:'Kalangan menengah',bawah:'Kalangan bawah'};
function classOf(u){
  if(u.royal||u.title==='Ketua Guild'||u.title==='Guru'||u.flags.istana) return 'atas';
  const b=BERKAT[u.b]; const fam=u.gold+((U(u.spouse)||{}).gold||0);
  if(fam>=260||b.s>=4&&u.revealed) return 'atas';
  if(fam>=60||b.s>=2&&u.revealed||u.career==='penjaga'||u.lvl>=15) return 'menengah';
  return 'bawah';
}
function classesYearly(){
  for(const u of G.units){ if(u.dead||u.race==='monster') continue; u.kelas=isAdult(u)?classOf(u):(U(u.father)||U(u.mother)||u).kelas||'bawah'; }
  for(const k of G.kingdoms){
    if(!k.alive||k.hunter) continue; const kg=U(k.king); if(!kg) continue;
    const greedy=has(kg,'Serakah')||has(kg,'Kejam')||(kg.corrupt||0)>=55;
    const fair=has(kg,'Adil')||has(kg,'Bijak');
    if(!k.zoning&&greedy&&rnd()<.35){ k.zoning=true; log(`${fullName(kg)} mengeluarkan titah pembagian wilayah: kalangan atas di sekitar istana, kalangan menengah di lingkar tengah, kalangan bawah di pinggir kota. Pajak rakyat jelata dinaikkan.`,'war',{x:kg.x,y:kg.y}); }
    else if(k.zoning&&fair&&rnd()<.5){ k.zoning=false; log(`${fullName(kg)} mencabut pembagian wilayah. Rakyat jelata bersorak di jalanan.`,'life',{x:kg.x,y:kg.y}); }
    if(k.zoning){ const cap=TN(k.capital); if(!cap) continue;
      const inner=G.blds.filter(b=>b.town===cap.id&&b.type==='rumah'&&b.done&&dist(b.x+3,b.y+2,cap.cx,cap.cy)<cap.R*.45);
      for(const b of inner){ const o=U(b.owner); if(o&&classOf(o)==='bawah'&&rnd()<.25){ const s=cap.slots.slice().reverse().find(x=>!x.used); if(!s) break; const nb=addBuilding(cap,'rumah',s,{owner:o.id}); b.owner=null; const fam=houseResidents(b); const tent=G.blds.find(x=>x.town===cap.id&&x.type==='tenda'); for(const m of fam) m.home=tent?tent.id:null; log(`Keluarga ${o.marga} digusur dari rumahnya dekat istana dan harus membangun ulang di pinggir kota.`,'war',{x:(b.x+3)*TS,y:(b.y+5)*TS}); hist(o,'digusur ke pinggir kota'); o.happy-=20; if(!o.flags.vendTried&&rnd()<.04){ o.flags.vendTried=1; o.flags.dendam=kg.id; hist(o,`menyimpan dendam pada ${kg.name}`); } } }
    }
  }
}
function classTax(u,k){ if(!k||!k.zoning) return k?k.tax:0; const c=u.kelas||classOf(u); return c==='atas'?Math.max(.03,k.tax*.35):c==='menengah'?k.tax:Math.min(.5,k.tax*1.6+.08); }

/* ---------- pencari bakat ---------- */
function scoutYearly(k){
  const cap=TN(k.capital); if(!cap||k.hamlet) return;
  let s=U(k.scout);
  if(!s||s.dead||s.kingdom!==k.id){
    const pool=G.units.filter(u=>!u.dead&&u.kingdom===k.id&&isAdult(u)&&!u.royal&&u.id!==k.king&&!['Tangan Kanan Raja','Kepala Pemukiman','Kepala Desa','Walikota'].includes(u.title)&&!u.party&&u.race!=='monster'&&stageOf(u)==='dewasa'&&!['guild','guru'].includes(u.career));
    const sc=u=>(u.iq||100)+(has(u,'Jujur')?15:0)+(has(u,'Cerdas')?10:0)+(['Peramal','Juru Tulis','Ahli Strategi','Sage Agung'].includes(BERKAT[u.b].n)?25:0)-(has(u,'Licik')?20:0);
    s=pool.sort((a,b)=>sc(b)-sc(a))[0]; if(!s) return;
    k.scout=s.id; s.title='Pencari Bakat'; s.flags.istana=1; s.flags.mataPenilai=1; s.career='kerja'; s.gold+=40; hist(s,`diangkat menjadi Pencari Bakat kerajaan`);
    log(`${fullName(U(k.king))} mengangkat ${s.name} ${s.marga} (IQ ${s.iq}) sebagai Pencari Bakat. Matanya bisa menilai bakat dan sifat seseorang seperti Upacara Penilaian.`,'life',{x:s.x,y:s.y});
  }
  const cands=G.units.filter(u=>!u.dead&&u.kingdom===k.id&&isAdult(u)&&stageOf(u)==='dewasa'&&!u.royal&&!u.flags.istana&&u.race!=='monster'&&!u.party&&(!u.title||u.title==='Ksatria')&&u.career!=='guild'&&u.career!=='guru'&&(BERKAT[u.b].s>=3||(u.iq||100)>=125));
  cands.sort((a,b)=>(BERKAT[b.b].s*12+(b.iq||100))-(BERKAT[a.b].s*12+(a.iq||100)));
  let n=0;
  for(const u of cands){ if(n>=2) break; if(rnd()<.35) continue;
    const b=BERKAT[u.b]; let pos;
    if(COMBAT_ROLES.has(b.role)){ pos='Pengawal Istana'; u.career='penjaga'; }
    else if(b.role==='tempa'){ pos='Empu Istana'; }
    else if(['penyihir','pendeta'].includes(b.role)||(u.iq||100)>=135){ pos='Penasihat Istana'; }
    else pos='Juru Tulis Istana';
    const from=TN(u.town);
    u.title=pos; u.flags.istana=1; u.flags.scouted=k.scout; u.gold+=60; u.kelas='atas'; u.happy+=15; hist(u,`direkrut Pencari Bakat ${s.name} menjadi ${pos}`);
    if(from&&from.id!==cap.id){
      const fam=[u,U(u.spouse),...u.children.map(U).filter(c=>c&&!isAdult(c))].filter(Boolean);
      for(const m of fam){ m.town=cap.id; m.home=null; m.task=null; goTo(m,(cap.cx+1)*TS+ri(-20,20),(cap.cy+2)*TS+ri(-10,10)); }
      const head=u.sex==='m'||!U(u.spouse)?u:U(u.spouse); if(head.spouse) housingFor(head); else { const pal=townBuildings(cap,'istana').find(b=>b.done); u.home=pal?pal.id:null; }
    }
    log(`Pencari Bakat ${s.name} menemukan ${u.name} ${u.marga} (${'★'.repeat(b.s)} ${b.n}, IQ ${u.iq})${from&&from.id!==cap.id?` di desa ${from.name}`:` di antara rakyat jelata ${cap.name}`}, lalu membawanya ke istana sebagai ${pos}.`,'hero',{x:u.x,y:u.y});
    n++;
  }
}

/* ---------- sarang goblin & orc ---------- */
function placeDen(kind,at){
  G.dens=G.dens||[];
  for(let i=0;i<500;i++){
    const x=at?at.x:ri(6,MW-7), y=at?at.y:ri(6,MH-7), t=tileAt(x,y);
    if(!at&&![T.HILLS,T.FOREST,T.MOUNT].includes(t)) continue;
    if(!at&&G.towns.some(tw=>dist(tw.cx,tw.cy,x,y)<tw.R+26)) continue;
    if(!at&&G.dens.some(d=>dist(d.x,d.y,x,y)<30)) continue;
    const d={id:newId(),x,y,kind:kind||(rnd()<.75?'goblin':'orc'),captives:[],born:yearInt(),name:`Sarang ${kind==='orc'?'Orc':'Goblin'} ${pick(['Batu Hitam','Taring Patah','Lembah Busuk','Gua Lumut','Tulang Kering','Kabut Merah','Akar Mati','Tebing Retak'])}`};
    if(!kind) d.name=`Sarang ${d.kind==='orc'?'Orc':'Goblin'} ${d.name.split(' ').slice(2).join(' ')}`;
    G.dens.push(d);
    const n=d.kind==='orc'?ri(3,5):ri(6,9);
    for(let j=0;j<n;j++) denSpawn(d,d.kind==='orc'?pick(['orc','orc','goblin','goblin']):pick(['goblin','goblin','goblin','kobold','gobShaman','hob']));
    denSpawn(d,d.kind==='orc'?'orcLord':(rnd()<.5?'orc':'hob'),true);
    return d;
  }
  return null;
}
function denSpawn(d,kind,chief){
  const m=maybeVariant(spawnMonster(kind,(d.x+.5)*TS+ri(-14,14),(d.y+1.5)*TS+ri(-6,10),null),.07); m.flags.den=d.id;
  if(chief){ d.chief=m.id; m.name=`Kepala ${MON[kind].n} ${pick(['Grubnak','Skarr','Mogh','Uzgul','Throk','Gash','Brakka'])}`; m.maxHp=Math.round(m.maxHp*1.4); m.hp=m.maxHp; m.atk*=1.25; }
  return m;
}
function denMembers(d){ return G.units.filter(u=>!u.dead&&u.flags&&u.flags.den===d.id); }
function isDenMon(m){ return m&&m.race==='monster'&&m.flags&&m.flags.den; }
function densDaily(){
  if(!G.dens) return;
  for(const d of G.dens.slice()){
    const mem=denMembers(d);
    if(!mem.length){ clearDen(d,null); continue; }
    if(d.peace&&K(d.peace)?.alive) continue;
    if(G.step-(d.lastHunt||0)>DAY*3&&mem.length>=4&&rnd()<.5){
      d.lastHunt=G.step;
      const towns=G.towns.slice().sort((a,b)=>dist(a.cx,a.cy,d.x,d.y)-dist(b.cx,b.cy,d.x,d.y));
      const t=towns.find(tw=>dist(tw.cx,tw.cy,d.x,d.y)<120); if(!t) continue;
      const big=mem.length>=12;
      const raiders=mem.filter(m=>m.id!==d.chief).sort(()=>rnd()-.5).slice(0,big?ri(7,11):ri(3,6));
      if(big&&rnd()<.5){ const c=U(d.chief); if(c) raiders.push(c); }
      const unwalled=t.wall.state!=='done'&&(mem.length>=7||!t.cap);
      const target=unwalled||big?{x:(t.cx+1)*TS,y:(t.cy+1)*TS}:(t.fields[0]?{x:(t.fields[0].x+3)*TS,y:(t.fields[0].y+2)*TS}:{x:(t.cx+1)*TS,y:(t.cy+t.R+3)*TS});
      for(const m of raiders){ m.flags.raid=(unwalled||big)?G.step+Math.round(DAY*.8):null; m.flags.hunt=G.step+Math.round(DAY*.8); m.path=[{x:target.x+ri(-40,40),y:target.y+ri(-30,30)}]; m.task=null; }
      if(unwalled||big){ t.pendingAlarm={at:G.step+Math.round(DAY*.12),why:`Gerombolan ${d.kind} (${raiders.length} ekor) menyerbu dari ${d.name}.`}; t.lastDenRaid={den:d.id,step:G.step,big}; }
      else if(rnd()<.4) log(`Gerombolan ${raiders.length} ${d.kind} keluar dari ${d.name} berburu di sekitar ladang ${t.name}.`,'war',{x:target.x,y:target.y});
    }
  }
}
function densYearly(){
  if(!G.dens) G.dens=[];
  for(const d of G.dens.slice()){
    const mem=denMembers(d); if(!mem.length) continue;
    const total=G.dens.reduce((s,x)=>s+denMembers(x).length,0);
    const grow=mem.length>=20||total>110?0:Math.min(4,1+Math.round(mem.length*.12+(d.fed||0)*.5)); d.fed=0;
    for(let i=0;i<grow;i++) denSpawn(d,d.kind==='orc'?pick(['orc','goblin','goblin']):pick(['goblin','goblin','goblin','kobold','gobShaman','hob']));

    for(const cid of d.captives.slice()){ const v=U(cid); if(!v||!v.captive){ d.captives=d.captives.filter(i=>i!==cid); continue; } if(G.step-v.captive.since>YEAR*3){ d.captives=d.captives.filter(i=>i!==cid); v.captive=null; die(v,null,`tak pernah kembali dari ${d.name}`); } }

function clearDen(d,by){

function igniteNear(x,y,src){

/* ---------- party tetap ---------- */
const PARTY_A=['Taring','Fajar','Pedang','Bintang','Serigala','Mawar','Badai','Perisai','Elang','Bara','Embun','Petir','Sayap','Akar'];

function partyOf(u){ return u&&u.party?G.parties.find(p=>p.id===u.party)||null:null; }
function newParty(t,mem,leader,name){
  const p={id:newId(),town:t.id,members:mem.map(m=>m.id),leader:leader.id,state:'rest',plan:null,target:null,quest:null,kills:0,floor:0,
    name:name||`${pick(PARTY_A)} ${pick(PARTY_B)}`,trust:{},record:{outings:0,kills:0,deepest:0,quests:0,lost:0},plog:[],founded:yearInt(),persist:true};

}
function plog(p,text){ p.plog=p.plog||[]; p.plog.unshift(`Th ${yearInt()}: ${text}`); if(p.plog.length>16) p.plog.pop(); }
function partyJoin(p,u,why){ if(p.solo||p.members.length>=5||p.members.includes(u.id)) return false; p.members.push(u.id); p.trust[u.id]=35+ri(0,15); u.party=p.id; plog(p,`${u.name} bergabung${why?' ('+why+')':''}.`); hist(u,`bergabung dengan party ${p.name}`); return true; }

function partyHealthy(u){ return u&&!u.dead&&isAdult(u)&&!u.sick&&!u.patient&&!u.downed&&!u.captive&&!u.possessed&&u.hp>u.maxHp*.6; }
function pickPlan(p,t,mem){
  const avg=mem.reduce((s,m)=>s+m.lvl,0)/mem.length;

  const qh=qs.find(q=>q.type==='herbal'&&G.nests.some(n=>n.id===q.nest));
  if(qh&&avg<10&&rnd()<.6) return {plan:'hunt',target:qh.nest,quest:qh};

function formParties(t){
  // 1. party yang sedang istirahat berangkat
  for(const p of G.parties.filter(p=>p.town===t.id&&p.state==='rest')){
    const mem=p.members.map(U).filter(Boolean);

    if(mem.length===1&&!p.solo&&G.step-(p.lastOut||0)>YEAR*2){ plog(p,'Party bubar karena tinggal satu orang.'); partyLeave(p,mem[0],'party bubar'); continue; }

    const pl=pickPlan(p,t,ready); if(!pl) continue;
    p.plan=pl.plan; p.target=pl.target; p.quest=pl.quest?pl.quest.id:null; p.state='go'; p.arrived=false; p.kills=0; p.floor=0; p.lastOut=G.step; p.done=[]; p.out=ready.map(m=>m.id);

  }

  const pool=G.units.filter(u=>!u.dead&&u.town===t.id&&u.career==='petualang'&&!u.party&&!u.flags.merc&&partyHealthy(u)&&!wantsSolo(u));

    const open=G.parties.filter(p=>p.town===t.id&&p.state==='rest'&&p.members.length<5&&!p.solo).find(p=>{ const mem=p.members.map(U).filter(Boolean); const avg=mem.reduce((s,m)=>s+m.lvl,0)/Math.max(1,mem.length); return Math.abs(u.lvl-avg)<=8&&!mem.some(m=>(m.rel[u.id]?.f||0)<-30); });

    const n=Math.min(pool.length,ri(2,4));
    const mem=pool.splice(0,n);
    const leader=mem.slice().sort((a,b)=>(b.lvl+(has(b,'Karismatik')?8:0)+((b.iq||100)-100)*.1)-(a.lvl+(has(a,'Karismatik')?8:0)+((a.iq||100)-100)*.1))[0];
    const p=newParty(t,mem,leader);
    abandonCheck(p,pool,t);

}
function partyStep(u,k){
  const p=partyOf(u); if(!p){ u.party=null; u.task=null; return; }
  if(p.state==='rest'){ u.task=null; return; }
  if(p.out&&!p.out.includes(u.id)){ u.task=null; return; }
  let leader=U(p.leader);
  if(!leader||leader.dead||!(p.out||[]).includes(leader.id)){ const nl=(p.out||p.members).map(U).find(m=>m&&!m.dead); if(!nl){ p.state='rest'; return; } leader=nl; }
  if(p.state==='go'){
    const tgt=p.plan==='dungeon'?G.dungeons.find(d=>d.id===p.target):p.plan==='den'?(G.dens||[]).find(d=>d.id===p.target):G.nests.find(n=>n.id===p.target);

    const tx=(tgt.x+.5)*TS, ty=(tgt.y+1.2)*TS;
    if(u===leader){ if(!u.path.length){ if(dist(u.x,u.y,tx,ty)>12) goTo(u,tx,ty); else p.arrived=true; } }
    else if(G.step%12===0){ const i=p.members.indexOf(u.id); goTo(u,leader.x-10+i*6,leader.y+6); }
    if(p.arrived){
      const all=(p.out||[]).map(U).filter(m=>m&&!m.dead);
      if(p.plan==='dungeon'){ if(all.every(m=>dist(m.x,m.y,tx,ty)<44)){ p.state='in'; p.t=DAY*1.2; for(const m of all){ m.inside=true; m.path=[]; m.x=tx; m.y=ty; } const d=tgt; ensureFloors(d); if(d.demon) d.soul=(d.soul||0)+2; log(`${pName(p)} (${all.map(m=>m.name).join(', ')}) memasuki ${tgt.name}.`,'dun',{x:tx,y:ty}); } }
      else { p.state='hunt'; p.t=p.plan==='den'?DAY*1.6:DAY*1.1; if(p.plan==='den') log(`${pName(p)} (${all.map(m=>m.name).join(', ')}) menyerbu ${tgt.name}.`,'dun',{x:tx,y:ty}); }
    }
  } else if(p.state==='hunt'){
    const n=p.plan==='den'?(G.dens||[]).find(d=>d.id===p.target):G.nests.find(n=>n.id===p.target);
    if(--p.t<=0||u.hp<u.maxHp*.35||!n||(p.quest&&p.kills>=(TN(p.town)?.quests?.find(q=>q.id===p.quest)?.n||99))){ p.state='back'; return; }
    if(!u.path.length&&n){ const a=rnd()*Math.PI*2; goTo(u,(n.x+Math.cos(a)*6)*TS,(n.y+Math.sin(a)*6)*TS); }
  } else if(p.state==='in'){

    u.inside=false;
    const t=TN(u.town); const gb=t&&townBuildings(t,'guild').find(b=>b.done); const d=gb?bldDoor(gb):(t?{x:(t.cx+1)*TS,y:(t.cy+2)*TS}:{x:u.x,y:u.y});
    goTo(u,d.x+ri(-10,10),d.y+ri(0,6)); u.task={k:'idle',t:40};
    p.out=(p.out||[]).filter(i=>i!==u.id); (p.done=p.done||[]).push(u);
    if(!p.out.length) partyReturn(p);
  }
}
function partyReturn(p){
  settleQuest(p); mercRelease(p);

  const back=(p.done||[]).filter(m=>m&&!m.dead);

  for(const m of mem) if((p.trust[m.id]||0)<15&&m.id!==p.leader&&rnd()<.5) partyLeave(p,m,'tidak lagi percaya pada party');

}
function settleQuest(p){

/* ---------- lantai dungeon, soul, Raja Iblis ---------- */
const FLOOR_POOL=[['slime','kelelawar','kobold'],['goblin','wolf','slimeAir','babi'],['spider','skel','hob','zombie','slimeRacun'],['shadowWolf','orc','lizard','gobShaman','mimic'],['ogre','troll','golem','orcLord','beruang'],['minotaur','wyvern'],['nagaBayangan']];

const GACHA_ODDS=[30,26,20,13,7,3,1];
function monPow(k){ const m=MON[k]; return m?m.hp*m.atk/60:1; }
function defaultFloor(f){ const tier=Math.min(6,Math.floor((f-1)/2)); const pool=FLOOR_POOL[tier]; const mons={}; const n=2+Math.floor(f/3); for(let i=0;i<n;i++){ const k=pick(pool); mons[k]=(mons[k]||0)+1; } return {mons,trap:0,reward:0}; }

function ensureFloors(d){

function floorMult(d,f){ const fl=d.floors[f-1]; if(!fl) return 1; return clamp(Math.sqrt(floorPow(fl)/(fl.base||1)),.6,4)*(1+fl.trap*.3)*(d.diff||1); }

const LORD_PERS=['Serakah','Kejam','Licik','Sombong','Bijak'];
function ensureLord(d){
  if(!d.demon){ if(d.lord&&d.lord.uid){ const c=U(d.lord.uid); if(c&&!c.dead){ c.dungeonLord=null; c.inside=false; c.title=null; c.x=(d.x+.5)*TS; c.y=(d.y+1.5)*TS; const t=G.towns.slice().sort((a,b)=>dist(a.cx,a.cy,d.x,d.y)-dist(b.cx,b.cy,d.x,d.y))[0]; if(t){ c.town=t.id; c.kingdom=t.kingdom; const tent=G.blds.find(b=>b.town===t.id&&b.type==='tenda'); c.home=tent?tent.id:null; } hist(c,`dilepaskan dari ${d.name}`); } } d.lord=null; return null; }
  if(!d.lord){ d.lord={name:`${genName('iblis','m')} ${pick(['Sang Penguasa Gelap','Pemakan Jiwa','Mahkota Abu','Raja Lantai Bawah'])}`,pers:pick(LORD_PERS),lvl:30+ri(0,10),born:yearInt()}; d.soul=(d.soul||0)+40; }
  const lu=d.lord.uid&&U(d.lord.uid); if(lu) d.lord.lvl=Math.min(50,12+Math.floor(ageOf(lu)*1.6));

const COST={floor:d=>60+d.maxFloor*18,gacha:()=>40,clone:()=>25,trap:(d,f)=>45*((d.floors[f-1]?.trap||0)+1),reward:(d,f)=>35*((d.floors[f-1]?.reward||0)+1),ore:d=>70*(d.ore+1)};
function lordAct(d,act,f,by){

function rebelDaily(u){

  if(kind==='love'&&has(u,'Pemalu')) p-=.1;
  return clamp(p,.05,.97);
}

const LEGEND_LAIR={volcanosaur:{t:['MOUNT','DESERT'],n:'Kawah Membara'},tyrant:{t:['FOREST','GRASS'],n:'Lembah Purba'},unicorn:{t:['FOREST'],n:'Hutan Perak'},phoenix:{t:['MOUNT','DESERT'],n:'Puncak Abu Abadi'},kitsune:{t:['FOREST','HILLS'],n:'Kuil Rubah'},nagaBumi:{t:['MOUNT','HILLS'],n:'Perut Gunung'},griffinKaisar:{t:['MOUNT'],n:'Takhta Awan'},fenrir:{t:['MOUNT','FOREST'],n:'Hutan Tanpa Cahaya'},behemoth:{t:['GRASS','DESERT'],n:'Padang Retak'},thunderbird:{t:['HILLS','MOUNT'],n:'Bukit Badai'}};
const NEST_ADD={FOREST:['treant','basilisk','harpy'],MOUNT:['griffin','yeti','harpy','cerberus'],HILLS:['cockatrice','manticore','pegasus','griffin'],DESERT:['salamander','basilisk','manticore','chimera'],GRASS:['pegasus','cockatrice','salamander','hydra']};

function placeLair(mk,wake){
  const ok=LEGEND_LAIR[mk].t.map(n=>T[n]);
  for(let i=0;i<600;i++){
    const x=ri(5,MW-6), y=ri(5,MH-6), tt=tileAt(x,y);
    if(i<400&&!ok.includes(tt)) continue; if(!isLand(tt)) continue;
    if(G.towns.some(tw=>dist(tw.cx,tw.cy,x,y)<tw.R+46)) continue;
    if(G.nests.some(n=>dist(n.x,n.y,x,y)<14)||G.dungeons.some(d=>dist(d.x,d.y,x,y)<10)) continue;
    const n={id:newId(),x,y,pool:[mk],danger:1,legend:mk,name:LEGEND_LAIR[mk].n,respawn:0,wake:wake};
    G.nests.push(n); return n;
  }
  return null;
}
function worldUpgrade(){
  if(!G.v6){
    G.v6=1;
    for(const n of G.nests){ if(n.legend) continue; const tt=tileAt(n.x,n.y); const key=Object.keys(T).find(k=>T[k]===tt); for(const mk of NEST_ADD[key]||[]) if(!n.pool.includes(mk)&&rnd()<.6) n.pool.push(mk); }
    const ks=Object.keys(LEGEND_LAIR).filter(k=>k!=='chaoticDragon').sort(()=>rnd()-.5);
    ks.slice(0,2).forEach((mk,i)=>placeLair(mk,yearInt()+ri(14,22)+i*5));
    G.pendingLegends=ks.slice(2);
  }
  for(const t of G.towns){ t.pantry=t.pantry||{}; t.recipes=t.recipes||[]; }
  G.recipesFamous=G.recipesFamous||[]; G.legendLog=G.legendLog||[]; G.seen=G.seen||{};
}

/* ---------- monster legenda ---------- */
function legendCap(){ const y=yearInt(); return y<30?1:y<50?2:3; }
function legendsAwake(){ return G.units.filter(u=>!u.dead&&u.race==='monster'&&!u.tamer&&MON[u.mk]&&MON[u.mk].legend&&!MON[u.mk].sea&&u.mk!=='chaoticDragon').length; }
function legendAlive(n){ return G.units.find(u=>!u.dead&&u.race==='monster'&&u.nest===n.id&&!u.tamer); }
function legendDaily(){
  for(const n of G.nests){
    if(!n.legend) continue;
    if(legendAlive(n)) continue;
    if(yearInt()<(n.wake||0)||G.step<(n.respawn||0)) continue;
    if(legendsAwake()>=legendCap()) continue;
    if(rnd()>.25) continue;
    const m=spawnMonster(n.legend,(n.x+.5)*TS,(n.y+.5)*TS,n); m.lvl=29+ri(0,6);
    G.seen[n.legend]=1;
    log(`Bumi bergetar. ${MON[n.legend].n} terbangun di ${n.name}. ${MON[n.legend].d}`,'war',{x:m.x,y:m.y});
    G.legendLog.unshift(`Th ${yearInt()}: ${MON[n.legend].n} muncul di ${n.name}`);
  }
}
function legendYearly(){
  if(G.pendingLegends&&G.pendingLegends.length&&yearInt()>=24&&rnd()<.12){ const mk=G.pendingLegends.shift(); placeLair(mk,yearInt()+ri(1,4)); }
  if(yearInt()<25||rnd()>.2) return;
  for(const m of G.units.slice().sort(()=>rnd()-.5)){
    if(m.dead||m.race!=='monster'||m.tamer||!MON[m.mk].legend||MON[m.mk].sea) continue;
    if(rnd()>.15) continue;
    const t=G.towns.slice().sort((a,b)=>dist((a.cx+1)*TS,(a.cy+1)*TS,m.x,m.y)-dist((b.cx+1)*TS,(b.cy+1)*TS,m.x,m.y))[0]; if(!t) continue;
    m.flags.raid=G.step+Math.round(DAY*1.2); m.path=[{x:(t.cx+1)*TS+ri(-30,30),y:(t.cy+1)*TS+ri(-30,30)}];
    log(`${MON[m.mk].n} meninggalkan sarangnya dan mengamuk menuju ${t.name}! Para petualang terbaik dipanggil.`,'war',{x:m.x,y:m.y});
    t.pendingAlarm={at:G.step+Math.round(DAY*.3),why:`${MON[m.mk].n} mendekat`};
    break;
  }
}
function legendSlain(m,killer){
  const def=MON[m.mk]; const n=G.nests.find(x=>x.id===m.nest);
  if(n) n.respawn=G.step+YEAR*ri(8,15);
  const party=partyOf(killer); const who=party&&party.state!=='rest'&&!party.solo?`party ${party.name}`:fullName(killer);
  const ttl=`Pembantai ${def.n}`;
  const heroes=party&&party.out?party.out.map(U).filter(Boolean):[killer];
  for(const h of heroes){ if(!h.title||['Ksatria','Pemburu'].includes(h.title)) h.title=ttl; hist(h,`ikut menumbangkan ${def.n}`); h.gold+=def.bounty/heroes.length; }
  const t=TN(killer.town); if(t) addIngr(t,LEGEND_DROP[m.mk]||`Daging ${def.n}`,3);
  log(`Legenda tumbang! ${who} mengalahkan ${def.n}${n?` di ${n.name}`:''}. Bard di seluruh negeri mulai menyanyikan kisahnya.`,'hero',{x:m.x,y:m.y});
  G.legendLog.unshift(`Th ${yearInt()}: ${def.n} dikalahkan ${who}`); if(G.legendLog.length>30) G.legendLog.pop();
  if(m.mk==='chaoticDragon') chaosSlain(m,killer);
}

/* ---------- monster laut ---------- */
function isWaterPx(x,y){ const t=tileOfPx(x,y); return t===T.WATER||t===T.DEEP; }
function seaYearly(){
  if(yearInt()<6) return;
  const live=G.units.filter(u=>!u.dead&&u.flags.sea&&!u.tamer);
  if(live.length>=3||rnd()>.32) return;
  const towns=G.towns.filter(t=>coastPoint(t)); if(!towns.length) return;
  const t=towns.slice().sort((a,b)=>(b.boats||0)-(a.boats||0))[rnd()<.6?0:ri(0,towns.length-1)];
  const c=coastPoint(t);
  let spot=null;
  for(let i=0;i<200&&!spot;i++){ const x=c.x+ri(-26,26), y=c.y+ri(-26,26); if(tileAt(x,y)===T.DEEP||(i>120&&tileAt(x,y)===T.WATER)) spot={x,y}; }
  if(!spot) return;
  let kind=wpick(['ularLaut','megalodon','kraken'],k=>({ularLaut:60,megalodon:22,kraken:18})[k]);
  if(kind!=='ularLaut'&&live.some(u=>u.mk===kind)) kind='ularLaut';
  const m=spawnMonster(kind,(spot.x+.5)*TS,(spot.y+.5)*TS,null); m.flags.sea={x:m.x,y:m.y,town:t.id,until:G.step+YEAR*ri(2,4)}; m.lvl=MON[kind].legend?32:22;
  G.seen[kind]=1;
  log(`Para nelayan ${t.name} melihat bayangan raksasa di bawah ombak: ${MON[kind].n}! Tak ada perahu yang berani melaut.`,'war',{x:m.x,y:m.y});
  if(MON[kind].legend) G.legendLog.unshift(`Th ${yearInt()}: ${MON[kind].n} muncul di perairan ${t.name}`);
}
function sinkBoat(b,m){
  G.boats=G.boats.filter(x=>x!==b); const t=TN(b.town); if(t) t.boats=Math.max(0,(t.boats||1)-1);
  FX_QUEUE.push({k:'splash',x:b.x,y:b.y,t:40});
  const crew=t?G.units.filter(v=>!v.dead&&v.town===t.id&&roleOf(v)==='ikan'&&isAdult(v)&&!v.inside&&!v.possessed):[];
  const lost=crew.sort(()=>rnd()-.5).slice(0,ri(0,2));
  for(const v of lost) die(v,m,`tenggelam saat ${MON[m.mk].n} menghancurkan perahunya`);
  log(`${MON[m.mk].n} menghantam perahu nelayan ${t?t.name:''} sampai hancur berkeping-keping.${lost.length?` ${lost.map(v=>v.name).join(' dan ')} tidak pernah kembali ke darat.`:' Para awak berhasil berenang ke pantai.'}`,'war',{x:b.x,y:b.y});
}
function stepSea(u){
  fxTick(u); if(u.dead) return; if(u.cd>0) u.cd--;
  const def=MON[u.mk]; const home=u.flags.sea;
  if(home.until&&G.step>home.until){ log(`${MON[u.mk].n} kembali ke laut dalam. Para nelayan ${TN(home.town)?.name||''} akhirnya berani melaut lagi.`,'life',{x:u.x,y:u.y}); u.dead=true; return; }
  if(def.regen&&G.step%20===0&&u.hp<u.maxHp) u.hp=Math.min(u.maxHp,u.hp+u.maxHp*def.regen);
  if((G.step+u.id)%6===0){
    if(G.boats) for(const b of G.boats) if(dist(b.x,b.y,u.x,u.y)<20*(def.sc||1)&&rnd()<.35){ sinkBoat(b,u); break; }
    const reach=Math.min(26,(def.ranged||22)+2);
    const nearW=v=>isWaterPx(v.x+10,v.y)||isWaterPx(v.x-10,v.y)||isWaterPx(v.x,v.y+10)||isWaterPx(v.x,v.y-8);
    const e=nearest(u.x,u.y,reach,v=>sideOf(v)==='H'&&!v.inside&&!v.downed&&!v.dead&&(v.race!=='monster'||v.tamer)&&nearW(v));
    if(e){ u.flip=e.x<u.x; u.dir='side'; if(u.cd<=0){ if(rnd()<.4||!castSkill(u,e)) basicAttack(u,e,reach); u.cd=Math.round(26/def.spd); u.lastAtk=G.step; } return; }
  }
  if(!u.path.length||rnd()<.003){
    const towardShore=isNight()&&rnd()<.5;
    for(let i=0;i<20;i++){ const t=TN(home.town); const c=towardShore&&t?coastPoint(t):null;
      const x=c?(c.x+.5)*TS+ri(-60,60):home.x+ri(-160,160), y=c?(c.y+.5)*TS+ri(-60,60):home.y+ri(-140,140);
      if(isWaterPx(x,y)){ u.path=[{x,y}]; break; } }
  }
  const p=u.path[0]; if(!p) return;
  const dx=p.x-u.x, dy=p.y-u.y, d=Math.hypot(dx,dy), s=speedOf(u)*.8;
  if(d<=s){ u.path.shift(); u.moving=false; return; }
  const nx=u.x+dx/d*s, ny=u.y+dy/d*s;
  if(!isWaterPx(nx,ny)){ u.path=[]; u.moving=false; return; }
  u.x=nx; u.y=ny; u.moving=true; u.dir='side'; u.flip=dx<0;
}

/* ---------- petualang solo (Sok MC) ---------- */
function wantsSolo(u){ return (u.flags.solo||has(u,'Sok MC'))&&!u.flags.teamUp; }
function soloParties(t){
  for(const u of G.units){
    if(u.dead||u.town!==t.id||u.career!=='petualang'||!isAdult(u)||!wantsSolo(u)) continue;
    const p=partyOf(u);
    if(p&&!p.solo&&p.state==='rest'){ partyLeave(p,u,has(u,'Sok MC')?'merasa tidak butuh siapa pun':'memilih jalan sendiri'); }
    if(!u.party){ const np=newParty(t,[u],u,`${u.name}`); np.solo=true; np.plog=[`Th ${yearInt()}: ${u.name} memutuskan bertualang seorang diri.`]; if(has(u,'Sok MC')&&rnd()<.5) log(`${fullName(u)} menolak semua ajakan party. "Aku tidak butuh siapa-siapa," katanya, lalu berjalan sendirian ke luar gerbang.`,'hero',{x:u.x,y:u.y}); }
  }
}
function pName(p){ return p.solo?`${U(p.leader)?.name||p.name} seorang diri`:`Party ${p.name}`; }

function addIngr(t,n,q){ if(!INGR[n]) return; t.pantry=t.pantry||{}; t.pantry[n]=Math.min(40,(t.pantry[n]||0)+q); G.seen=G.seen||{}; G.seen['i:'+n]=1; }
function pantryDaily(t,people){
  t.pantry=t.pantry||{}; t.recipes=t.recipes||[];
  const byCat=c=>INGR_LIST.filter(n=>INGR[n].c===c&&INGR[n].r<=1);
  const fields=(t.fields||[]).length, herd=(t.herd||[]).length;
  const roles={}; for(const u of people) if(isAdult(u)) roles[roleOf(u)]=(roles[roleOf(u)]||0)+1;
  for(let i=0;i<Math.min(6,1+fields/2);i++) addIngr(t,pick(byCat('sayur').concat(byCat('biji'))),ri(1,3));
  if(rnd()<.6) addIngr(t,pick(byCat('buah')),ri(1,2));
  if(herd) for(let i=0;i<Math.min(4,1+herd/5);i++) addIngr(t,pick(byCat('ternak')),ri(1,3));
  if(roles.ikan) for(let i=0;i<Math.min(4,roles.ikan+(t.boats||0));i++){ const pool=INGR_LIST.filter(n=>INGR[n].c==='laut'&&INGR[n].r<=(t.boats?2:0)); addIngr(t,pick(pool),ri(1,3)); }
  if(roles.buru||roles.kayu) for(let i=0;i<1+((roles.buru||0)>1?1:0);i++){ const pool=INGR_LIST.filter(n=>['jamur','herbal','buruan'].includes(INGR[n].c)&&INGR[n].r<=(rnd()<.15?3:1)); addIngr(t,pick(pool),ri(1,2)); }
  if(hasDone(t,'pasar')) for(let i=0;i<2;i++) addIngr(t,pick(byCat('rempah')),ri(1,3));
  const race=K(t.kingdom)?.race||'manusia'; if(rnd()<.35) addIngr(t,pick(RACE_SPEC[race]||RACE_SPEC.manusia),ri(1,2));
  const k=K(t.kingdom); if(k&&k.trade&&k.trade.partners){ for(const id of Object.keys(k.trade.partners)){ const pk=K(+id); if(pk&&rnd()<.25) addIngr(t,pick(RACE_SPEC[pk.race]||RACE_SPEC.manusia),1); } }
  for(const n in t.pantry){ if(rnd()<.12) t.pantry[n]-=1; if(t.pantry[n]<=0) delete t.pantry[n]; }
}

const METHOD={daging:['Sate','Panggang','Rendang','Semur','Gulai','Dendeng','Bakar','Steak'],laut:['Pepes','Ikan Bakar','Sup','Goreng','Asam Pedas','Kukus'],sayur:['Tumis','Salad','Sup','Kari','Lodeh','Pecel'],buah:['Pai','Puding','Selai','Kue','Sorbet','Tart'],biji:['Roti','Bubur','Nasi','Mi','Kue Kering','Lontong'],jamur:['Tumis','Sup Krim','Risotto','Pepes','Panggang'],herbal:['Teh','Ramuan','Sup Bening','Salad'],legenda:['Panggang Agung','Sup Pusaka','Hidangan Raja']};
const FLAVOR={'Cabai':'Pedas','Cabai Neraka':'Neraka','Madu':'Madu','Madu Hutan Liar':'Madu Liar','Jahe':'Jahe','Saffron':'Saffron','Bunga Bulan':'Rembulan','Garam Bulan':'Rembulan','Kayu Manis':'Kayu Manis','Lemon':'Lemon','Kunyit':'Kuning','Vanili':'Vanili','Garam Batu Kurcaci':'Kurcaci','Daun Mana':'Mana','Rosemary':'Rosemary','Kecap':'Manis','Gula Aren':'Gula Aren','Mint':'Segar','Lada Hitam':'Lada Hitam'};
function catGroup(n){ const c=INGR[n].c; return c==='ternak'||c==='buruan'||c==='monster'?(n.startsWith('Daging')||n.startsWith('Ekor')||n.startsWith('Kaki')||n.startsWith('Lemak')?'daging':n.startsWith('Telur')?'biji':'daging'):c; }
function shortIngr(n){ return n.replace(/^(Daging|Ikan|Telur|Jamur|Buah|Daun|Akar|Kacang)\s+/,'').replace(/ Raksasa$/,''); }
function chefSkill(u){ const b=BERKAT[u.b]; return (roleOf(u)==='masak'?b.s*8:2)+u.lvl*.5+((u.iq||100)-100)*.25+(has(u,'Perfeksionis')?6:0)+(has(u,'Rajin')?2:0); }
function cookTask(u,t){

function cookStep(u,k){
  if(G.step%30===0) FX_QUEUE.push({k:'say',x:u.x,y:u.y-24,t:24,s:'♨'});
  if(--k.t>0) return; u.task=null;

  const have=Object.keys(t.pantry).filter(n=>t.pantry[n]>0); if(have.length<2) return;
  const sk=chefSkill(u);
  const known=t.recipes.filter(r=>r.ingr.every(n=>t.pantry[n]>0));
  const invent=!known.length||rnd()<clamp(.2+sk/150+(has(u,'Haus Ilmu')?.08:0),.1,.5);
  if(!invent){ const r=wpick(known,r=>r.q); for(const n of r.ingr) t.pantry[n]--; r.made=(r.made||0)+1; t.stock.food+=4+r.q/12; t.stock.goods+=r.q/40; u.gold+=1+r.q/30; gainXp(u,1); if(r.q>=85&&r.made%12===0) r.fame=(r.fame||0)+1; return; }
  const mains=have.filter(n=>['daging','laut','sayur','jamur','buah','biji','legenda','herbal'].includes(catGroup(n)));
  if(!mains.length) return;
  const main=wpick(mains,n=>1+INGR[n].r*2+t.pantry[n]*.1);
  const g=catGroup(main);
  const side=have.filter(n=>n!==main&&INGR[n].c!=='rempah'&&rnd()<.5).slice(0,1);
  const spice=have.filter(n=>INGR[n].c==='rempah').sort(()=>rnd()-.5).slice(0,ri(1,2));
  const ingr=[main,...side,...spice];
  const method=pick(METHOD[g]||METHOD.sayur);
  const fl=spice.map(n=>FLAVOR[n]).find(Boolean);
  let name=`${method} ${shortIngr(main)}`; if(side[0]&&rnd()<.6) name+=` ${shortIngr(side[0])}`; if(fl) name+=` ${fl}`;
  if(t.recipes.some(r=>r.name===name)){ const r=t.recipes.find(r=>r.name===name); r.made=(r.made||0)+1; t.stock.food+=4; return; }
  const rare=ingr.reduce((s,n)=>s+INGR[n].r,0);
  const clash=(g==='laut'&&side.some(n=>INGR[n].c==='buah'))||(g==='buah'&&side.some(n=>['laut','daging'].includes(catGroup(n))));

  const r={id:newId(),name,ingr,q,by:u.id,byName:u.name,town:t.id,y:yearInt(),made:1,fame:0};
  t.recipes.push(r); if(t.recipes.length>40){ t.recipes.sort((a,b)=>b.q-a.q); t.recipes.length=40; }
  u.flags.recipes=(u.flags.recipes||0)+1; if(q>(u.flags.bestDish?.q||0)) u.flags.bestDish={name,q};
  hist(u,`menciptakan resep "${name}"`); gainXp(u,3+rare);
  const label=q>=90?'luar biasa lezat':q>=75?'sangat lezat':q>=55?'lezat':'lumayan';
  if(q>=75||rare>=6||u.flags.recipes===1) log(`${fullName(u)} menciptakan hidangan baru di ${t.name}: "${name}" dari ${ingr.join(', ').toLowerCase()}. Rasanya ${label}.`,q>=90?'hero':'life',{x:u.x,y:u.y});
  if(q>=88){ G.recipesFamous.unshift({name,by:u.name,town:t.name,q,y:yearInt()}); if(G.recipesFamous.length>24) G.recipesFamous.pop(); }

}
function recipesSpread(){

const ATYPE=[['Zirah',1],['Perisai',.8],['Helm',.5],['Sarung Tangan',.4],['Sepatu Besi',.4]];

function armorDef(a){ if(!a) return 0; return a.def+(a.ench&&a.ench.k==='baja'?a.ench.lvl*2.5:0)+(a.ench2&&a.ench2.k==='baja'?a.ench2.lvl*2.5:0); }
function armorDaily(t){

  for(const u of fighters){ const cur=armorDef(u.armorItem); const a=t.armorShop.filter(x=>x.def>cur+1).sort((x,y)=>y.def-x.def)[0]; if(!a) continue; const price=Math.round(a.def*5*(1+a.rar*.6)); if(u.gold<price) continue;

function wAtkBonus(w){ if(!w||typeof w!=='object') return 0; let b=0; for(const e of [w.ench,w.ench2]) if(e) b+=e.k==='tajam'?e.lvl*3.5:e.k==='petir'?e.lvl*2.5:e.lvl; return b*(w.pot&&w.appraised?w.pot:1); }
function enchOnHit(u,e,dmg){

    if(W.fx&&rnd()<.08+en.lvl*.05) applyFx(e,W.fx,W.fx==='slow'?90:140,u);

function armorOnHit(v,src,d){

function freeKingdomSite(R,from){
  let best=null,bs=-1e9;
  for(let i=0;i<1400;i++){
    const x=ri(R+8,MW-R-10), y=ri(R+8,MH-R-10);
    if(!buildable(tileAt(x,y))) continue;
    if(G.towns.some(t=>dist(t.cx,t.cy,x,y)<t.R+R+(i<500?24:i<1000?12:6))) continue;
    if(G.dens&&G.dens.some(d=>dist(d.x,d.y,x,y)<R+4)) continue;
    if(G.nests.some(n=>n.legend&&dist(n.x,n.y,x,y)<R+10)) continue;
    let s=0;
    for(let dy=-R;dy<=R;dy+=2)for(let dx=-R;dx<=R;dx+=2){ if(dx*dx+dy*dy>R*R) continue; const t=tileAt(x+dx,y+dy); if(t===T.GRASS||t===T.SAND) s+=2; else if(t===T.FOREST||t===T.DESERT) s+=1.3; else if(t===T.HILLS) s+=.9; else s-=4; }
    if(from) s-=dist(from.cx,from.cy,x,y)*.3;
    if(s>bs){ bs=s; best={x,y}; }
  }
  return bs>80?best:null;
}
function misery(k){
  const kg=U(k.king); let m=0;
  if((k.welfare||60)<40) m+=1; if((k.welfare||60)<28) m+=1;
  if(k.zoning) m+=1; if(k.tax>=.3) m+=1;
  if(kg){ if(has(kg,'Kejam')) m+=1; if(has(kg,'Serakah')) m+=.5; if((kg.corrupt||0)>=55) m+=1; if(kg.flags.tyrant||kg.flags.stolenWives) m+=1; }
  if(!kg) m+=.5;
  return m;
}
function secessionYearly(){
  const alive=G.kingdoms.filter(k=>k.alive&&!k.hunter);
  if(alive.length>=8) return;
  for(const k of alive){
    if(yearInt()-k.founded<10) continue;
    const m=misery(k);
    k.unrest=clamp((k.unrest||0)+(m>=2?m-1:-1),0,10);
    if(k.unrest<3||(k.lastSecession!=null&&yearInt()-k.lastSecession<15)) continue;
    if(rnd()>.12+k.unrest*.03) continue;
    const people=G.units.filter(u=>!u.dead&&u.kingdom===k.id&&u.race!=='monster'&&!u.flags.infil&&!u.captive&&!u.dungeonLord);
    if(people.length<22) continue;
    const L=pickRebelLeader(k,people); if(!L) continue;
    leadExodus(k,L,false);
  }
}
function leaderScore(u){ return (has(u,'Karismatik')?14:0)+(has(u,'Pemimpin Lahir')?14:0)+(has(u,'Ambisius')?8:0)+(has(u,'Adil')?6:0)+(has(u,'Bijak')?6:0)+(has(u,'Pemberani')?4:0)+u.lvl*.6+((u.iq||100)-100)*.12+BERKAT[u.b].s*2+(u.kelas==='bawah'?3:0)-(u.happy||60)*.05; }
function pickRebelLeader(k,people){
  return people.filter(u=>isAdult(u)&&stageOf(u)==='dewasa'&&!u.royal&&!u.flags.istana&&k.king!==u.id&&!u.possessed&&(has(u,'Karismatik')||has(u,'Pemimpin Lahir')||has(u,'Ambisius')||u.lvl>=15||(u.iq||100)>=125)).sort((a,b)=>leaderScore(b)-leaderScore(a))[0]||null;

function leadExodus(k,L,byVoice){
  const from=TN(L.town)||TN(k.capital);
  const kg=U(k.king);
  const people=G.units.filter(u=>!u.dead&&u.kingdom===k.id&&u.race!=='monster'&&!u.flags.infil&&!u.captive&&!u.dungeonLord&&!u.royal&&!u.flags.istana&&u!==L&&!u.possessed);
  // dihentikan raja?
  const guards=people.filter(u=>u.career==='penjaga').length;
  if(kg&&has(kg,'Kejam')&&guards>=4&&rnd()<.3){
    log(`${fullName(L)} mencoba memimpin rakyat keluar dari ${k.name}, tapi ${fullName(kg)} mengirim pasukan. Ia ditangkap dan dihukum mati di depan rakyat yang hendak mengikutinya.`,'war',{x:L.x,y:L.y});
    die(L,null,'dihukum mati karena memimpin pemisahan diri'); k.unrest+=2; return 'Raja menumpas gerakan itu.';
  }
  const site=freeKingdomSite(20,from); if(!site) return 'Tidak ada tanah kosong yang layak untuk kerajaan baru.';
  // pengikut: keluarga, sahabat, rakyat yang tidak bahagia
  const fam=u=>[u,U(u.spouse),...u.children.map(U)].filter(v=>v&&!v.dead&&v.kingdom===k.id&&!v.royal&&!v.flags.istana&&!v.captive);
  const set=new Set(fam(L));

  const want=Math.round(clamp(people.length*(.18+(k.unrest||3)*.03),8,45));
  const heads=people.filter(v=>isAdult(v)&&!set.has(v)).sort((a,b)=>pull(b)-pull(a));
  for(const h of heads){ if(set.size>=want) break; if(pull(h)<12) break; for(const m of fam(h)) set.add(m); }
  if(set.size<8) return 'Terlalu sedikit yang mau mengikutinya.';
  const race=L.race, R=RACE[race];
  const nk={id:newId(),race,name:`${R.kpre} ${L.marga||genName(race,'m')}`,color:KCOLS[G.colorIdx++%KCOLS.length],capital:null,king:null,queen:null,consorts:[],treasury:150,tax:.12,welfare:62,founded:yearInt(),alive:true,heir:null,origin:k.id,founder:L.id};

  const spot=()=>{ for(let i=0;i<60;i++){ const a=rnd()*Math.PI*2, r=3+rnd()*9; const x=Math.round(site.x+Math.cos(a)*r), y=Math.round(site.y+3+Math.sin(a)*r*.7); if(buildable(tileAt(x,y))&&!G.road[y*MW+x]&&(G.occ[y*MW+x]===0||G.occ[y*MW+x]===4)) return {x,y}; } return {x:site.x+ri(-8,8),y:site.y+ri(3,8)}; };
  const tents=new Map();
  for(const u of set){
    const head=U(u.father)&&set.has(U(u.father))&&!isAdult(u)?U(u.father):U(u.mother)&&set.has(U(u.mother))&&!isAdult(u)?U(u.mother):u.spouse&&set.has(U(u.spouse))&&u.sex==='f'?U(u.spouse):u;
    let tent=tents.get(head.id); if(!tent){ const s=spot(); tent=addBuilding(t,'tenda',null,{x:s.x,y:s.y}); tents.set(head.id,tent); }
    if(u.party){ const p=partyOf(u); if(p) partyLeave(p,u,'ikut eksodus'); }
    const oh=B(u.home); if(oh&&oh.owner===u.id) oh.owner=null;
    u.town=t.id; u.kingdom=nk.id; u.home=tent.id; u.task=null; u.inside=false; u.pendingAct=null; u.kelas=u.kelas||'bawah';
    if(u.career==='guild'||u.career==='guru'||u.career==='istana') u.career=null;
    goTo(u,(site.x+1)*TS+ri(-30,30),(site.y+3)*TS+ri(-20,20));

  const sp=U(L.spouse); if(sp&&set.has(sp)){ sp.royal=nk.id; sp.title=L.sex==='m'?'Permaisuri':'Pangeran Konsor'; sp.career='istana'; nk.queen=sp.id; }

/* ---------- populasi awal ---------- */
function populateKingdom(k,t,target){
  const race=k.race, R=RACE[race];
  let pop=G.units.filter(u=>!u.dead&&u.kingdom===k.id).length;
  let tent=null, inTent=0;
  const spot=()=>{ for(let i=0;i<80;i++){ const a=rnd()*Math.PI*2, r=4+rnd()*(t.R-6); const x=Math.round(t.cx+Math.cos(a)*r), y=Math.round(t.cy+3+Math.sin(a)*r*.7); if(buildable(tileAt(x,y))&&!G.road[y*MW+x]&&(G.occ[y*MW+x]===0||G.occ[y*MW+x]===4)) return {x,y}; } return {x:t.cx+ri(-10,10),y:t.cy+ri(3,10)}; };
  while(pop<target){
    if(!tent||inTent>=10){ const s=spot(); tent=addBuilding(t,'tenda',null,{x:s.x,y:s.y}); inTent=0; }
    const px=(tent.x+1.5)*TS, py=(tent.y+3)*TS;
    const h=makeUnit({race,sex:'m',age:adultAge(race,rnd()*.7),town:t.id,kingdom:k.id,home:tent.id,x:px,y:py});
    pop++; inTent++;
    if(rnd()<.75&&pop<target){ const w=makeUnit({race,sex:'f',age:adultAge(race,rnd()*.6),town:t.id,kingdom:k.id,home:tent.id,x:px+6,y:py,marga:h.marga}); marry(h,w,true); pop++; inTent++;
      const kids=wpick([0,1,2,3],x=>[2,3,3,1][x]); for(let i=0;i<kids&&pop<target;i++){ makeUnit({race,age:rnd()*R.adult*.9,mother:w.id,father:h.id,town:t.id,kingdom:k.id,home:tent.id,x:px+ri(-8,8),y:py+ri(2,8),marga:h.marga}); pop++; inTent++; } }
  }
  for(const u of G.units) if(u.town===t.id&&isAdult(u)&&!u.career) assignCareer(u);
  t.stock.food+=pop*22; t.stock.wood+=pop*2; t.stock.stone+=pop*1.5; k.treasury+=pop*3;
}
function setupPopulation(total){
  const ks=G.kingdoms.filter(k=>k.alive); if(!ks.length) return;
  const per=Math.round(total/ks.length);
  for(const k of ks){ const t=TN(k.capital); if(t) populateKingdom(k,t,per); }
  for(const k of ks){ const t=TN(k.capital); const pop=G.units.filter(u=>!u.dead&&u.town===t.id).length; let v=Math.floor((pop-80)/70); for(let i=0;i<Math.min(4,v);i++) foundVillage(t,k); }
}

function hvSite(cap){
  let best=null,bs=-1e9;
  for(let i=0;i<900;i++){
    const a=rnd()*Math.PI*2, r=cap.R+18+rnd()*55; const x=Math.round(cap.cx+Math.cos(a)*r), y=Math.round(cap.cy+Math.sin(a)*r);
    if(x<18||y<18||x>MW-19||y>MH-19) continue;
    if(G.towns.some(t=>dist(t.cx,t.cy,x,y)<t.R+18)) continue;
    if((G.dens||[]).some(d=>dist(d.x,d.y,x,y)<26)) continue;
    if(G.nests.some(n=>n.legend&&dist(n.x,n.y,x,y)<42)||G.dungeons.some(d=>dist(d.x,d.y,x,y)<14)) continue;
    let s=0, wild=0;
    for(let dy=-14;dy<=14;dy+=2)for(let dx=-14;dx<=14;dx+=2){ if(dx*dx+dy*dy>196) continue; const t=tileAt(x+dx,y+dy); s+=buildable(t)?2:-4; }
    for(let dy=-26;dy<=26;dy+=4)for(let dx=-26;dx<=26;dx+=4){ const t=tileAt(x+dx,y+dy); if(t===T.FOREST||t===T.MOUNT||t===T.HILLS) wild++; }
    s+=wild*.8-r*.3;
    if(s>bs){ bs=s; best={x,y}; }
  }
  return bs>60?best:null;
}

  if(target==='diri'){ const old=u.name; u.name=name; hist(u,`mengganti nama dari ${old} menjadi ${name} setelah sebuah mimpi`); log(`${old} ${u.marga} terbangun dan bersikeras dipanggil "${name}" mulai hari ini.`,'life',{x:u.x,y:u.y}); return {ok:true,line:sayT(u,'yes'),note:`Mulai sekarang ia bernama ${name}.`}; }
  if(target==='party'){ const pt=partyOf(u); if(!pt||pt.leader!==u.id) return {ok:false,line:'…',note:'Ia bukan ketua party.'}; const old=pt.name; pt.name=name; plog(pt,`Nama party diganti dari ${old} menjadi ${name}.`); return {ok:true,line:sayT(u,'yes'),note:`Party ${old} kini bernama ${name}.`}; }
  if(target==='kerajaan'){ const k=K(u.kingdom); if(!k||k.king!==u.id) return {ok:false,line:'…',note:'Ia bukan penguasa.'}; const old=k.name; k.name=name; log(`Atas titah ${fullName(u)}, ${old} kini bernama ${name}.`,'god',{x:u.x,y:u.y}); return {ok:true,line:sayT(u,'yes'),note:`${old} kini bernama ${name}.`}; }

}

function nekoCarry(m,o){

function hvWatchdog(){

    if(dist(vet.x,vet.y,x,y)>34){ vet.x=x; vet.y=y; vet.path=[]; }

  if(hv.state==='asking'&&G.step-hv.since.at>DAY*4){ hvDecide(); hv.since={state:hv.state,at:G.step}; }
}

/* =====================================================================
   SIMULASI 9: Aliansi Perburuan melawan monster S/SS pemakan korban,
   Balai Lelang (Auction Hall), Neko lebih cerdas

BLD.lelang={n:'Balai Lelang',w:8,h:6,work:1200,wood:30,stone:30};
const ALLY_COLORS=['#e8c050','#7fc8ff','#e86a5a','#9ad06a','#d090f0'];
function allyOf(u){ return u&&u.ally?(G.alliances||[]).find(a=>a.id===u.ally&&a.state!=='done'):null; }
function allyMembers(al){ return al.members.map(U).filter(v=>v&&!v.dead); }
function bigMon(m){ const r=MON[m.mk]&&MON[m.mk].rank; return r==='S'||r==='SS'||r==='SSS'; }
function allyEligible(u){
  if(u.dead||u.race==='monster'||!isAdult(u)||u.captive||u.possessed||u.downed||u.patient||u.dungeonLord||u.flags.infil) return false;
  if(u.ally||u.hq) return false;

  if(u.inside&&partyOf(u)&&partyOf(u).state==='in') return false;
  if(u.lvl<3) return false;
  if(u.party&&partyOf(u)&&partyOf(u).state!=='rest') return false;
  return canFight(u)||u.career==='hunter'||u.career==='penjaga'||u.career==='petualang';
}
function allyPower(u){ return u.lvl*3+u.atk*.6+u.maxHp*.05+armorDef(u.armorItem)*.5+(u.weapon&&typeof u.weapon==='object'?u.weapon.atk*.3:0); }
function rallyPoint(m,from){

  }

}
function allianceDaily(){
  G.alliances=G.alliances||[]; G.allyLog=G.allyLog||[];

  G.alliances=G.alliances.filter(a=>a.state!=='done'||G.step-a.ended<DAY*3);

  if(G.alliances.filter(a=>a.state!=='done').length>=2) return;
  const cands=G.units.filter(m=>!m.dead&&m.race==='monster'&&!m.tamer&&!m.inside&&!m.flags.sea&&!(MON[m.mk]&&MON[m.mk].sea)&&bigMon(m)&&(m.kills||0)>=1&&!(m.flags.allyCd>G.step)&&!G.alliances.some(a=>a.target===m.id&&a.state!=='done'));
  for(const m of cands){
    const ks=G.kingdoms.filter(k=>k.alive&&!k.hunter&&!k.hamlet&&TN(k.capital)).map(k=>{ const t=TN(k.capital); return {k,d:dist((t.cx+1)*TS,(t.cy+1)*TS,m.x,m.y)}; }).filter(o=>o.d<130*TS).sort((a,b)=>a.d-b.d).slice(0,5);
    if(!ks.length) continue;

}
function formAlliance(m,kings){
  G.alliances=G.alliances||[]; G.allyLog=G.allyLog||[];

  const send={};
  for(const k of kings){
    const all=G.units.filter(u=>u.kingdom===k.id&&allyEligible(u)).sort((a,b)=>allyPower(b)-allyPower(a)); const top=all[0]?all[0].lvl:0;
    const pool=all.filter(u=>u.lvl>=Math.max(3,Math.floor(top*.5))).slice(0,10);
    if(pool.length<2) continue;
    al.kingdoms.push(k.id); send[k.id]=pool;
  }
  const ht=hvTown();
  if(ht&&G.hv&&G.hv.state==='founded'){
    const pool=G.units.filter(u=>u.town===ht.id&&u.career==='hunter'&&allyEligible(u)).sort((a,b)=>allyPower(b)-allyPower(a)).slice(0,10);
    if(pool.length>=2){ al.hv=true; send.hv=pool; }
  }
  const all=Object.values(send).flat();
  if(all.length<6){ m.flags.allyCd=G.step+DAY*4; return null; }
  const ratio=allyRatio(all,m); al.ratio=ratio; m.flags.allyRatio=ratio;
  if(ratio<ALLY_MIN){ m.flags.allyCd=G.step+YEAR*.5; if(!m.flags.allyWarned){ m.flags.allyWarned=1; const names=al.kingdoms.map(id=>K(id).name);
      log(`Para penguasa ${names.join(', ')} bertemu membahas ${def.n} yang terus memakan korban. Kesimpulannya pahit: gabungan petarung terbaik mereka belum cukup kuat. Rakyat diminta menjauhi wilayahnya sampai para petarung lebih tangguh.`,'war',{x:m.x,y:m.y});
      plogAlly(`Aliansi melawan ${def.n} ditunda: kekuatan gabungan belum cukup (${Math.round(ratio*100)}%).`); }
    return null; }
  const lead=TN(K(al.kingdoms[0])?.capital)||ht;
  const from=lead?{x:(lead.cx+1)*TS,y:(lead.cy+1)*TS}:{x:m.x+200,y:m.y};
  const rp=rallyPoint(m,from); al.rx=rp.x; al.ry=rp.y;
  for(const u of all){ u.ally=al.id; u.task=null; u.path=[]; al.members.push(u.id); if(u.party){ const p=partyOf(u); if(p&&p.state==='rest') {} } hist(u,`dipanggil bergabung dengan aliansi perburuan ${def.n}`); }
  al.lead=al.kingdoms[0]||null;
  G.alliances.push(al);
  const names=al.kingdoms.map(id=>K(id).name).concat(al.hv?['Hunter Village']:[]);
  log(`${def.n} sudah menelan ${m.kills} korban jiwa. ${names.length>1?names.slice(0,-1).join(', ')+' dan '+names[names.length-1]:names[0]} membentuk Aliansi Perburuan! ${all.length} petarung terkuat dikirim dan berkumpul sebelum menyerang bersamaan.`,'war',{x:m.x,y:m.y});
  plogAlly(`Aliansi dibentuk melawan ${def.n} (${all.length} petarung dari ${names.join(', ')}).`);
  return al;
}
function plogAlly(s){ G.allyLog=G.allyLog||[]; G.allyLog.unshift(`Th ${yearInt()}: ${s}`); if(G.allyLog.length>24) G.allyLog.pop(); }
function allyCheck(al){
  const m=U(al.target); const mem=allyMembers(al);
  if(!m||m.dead){ if(al.state!=='done') allyEnd(al,m&&m.dead&&!al.won?'other':'gone'); return; }
  if(!mem.length){ allyEnd(al,'wiped'); return; }
  if(al.state==='gather'){
    const there=mem.filter(u=>dist(u.x,u.y,al.rx,al.ry)<60).length;
    if(there>=Math.ceil(mem.length*.75)||G.step-al.started>DAY*2){ al.state='attack'; al.attackAt=G.step; al.mult=1+Math.min(.8,mem.length*.04);
      log(`Aliansi Perburuan sudah berkumpul (${there}/${mem.length}). Aba-aba dibunyikan, semua menyerbu ${MON[al.mk].n} bersamaan!`,'war',{x:al.rx,y:al.ry}); }
  } else if(al.state==='attack'){
    const fighting=mem.filter(u=>!u.downed&&u.hp>u.maxHp*.25).length;
    if(G.step-al.attackAt>DAY*3||fighting<Math.max(2,al.members.length*.25)) allyEnd(al,'retreat');
  }
}
function allyStep(u){
  const al=allyOf(u); if(!al){ u.ally=null; u.task=null; return; }
  const m=U(al.target); if(!m||m.dead){ u.ally=null; u.task=null; return; }
  u.task={k:'ally'};
  const jx=((u.id*37)%60)-30, jy=((u.id*53)%40)-20;
  if(al.state==='gather'){
    if(dist(u.x,u.y,al.rx,al.ry)>40){ if(!u.path.length||G.step%60===u.id%60) goTo(u,al.rx+jx,al.ry+jy); }
    else { u.path=[]; u.moving=false; if(G.step%20===0&&u.hp<u.maxHp) u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.02); }
    return;
  }
  // serangan: mundur sebentar bila terluka, tabib di titik kumpul
  if(u.flags.allyRest){
    if(u.hp>=u.maxHp*.7){ u.flags.allyRest=0; }
    else { if(dist(u.x,u.y,al.rx,al.ry)>40){ if(!u.path.length||G.step%60===u.id%60) goTo(u,al.rx+jx,al.ry+jy); } else { u.path=[]; if(G.step%10===0) u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.025); } return; }
  }
  if(u.hp<u.maxHp*.35&&!has(u,'Pantang Menyerah')){ u.flags.allyRest=1; FX_QUEUE.push({k:'say',x:u.x,y:u.y-24,t:40,s:'Mundur!'}); goTo(u,al.rx+jx,al.ry+jy); return; }
  const d=dist(u.x,u.y,m.x,m.y);
  if(d<170&&isHostile(u,m)){ u.task={k:'fight',target:m.id,ally:al.id}; u.path=[]; return; }
  if(!u.path.length||G.step%30===u.id%30) goTo(u,m.x+jx*.5,m.y+jy*.5);
}
function allyEnd(al,why){
  if(al.state==='done') return;
  al.state='done'; al.ended=G.step;
  const m=U(al.target), def=MON[al.mk];
  for(const id of al.members){ const u=U(id); if(u){ u.ally=null; u.flags.allyRest=0; if(u.task&&(u.task.k==='ally'||u.task.ally===al.id)) u.task=null; u.path=[]; } }
  if(why==='retreat'){ if(m) m.flags.allyCd=G.step+YEAR*.6; log(`Aliansi Perburuan gagal menumbangkan ${def.n} dan mundur. ${al.dead.length?`${al.dead.length} petarung gugur.`:''}`,'war',m?{x:m.x,y:m.y}:null); plogAlly(`Aliansi melawan ${def.n} mundur. Gugur: ${al.dead.length}.`); }
  else if(why==='wiped'){ if(m) m.flags.allyCd=G.step+YEAR; log(`Seluruh Aliansi Perburuan melawan ${def.n} tumbang. Negeri-negeri berduka.`,'war',m?{x:m.x,y:m.y}:null); plogAlly(`Aliansi melawan ${def.n} musnah.`); }
  else if(why==='other'||why==='gone'){ plogAlly(`Aliansi melawan ${def.n} dibubarkan: makhluk itu ${why==='other'?'sudah ditumbangkan pihak lain':'menghilang'}.`); }
}
/* dipanggil dari die() saat anggota aliansi gugur */
function allyDeath(u){ const al=allyOf(u); if(al){ al.dead.push(u.name); } }
/* dipanggil dari monsterKilled */
function allyKill(m,killer){
  const al=(G.alliances||[]).find(a=>a.target===m.id&&a.state!=='done'); if(!al) return;
  const def=MON[m.mk], rk=RANK_ORDER.indexOf(def.rank);
  const isMember=al.members.includes(killer.id);
  al.won=true; al.killer=killer.id; al.lastHit=killer.name;
  const mem=allyMembers(al);
  for(const u of mem){ gainXp(u,def.xp*.55); u.gold+=def.bounty*.5/mem.length; hist(u,`ikut Aliansi Perburuan yang menumbangkan ${def.n}`); u.flags.allyWins=(u.flags.allyWins||0)+1; }
  al.xp=Math.round(def.xp*.55);

  log(`${def.n} tumbang! Serangan serentak Aliansi Perburuan berhasil${isMember?`, pukulan terakhir oleh ${fullName(killer)}`:''}. ${mem.length} petarung selamat${al.dead.length?`, ${al.dead.length} gugur`:''}. Semua anggota mendapat ${al.xp} XP dari perburuan ini.`,'hero',{x:m.x,y:m.y});

  al.carcass={mk:m.mk,x:m.x,y:m.y,hall:hall?hall.id:null,hauler:tamer?tamer.id:null,at:G.step};
  if(tamer&&hall){ tamer.flags.haul={al:al.id,mk:m.mk,x:m.x,y:m.y,phase:'go',until:G.step+DAY*4}; tamer.task=null; tamer.path=[];
    log(`${fullName(tamer)}, seorang Tamer, berangkat mengambil bangkai ${def.n} untuk dikuliti dan dibawa ke ${BLD.lelang.n} di ${TN(hall.town).name}.`,'life',{x:tamer.x,y:tamer.y}); }
  else runAuction(al,false);
}
function pickHauler(al,m){
  const ok=u=>!u.dead&&u.race!=='monster'&&isAdult(u)&&!u.downed&&!u.captive&&!u.possessed&&!u.flags.haul&&(BERKAT[u.b].n==='Tamer'||tamerInfo(u));
  const sc=u=>(u.royal?1e6:0)+dist(u.x,u.y,m.x,m.y);
  const inAl=allyMembers(al).filter(ok); if(inAl.length) return inAl.sort((a,b)=>sc(a)-sc(b))[0];
  if(false) return inAl.sort((a,b)=>dist(a.x,a.y,m.x,m.y)-dist(b.x,b.y,m.x,m.y))[0];
  return G.units.filter(ok).sort((a,b)=>sc(a)-sc(b))[0]||null;
}
function auctionHall(al){
  const ht=hvTown(); const t=ht||TN(K(al.lead)?.capital)||al.kingdoms.map(id=>TN(K(id)?.capital)).find(Boolean);
  if(!t) return null;

    log(`${BLD.lelang.n} didirikan di ${t.name}. Hasil buruan aliansi akan dilelang di sini.`,'life',{x:(b.x+4)*TS,y:(b.y+3)*TS}); }

}
function haulStep(u){
  const h=u.flags.haul; const al=(G.alliances||[]).find(a=>a.id===h.al);
  const hall=al&&al.carcass&&B(al.carcass.hall);

  u.task={k:'haul'};

    if(dist(u.x,u.y,h.x,h.y)<20){ h.phase='back'; u.path=[]; FX_QUEUE.push({k:'say',x:u.x,y:u.y-24,t:50,s:'Kuliti di Balai!'}); }

  if(!u.path.length||G.step%60===u.id%60) goTo(u,d.x,d.y);

function runAuction(al,skinned){
  if(al.auctioned) return; al.auctioned=true;
  const def=MON[al.mk], rk=RANK_ORDER.indexOf(def.rank), hall=al.carcass&&B(al.carcass.hall), t=hall&&TN(hall.town);
  const mat=`${MAT_WORD(al.mk)} ${def.n}`;

  const bids=pool.map(u=>({u,b:Math.round(Math.min(u.gold,u.gold*(.45+rnd()*.45)+(al.members.includes(u.id)?base*.2:0)))})).sort((a,b)=>b.b-a.b);
  const top=bids[0];

/* Neko lebih cerdas: ikut tumbuh bersama tuannya dan mundur bila terluka */
function nekoSmart(m,o){
  if(G.step%200===0){ const mh=Math.round(110+o.lvl*9); if(m.maxHp<mh){ const r=m.hp/m.maxHp; m.maxHp=mh; m.hp=mh*r; } m.atk=Math.max(m.atk,10+o.lvl*.7); m.def=Math.max(m.def||0,o.lvl*.4); }
  if(m.flags.nekoRest&&G.step<m.flags.nekoRest){
    if(G.step%10===0) m.hp=Math.min(m.maxHp,m.hp+m.maxHp*.03);
    const tx=o.x+(o.flip?14:-14), ty=o.y+4; m.task=null;
    if(dist(m.x,m.y,tx,ty)>10){ if(!m.path.length||G.step%8===0) m.path=[{x:tx,y:ty}]; followPath(m); } else { m.path=[]; m.moving=false; }
    if(G.step%60===0) FX_QUEUE.push({k:'say',x:m.x,y:m.y-16,t:30,s:'Nya…'});
    return true;
  }
  if(m.hp<m.maxHp*.35){ m.flags.nekoRest=G.step+Math.round(DAY*.15); m.task=null; m.path=[]; FX_QUEUE.push({k:'say',x:m.x,y:m.y-16,t:40,s:'Nyaa! Mundur!'}); return true; }
  // jangan ikut memukul monster raksasa; lindungi tuan dari monster kecil
  if(m.task&&m.task.k==='fight'){ const e=U(m.task.target); if(e&&e.race==='monster'&&bigMon(e)){ const small=nearest(o.x,o.y,80,v=>isHostile(m,v)&&v.race==='monster'&&!bigMon(v)); if(small) m.task={k:'fight',target:small.id}; } }
  return false;
}

/* serangan terkoordinasi: aliansi menembus zirah & saling melindungi */
function allyMod(v,src,amt){
  if(src.ally&&v.race==='monster'){ const al=allyOf(src); if(al&&al.target===v.id&&al.state==='attack'){ const arm=(v.def+(MON[v.mk].armor||0))*.5; return amt*(al.mult||1.3)+arm*.6; } }
  if(v.ally&&src.race==='monster'){ const al=allyOf(v); if(al&&al.target===src.id&&al.state==='attack') return amt*.75; }
  return amt;
}

const ALLY_MIN=.15;
function allyRatio(us,m){ const p=us.reduce((s,u)=>s+(u.atk+wAtk(u.weapon)*.8)*(u.maxHp+armorDef(u.armorItem)*6),0); const def=MON[m.mk]; return p*1.3/((m.maxHp)*(def.atk)); }

function isCaster(u){ return u.race!=='monster'&&['penyihir','penyembuh'].includes(roleOf(u)); }
function bagCap(u){ return ['petualang','hunter','penjaga'].includes(u.career)||u.ally||u.hq?10:u.career==='kurir'?8:5; }
function bag(u){ if(!u.bag){ u.bag={}; if(u.flags&&u.flags.potion){ u.bag.hp=1; u.flags.potion=false; } } return u.bag; }
function bagCount(u){ let s=0; for(const k in bag(u)) s+=u.bag[k]; return s; }
function bagHas(u,k){ return (bag(u)[k]||0)>0; }
function addItem(u,k,n=1){ const b=bag(u); const room=bagCap(u)-bagCount(u); const q=Math.min(n,room); if(q<=0) return 0; b[k]=(b[k]||0)+q; return q; }
function takeItem(u,k){ const b=bag(u); if(!b[k]) return false; b[k]--; if(b[k]<=0) delete b[k]; return true; }
function ensureMp(u){ if(!isCaster(u)) return; const mx=20+u.lvl*2; if(u.maxMp!==mx){ u.maxMp=mx; if(u.mp==null) u.mp=mx; u.mp=Math.min(u.mp,mx); } }

function useItems(u,e){
  if(u.race==='monster'||u.downed||u.dead) return;
  if(flashCheck(u,e)) return;
  const b=bag(u); if(!Object.keys(b).length) return;

  if(hp<.22&&b.max){ takeItem(u,'max'); u.hp=u.maxHp; if(u.maxMp) u.mp=u.maxMp; u.fx=null; itemFx(u,'max'); return; }
  if(hp<.3&&b.hpHi){ takeItem(u,'hpHi'); u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.7); itemFx(u,'hpHi'); return; }
  if(hp<.42&&b.hp){ takeItem(u,'hp'); u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.35); itemFx(u,'hp'); return; }
  if(hp<.3&&b.hpHi===undefined&&b.hp===undefined&&b.max===undefined&&b.smoke&&e&&!e.dead){ takeItem(u,'smoke'); applyFx(e,'fear',90,u); FX_QUEUE.push({k:'nova',x:u.x,y:u.y-6,r:22,c:'#c8c8d0',t:30,ring:1}); itemFx(u,'smoke','Bom asap!'); u.task={k:'flee',t:60}; const h=B(u.home); if(h){ const d=bldDoor(h); goTo(u,d.x,d.y); } return; }
  if(u.fx&&['poison','burn','curse','slow','fear'].some(k=>hasFx(u,k))&&b.cure){ takeItem(u,'cure'); for(const k of ['poison','burn','curse','slow','fear']) if(u.fx[k]) delete u.fx[k]; itemFx(u,'cure'); return; }
  if(u.maxMp&&u.mp<u.maxMp*.2){ if(b.mpHi){ takeItem(u,'mpHi'); u.mp=Math.min(u.maxMp,u.mp+u.maxMp*.8); itemFx(u,'mpHi'); return; } if(b.mp){ takeItem(u,'mp'); u.mp=Math.min(u.maxMp,u.mp+u.maxMp*.4); itemFx(u,'mp'); return; } }
  if(e&&e.race==='monster'&&!(u.flags.str&&u.flags.str.until>G.step)){ const er=RANK_ORDER.indexOf(MON[e.mk].rank), mr=RANK_ORDER.indexOf(rankOf(u.lvl));
    if(er>=Math.max(2,mr)){ for(let g=STR_G.length-1;g>=0;g--){ if(b['str'+STR_G[g]]&&g<=er+1){ takeItem(u,'str'+STR_G[g]); u.flags.str={until:G.step+Math.round(DAY*.5),m:STR_M[g],g:STR_G[g]}; itemFx(u,'str'+STR_G[g]); return; } } } }

function petSmart(m,o){
  if(m.flags.petRest&&G.step<m.flags.petRest){

    m.task=null; const tx=o.x+(o.flip?14:-14), ty=o.y+4;

    if(m.hp>=m.maxHp*.75) m.flags.petRest=0;

  }
  if(m.hp<m.maxHp*.3){ m.flags.petRest=G.step+Math.round(DAY*.2); m.task=null; m.path=[]; FX_QUEUE.push({k:'say',x:m.x,y:m.y-18,t:30,s:'!'}); return true; }

  return false;
}

  return u.lvl>=7&&(vet||solo||ageOf(u)>=RACE[u.race].adult+16||martial(u)&&u.lvl>=10)&&(u.career==='petualang'||u.career==='hunter'||u.career==='guild'||stageOf(u)==='tua'||martial(u));

  }

function councilMembers(k,t){

function voteOf(u,item,k){

function outcastYearly(){
  for(const u of G.units){
    if(u.dead||!u.isekai||!u.flags.buangan||u.flags.fate||!isAdult(u)) continue;
    if(yearInt()-(u.flags.summonY||0)<1) continue;
    const k=K(u.kingdom); const fol=namedOf(u).length;
    const better=G.kingdoms.filter(o=>o.alive&&!o.hunter&&!o.hamlet&&o!==k&&TN(o.capital)&&(o.welfare||60)>((k&&k.welfare)||60)+4&&(!k||typeof dip!=='function'||dip(k,o).status!=='perang')).sort((a,b)=>b.welfare-a.welfare)[0];
    const r=rnd();
    const pHam=.22+fol*.08+(has(u,'Pemberani')?.1:0)+(u.motif==='kebebasan'?.15:0);
    if(r<pHam&&foundHamlet(u)) continue;
    if(better&&r<pHam+.3){ migrateTo(u,better); continue; }
    u.flags.fate='baur'; if(u.title==='Orang Buangan') u.title=null; hist(u,'memilih hidup sebagai warga biasa');
    log(`${u.name} ${u.marga}, orang dunia lain yang dulu dibuang istana, kini berbaur sebagai warga biasa di ${TN(u.town)?.name||'kota'}. Tetangganya bahkan tidak tahu ia berasal dari dunia lain.`,'life',{x:u.x,y:u.y});
  }
}
function famUnits(u){ return [u,U(u.spouse),...(u.children||[]).map(U).filter(c=>c&&!isAdult(c))].filter(x=>x&&!x.dead&&!x.royal); }
function migrateTo(u,k2){
  const t=TN(k2.capital); const from=K(u.kingdom); u.flags.fate='pindah';
  for(const m of famUnits(u)){ m.town=t.id; m.kingdom=k2.id; m.home=(G.blds.find(b=>b.town===t.id&&b.type==='tenda')||{}).id||null; m.task=null; goTo(m,(t.cx+1)*TS+ri(-20,20),(t.cy+2)*TS+ri(-8,8)); }
  hist(u,`pindah ke ${k2.name} mencari hidup yang lebih layak`);
  log(`${u.name} ${u.marga}, orang dunia lain yang dibuang ${from?from.name:'istana'}, mengemasi barangnya dan pindah ke ${k2.name}. Katanya di sana rakyat lebih sejahtera.`,'life',{x:u.x,y:u.y});
}
function hamletSpot(){
  let best=null,bs=-1e9;
  for(let y=18;y<MH-18;y+=3) for(let x=18;x<MW-18;x+=3){
    if(!buildable(tileAt(x,y))) continue;
    let near=1e9; for(const o of G.towns){ const d=dist(o.cx,o.cy,x,y)-o.R; if(d<near) near=d; } if(near<20) continue;
    if(G.nests.some(n=>n.legend&&dist(n.x,n.y,x,y)<30)||(G.dens||[]).some(d=>dist(d.x,d.y,x,y)<20)||G.dungeons.some(d=>dist(d.x,d.y,x,y)<12)) continue;
    let s=0; for(let dy=-7;dy<=7;dy+=2)for(let dx=-7;dx<=7;dx+=2) s+=buildable(tileAt(x+dx,y+dy))?1:-2;
    if(s<40) continue;
    for(const n of G.nests){ const d=dist(n.x,n.y,x,y); if(d<14) s-=(14-d)*(1+(n.danger||1))*.6; }
    s+=Math.min(near,50)*.4+rnd()*6;
    if(s>bs){ bs=s; best={x,y}; } }
  return bs>=30?best:null;
}

  const s0=freeSlot(t); if(!s0){ G.towns=G.towns.filter(x=>x!==t); G.kingdoms=G.kingdoms.filter(x=>x!==k); return false; }

  log(`${u.name} ${u.marga}, orang dunia lain yang dibuang ${from?from.name:'istana'}, pergi jauh dari semua kerajaan bersama ${fam.length>1?'keluarga kecilnya':'dirinya sendiri'}${namedOf(u).length?` dan ${namedOf(u).length} monster bernama`:''}. Di tanah kosong itu ia membuka pemukiman ${t.name}.`,'life',{x:(t.cx+1)*TS,y:(t.cy+1)*TS});

}

  c=newCanvas(); const g=c.getContext('2d'); const P=mkP(g);
  if(p.stage==='bayi') drawBaby(P,p,f); else drawBody(P,p,dir,f,raw==='mounted');
  if(!raw) outline(g);
  cache.set(key,c); return c;
}

function drawBaby(P,p,f){
  const wob=f===1?-1:f===3?1:0, cloth='#efe3c8';
  P(-4,0,8,1,'rgba(0,0,0,.25)');
  P(-3+wob,-5,6,5,cloth); P(-3+wob,-5,6,1,shade(cloth,.15)); P(2+wob,-4,1,4,shade(cloth,-.15)); P(-2+wob,-3,4,1,'#d8c8a4');
  const hx=-2+wob, hy=-9;
  P(hx,hy,4,4,p.skin); P(hx,hy,4,1,p.hair); P(hx+1,hy-1,1,1,p.hair);
  P(hx+1,hy+2,1,1,p.eye); P(hx+3,hy+2,1,1,p.eye);
  if(p.race==='elf'||p.race==='halfelf'){ P(hx-1,hy+1,1,1,p.skin); P(hx+4,hy+1,1,1,p.skin); }
  if(p.race==='beastkin'){ P(hx,hy-2,1,2,p.hair); P(hx+3,hy-2,1,2,p.hair); }
  if(p.race==='iblis'){ P(hx,hy-1,1,1,'#e8dcc8'); P(hx+3,hy-1,1,1,'#e8dcc8'); }
}

function drawBody(P,p,dir,f,mounted){
  const R=SPR(p.race), J=JOBDEF[p.job]||{};
  let leg=R.leg,tor=R.tor,tw=R.tw; const hw=R.hw||6, head=6;
  if(p.stage==='anak'){ leg=p.race==='dwarf'?2:3; tor=4; tw=p.race==='dwarf'?6:4; }
  else if(p.stage==='remaja'){ leg=Math.max(3,leg-1); tor=5; tw=p.race==='dwarf'?8:6; }
  const elder=p.stage==='tua', adult=p.stage==='dewasa'||elder;
  const uni=adult&&!!J.cloth;
  const fem=J.female?true:p.sex==='f';
  const hair=elder?(p.race==='elf'?'#f2f0f6':'#c8c4c0'):p.hair;
  const cloth=uni?J.cloth:p.cloth, cloth2=p.cloth2||shade(cloth,-.3);
  const outfit=uni?null:(p.outfit||'tunik');
  const pants=uni?(J.pants||'#5b4a3a'):(outfit==='kemeja'?cloth2:'#5b4a3a');
  const boots=R.bones?'#cfc8b4':R.stone?'#6a6a64':'#4a3426';
  const bareTorso=uni&&J.bareTorso;
  const torC=bareTorso?p.skin:cloth;
  const sleeve=(uni&&J.bare)||bareTorso?p.skin:(outfit==='mantel'?cloth2:cloth);
  const robe=(uni&&J.robe)||(outfit==='gaun'&&fem&&p.stage!=='anak');
  const robeC=outfit==='gaun'?cloth:cloth;
  const legTop=-leg, torTop=legTop-tor, hy=torTop-head+(elder?1:0);
  const side=dir==='side', back=dir==='up';
  const stw=Math.max(4,tw-2);
  const T=side?stw:tw;
  const lift1=f===1, lift3=f===3;
  const tool=adult?J.tool:null;
  const handY=torTop+tor-1;

  if(!mounted) P(-T/2-1,0,T+2,1,'rgba(0,0,0,.28)');

  if(adult&&J.cape&&!back){
    if(side){ const fl=(f%2)?1:0; P(-stw/2-1-fl,torTop+1,2,tor+(mounted?2:leg-2),J.cape); }
    else { P(-tw/2-2,torTop+1,1,tor+1,J.cape); P(tw/2+1,torTop+1,1,tor+1,J.cape); }
  }
  if(adult&&J.back==='pack'&&side) P(-stw/2-3,torTop+1,3,tor-1,'#8a6a3a');
  if(adult&&J.back==='satchel'&&side) P(-stw/2-2,torTop+3,2,3,'#7a4a2a');
  if(adult&&J.back==='quiver'&&side){ P(-stw/2-2,torTop-2,2,tor+1,'#7a4a2a'); P(-stw/2-2,torTop-3,2,1,'#e8e0cc'); }
  if(adult&&J.back==='swords'&&!back){ P(-tw/2-2,torTop-3,1,tor+2,'#c8d0d8'); P(tw/2+1,torTop-3,1,tor+2,'#c8d0d8'); }
  const tailCol=R.tailC||(p.race==='iblis'?'#5a1f2e':hair);
  if(R.wings&&!mounted){ const wc=R.wings, wd=shade(R.wings,-.3);
    if(side){ P(-stw/2-5,torTop-3,4,1,wc); P(-stw/2-6,torTop-2,5,2,wc); P(-stw/2-5,torTop,3,2,wd); }
    else { P(-tw/2-5,torTop-3,4,1,wc); P(-tw/2-6,torTop-2,5,3,wc); P(-tw/2-4,torTop+1,3,2,wd); P(tw/2+1,torTop-3,4,1,wc); P(tw/2+1,torTop-2,5,3,wc); P(tw/2+1,torTop+1,3,2,wd); } }
  if((p.race==='beastkin'||R.ltail)&&!back&&!mounted){
    if(side){ P(-stw/2-1,legTop-2,1,2,tailCol); P(-stw/2-2,legTop-4,1,3,tailCol); P(-stw/2-3,legTop-6,1,2,shade(tailCol,.5)); }
    else { P(tw/2,legTop-1,1,2,tailCol); P(tw/2+1,legTop-3,1,3,tailCol); P(tw/2+2,legTop-5,1,2,shade(tailCol,.5)); }
  }
  if((p.race==='iblis'||R.dtail)&&!back&&!mounted){
    if(side){ P(-stw/2-1,legTop-1,1,1,tailCol); P(-stw/2-2,legTop-2,1,1,tailCol); P(-stw/2-3,legTop-4,1,2,tailCol); P(-stw/2-4,legTop-6,3,2,tailCol); }
    else { P(tw/2,legTop-1,1,1,tailCol); P(tw/2+1,legTop-2,1,1,tailCol); P(tw/2+2,legTop-4,1,2,tailCol); P(tw/2+1,legTop-6,3,2,tailCol); }
  }

  // kaki
  if(mounted){ /* kaki ditangani oleh tunggangan */ }
  else if(robe){
    for(let r=0;r<leg;r++){ const fl=Math.min(2,Math.floor(r/2)); P(-T/2-fl,legTop+r,T+fl*2,1,robeC); }
    P(-T/2-2,-1,T+4,1,uni?(J.trim||shade(cloth,-.3)):cloth2);
    if(!side){ P(-2+(lift1?-1:0),-1,1,1,boots); P(1+(lift3?1:0),-1,1,1,boots); }
  } else if(side){
    if(f===0||f===2){ P(-1,legTop,2,leg,pants); P(-1,-1,3,1,boots); }
    else { const fw=f===1?1:-1;
      P(-1-fw,legTop,2,leg,shade(pants,-.25)); P(-1-fw,-1,2,1,shade(boots,-.2));
      P(-1+fw,legTop,2,leg,pants); P(-1+fw,-1,3,1,boots); }
  } else {
    const lw=tw>=8?Math.floor(tw/2)-1:2;
    P(-lw,legTop,lw,leg-(lift1?1:0),pants); P(-lw,-1-(lift1?1:0),lw,1,boots);
    P(0,legTop,lw,leg-(lift3?1:0),shade(pants,-.12)); P(0,-1-(lift3?1:0),lw,1,boots);
  }
  if(uni&&J.loin&&!mounted) P(-T/2+1,legTop,T-2,2,J.loin);
  if(!mounted&&fem&&!robe&&!(uni&&(J.armor||J.armorLite))&&p.stage!=='anak'&&!R.bones){ P(-T/2-1,legTop,T+2,2,shade(cloth,-.2)); }
  if(!uni&&outfit==='mantel'&&!mounted&&!robe){ P(-T/2,legTop,1,2,cloth2); P(T/2-1,legTop,1,2,cloth2); }

  // badan
  P(-T/2,torTop,T,tor,torC);
  if(!side){ P(-T/2,torTop,1,tor,shade(torC,.14)); P(T/2-1,torTop,1,tor,shade(torC,-.18)); }
  if(R.bones){ for(let k=1;k<tor-1;k+=2) P(-T/2+1,torTop+k,T-2,1,'#4a4440'); P(-0,torTop,1,tor,'#cfc8b4'); }
  if(R.stone){ P(-T/2,torTop,3,1,'#5a8a3a'); P(T/2-2,torTop+2,1,2,'#6a6a64'); P(-T/2+2,torTop+4,1,1,'#5ae0ff'); }
  if(bareTorso&&!R.bones){ P(-T/2+1,torTop+2,1,1,shade(p.skin,-.15)); P(T/2-2,torTop+2,1,1,shade(p.skin,-.15)); }
  if(uni&&J.strap&&!back) for(let k=0;k<tor;k++) P(-T/2+k*(T/tor),torTop+k,1,1,J.strap);
  if(uni&&J.plaid){ for(let y=0;y<tor;y++)for(let x=0;x<T;x++) if((x+y)%2===0) P(-T/2+x,torTop+y,1,1,shade(cloth,-.22)); }
  if(uni&&J.armor){ P(-T/2+1,torTop+1,1,tor-2,shade(cloth,.35)); P(-T/2,torTop+Math.floor(tor/2),T,1,shade(cloth,-.25)); }
  if(uni&&J.armorLite){ P(-T/2,torTop,T,2,shade(cloth,-.25)); }
  if(uni&&J.apron&&!back){ P(-T/2+1,torTop+2,T-2,tor-1,J.apron); P(-T/2+1,legTop,T-2,mounted?0:1,J.apron); }
  if(uni&&J.trim){ if(!side&&!back) P(-1,torTop,2,tor,J.trim); P(-T/2,torTop,T,1,J.trim); }
  if(uni&&J.fur){ P(-T/2-1,torTop,T+2,1,'#f4f0e6'); P(-T/2,torTop,1,1,'#2a2a2a'); P(T/2-2,torTop,1,1,'#2a2a2a'); }
  // gaya pakaian rakyat
  if(!uni){
    if(outfit==='rompi'){ if(back) P(-T/2,torTop,T,tor-1,cloth2); else if(side) P(-T/2,torTop,2,tor-1,cloth2); else { P(-T/2,torTop,2,tor-1,cloth2); P(T/2-2,torTop,2,tor-1,cloth2); } }
    else if(outfit==='mantel'){ P(-T/2,torTop,T,tor,cloth2); if(!side&&!back){ P(0,torTop+1,1,1,'#e3b75e'); P(0,torTop+3,1,1,'#e3b75e'); P(-1,torTop,2,1,cloth); } }
    else if(outfit==='kemeja'){ if(!side){ P(-T/2+1,torTop,1,tor,'#4a3426'); P(T/2-2,torTop,1,tor,'#4a3426'); } }
    else if(outfit==='syal'){ P(-T/2,torTop,T,1,cloth2); if(!back) P(side?1:1,torTop+1,1,2,cloth2); }
    else if(outfit==='gaun'){ P(-T/2,torTop+tor-2,T,1,cloth2); }
  }
  const noBelt=robe||(uni&&(J.armor||J.apron||J.bareTorso))||R.bones||R.stone||outfit==='mantel';
  if(!noBelt) P(-T/2,torTop+tor-1,T,1,'#4a3426');
  if(adult&&J.back==='pack'&&!side&&!back){ P(-T/2+1,torTop,1,tor-1,'#5a4026'); P(T/2-2,torTop,1,tor-1,'#5a4026'); }
  if(adult&&J.back==='satchel'&&!back){ for(let k=0;k<tor;k++) P(-T/2+k,torTop+k,1,1,'#5a4026'); if(!side) P(T/2-1,torTop+tor-2,2,2,'#7a4a2a'); }

  // punggung
  if(adult&&J.cape&&back){ P(-tw/2-1,torTop,tw+2,tor+(mounted?2:leg-1),J.cape); P(-tw/2-1,torTop,tw+2,1,shade(J.cape,.2)); }
  if(adult&&J.back==='pack'&&back){ P(-tw/2+1,torTop+1,tw-2,tor-1,'#8a6a3a'); P(-tw/2+1,torTop+1,tw-2,1,'#6a4a2a'); }
  if(adult&&J.back==='quiver'&&back){ P(1,torTop-2,2,tor+1,'#7a4a2a'); P(1,torTop-3,2,1,'#e8e0cc'); }
  if(adult&&J.back==='swords'&&back){ P(-3,torTop-3,1,tor+3,'#c8d0d8'); P(2,torTop-3,1,tor+3,'#c8d0d8'); P(-3,torTop+tor-1,6,1,'#6a4a2a'); }

  // lengan
  const armLen=Math.max(2,tor-1); const aw=tw>=10?2:1;
  if(side){
    const sw=mounted?0:(f===1?1:f===3?-1:0);
    P(-1+sw,torTop+1,2,armLen-1,sleeve); P(-1+sw,torTop+armLen,2,1,p.skin);
  } else {
    const la=armLen-(lift1&&!mounted?1:0), ra=armLen-(lift3&&!mounted?1:0);
    P(-tw/2-aw,torTop+1,aw,la-1,sleeve); P(-tw/2-aw,torTop+la,aw,1,p.skin);
    P(tw/2,torTop+1,aw,ra-1,sleeve); P(tw/2,torTop+ra,aw,1,p.skin);
  }

  // kepala
  P(-hw/2,hy,hw,head,p.skin);
  if(!side&&!back) P(-hw/2,hy+head-1,hw,1,shade(p.skin,-.1));
  const style=R.bald||R.bones||R.stone||R.ears==='goblin'&&p.race==='goblin'||p.race==='ogre'?'bald':(p.style||'short');
  const long=style==='long'||style==='braid';
  const ec=J.glowEye&&adult?J.glowEye:p.eye;
  if(style!=='bald'){
    if(back){
      P(-hw/2,hy,hw,head-1,hair);
      if(long) P(-hw/2,hy+head-1,hw,3,hair);
      if(style==='tail') P(-1,hy+head-1,2,3,hair);
      if(style==='braid') P(-1,hy+head+2,2,3,hair);
      if(style==='bun') P(-1,hy-1,3,2,hair);
    } else if(side){
      P(-hw/2,hy,hw,2,hair); P(-hw/2,hy+2,3,long?6:3,hair);
      if(style==='tail') P(-hw/2-2,hy+2,2,3,hair);
      if(style==='bun') P(-hw/2-1,hy-1,3,2,hair);
      if(style==='spiky'){ P(-hw/2,hy-1,1,1,hair); P(-hw/2+2,hy-1,1,1,hair); P(-hw/2+4,hy-1,1,1,hair); }
    } else {
      P(-hw/2,hy,hw,2,hair);
      P(-hw/2,hy+2,1,long?5:1,hair); P(hw/2-1,hy+2,1,long?5:1,hair);
      if(!long) P(-hw/2+1,hy+2,2,1,hair);
      if(style==='bun') P(-1,hy-2,2,2,hair);
      if(style==='tail') P(hw/2,hy+2,1,3,hair);
      if(style==='braid') P(hw/2-1,hy+7,1,3,hair);
      if(style==='spiky'){ P(-hw/2,hy-1,1,1,hair); P(-1,hy-1,1,1,hair); P(hw/2-2,hy-1,1,1,hair); }
    }
  } else if(!back&&!R.bones&&!R.stone&&p.race!=='goblin'&&p.race!=='ogre'){ P(-hw/2,hy+2,1,2,hair); P(hw/2-1,hy+2,1,2,hair); }
  if(R.bones&&!back){ P(-2,hy+2,2,2,'#2a2228'); P(1,hy+2,2,2,'#2a2228'); P(-1,hy+5,3,1,'#4a4440'); }
  if(!back){
    if(side){ P(hw/2-2,hy+3,1,1,ec); P(hw/2,hy+4,1,1,p.skin); }
    else { const ex=hw>6?3:2; P(-ex,hy+3,1,1,ec); P(ex-1,hy+3,1,1,ec);
      if(elder){ P(-2,hy+2,1,1,shade(p.skin,-.15)); P(1,hy+2,1,1,shade(p.skin,-.15)); } }
  }
  // ciri ras
  if(p.race==='elf'||p.race==='halfelf'){
    const tip=p.race==='elf';
    if(side){ P(-hw/2-1,hy+2,1,2,p.skin); if(tip) P(-hw/2-2,hy+1,1,1,p.skin); }
    else { P(-hw/2-1,hy+2,1,2,p.skin); P(hw/2,hy+2,1,2,p.skin); if(tip){ P(-hw/2-2,hy+1,1,1,p.skin); P(hw/2+1,hy+1,1,1,p.skin); } }
  }
  if(R.ears==='goblin'){
    if(side){ P(-hw/2-1,hy+2,1,1,p.skin); P(-hw/2-2,hy+2,1,1,p.skin); P(-hw/2-3,hy+1,1,1,p.skin); }
    else { P(-hw/2-1,hy+2,1,1,p.skin); P(-hw/2-2,hy+2,1,1,p.skin); P(-hw/2-3,hy+1,1,1,p.skin); P(hw/2,hy+2,1,1,p.skin); P(hw/2+1,hy+2,1,1,p.skin); P(hw/2+2,hy+1,1,1,p.skin);
      if(!back) P(-1,hy+4,2,1,shade(p.skin,-.2)); }
  }
  if(R.tusk&&!back){ if(side) P(hw/2-1,hy+5,1,1,'#f4f0e0'); else { P(-2,hy+5,1,1,'#f4f0e0'); P(1,hy+5,1,1,'#f4f0e0'); } }
  if(p.race==='beastkin'){
    const inner='#e8a0a0';
    if(side){ P(-1,hy-2,2,2,hair); P(-1,hy-3,1,1,hair); P(0,hy-1,1,1,inner); }
    else { P(-hw/2,hy-2,2,2,hair); P(-hw/2,hy-3,1,1,hair); P(hw/2-2,hy-2,2,2,hair); P(hw/2-1,hy-3,1,1,hair);
      if(!back){ P(-hw/2+1,hy-1,1,1,inner); P(hw/2-2,hy-1,1,1,inner); } }
    if(back&&!mounted){ P(-1,legTop-1,2,4,tailCol); P(-1,legTop+3,2,1,shade(tailCol,.5)); }
  }
  if(p.race==='iblis'||R.horns){
    const h=R.hornC||'#e8dcc8';
    if(side){ P(-1,hy-1,1,1,h); P(-2,hy-2,1,1,h); P(-2,hy-3,1,1,h); }
    else { P(-hw/2,hy-1,1,1,h); P(-hw/2-1,hy-2,1,2,h); P(hw/2-1,hy-1,1,1,h); P(hw/2,hy-2,1,2,h); }
    if(back&&!mounted){ P(0,legTop-1,1,2,tailCol); P(0,legTop+1,1,1,tailCol); P(-1,legTop+2,3,2,tailCol); }
  }
  const beard=(p.race==='dwarf'&&p.sex==='m'&&p.stage!=='anak')||(elder&&p.sex==='m'&&p.race==='manusia');
  if(beard&&!back){
    if(side) P(0,hy+4,3,p.race==='dwarf'?4:2,hair);
    else { P(-hw/2+1,hy+4,hw-2,2,hair); if(p.race==='dwarf'){ P(-hw/2+1,hy+6,hw-2,2,hair); P(-hw/2+2,hy+8,hw-4,1,hair); } }
  }
  // aksesori rakyat
  if(!uni&&p.acc&&p.stage!=='anak'){
    if(p.acc==='bandana') P(-hw/2,hy+1,hw,1,p.accC);
    else if(p.acc==='bunga'&&!back) P(side?-hw/2+1:hw/2-2,hy,2,1,'#f07aa0');
    else if(p.acc==='topi'){ P(-hw/2-1,hy,hw+2,1,shade(p.accC,-.2)); P(-hw/2+1,hy-2,hw-2,2,p.accC); }
  }
  if(adult) hat(P,J.hat,hy,hw,head,side,back,J,cloth);
  if(tool){ const hx=side?1:(back?-tw/2-2:tw/2+(aw-1)); drawTool(P,tool,hx,handY,J); }
  if(adult&&J.shield&&!side){ const sx=back?tw/2:-tw/2-3; P(sx,handY-3,3,4,R.bones?'#6a5a4a':'#7a4a2a'); P(sx+1,handY-2,1,2,J.trim||'#e3b75e'); }
  if(elder&&!tool&&!mounted){ const hx=side?2:tw/2+1; P(hx,handY,1,-handY,'#7a5432'); }
}

function hat(P,h,hy,hw,head,side,back,J,cloth){
  if(!h) return;
  const L=-hw/2;
  if(h==='straw'){ P(L-2,hy+1,hw+4,1,'#d9b45a'); P(L+1,hy-1,hw-2,2,'#e8c870'); P(L+1,hy,hw-2,1,'#a8432f'); }
  else if(h==='bucket'){ P(L-1,hy,hw+2,1,'#3f5a7a'); P(L,hy-2,hw,2,'#4f6a8a'); }
  else if(h==='cap'){ const c=J.capC||'#6a5a3a'; P(L,hy-1,hw,2,c); if(!back) P(side?hw/2-1:L+1,hy+1,side?3:hw-2,1,shade(c,-.25)); }
  else if(h==='mine'){ P(L,hy-1,hw,2,'#8a6a3a'); if(!back) P(side?1:-1,hy,2,1,'#ffe08a'); }
  else if(h==='merchant'){ P(L-1,hy,hw+2,1,'#4a3a6a'); P(L+1,hy-2,hw-2,2,'#5a4a7a'); P(hw/2-1,hy-4,1,3,'#e04a4a'); }
  else if(h==='feathercap'){ P(L,hy-1,hw,2,'#4a5a2a'); P(hw/2-1,hy-4,1,3,'#e8e0cc'); P(hw/2,hy-5,1,2,'#e8e0cc'); }
  else if(h==='kerchief'||h==='kerchiefG'){ const c=h==='kerchiefG'?'#6a9a4a':'#f4f0e6'; P(L,hy-1,hw,2,c); if(back||side) P(side?L:L+1,hy+1,side?2:hw-2,2,c); }
  else if(h==='headband'){ P(L,hy+1,hw,1,J.bandC||'#c83a3a'); if(back||side) P(side?L-2:-1,hy+2,2,2,J.bandC||'#c83a3a'); }

/* =====================================================================
   ATLAS SPRITE: ribuan kanvas kecil dipadatkan ke beberapa lembar besar.
   Ribuan sumber gambar terpisah membuat GPU HP sering macet (layar beku
   sesaat walau game tetap jalan). Sekarang sprite disalin ke lembar
   1024×1024 dan digambar dari sana.
   ===================================================================== */
const ATL={pages:[],cur:null,x:0,y:0,rowH:0,S:1024,packed:new WeakMap(),evicting:false};
function atlNewPage(){ const c=document.createElement('canvas'); c.width=ATL.S; c.height=ATL.S; const g=c.getContext('2d'); g.imageSmoothingEnabled=false; ATL.cur={c,g}; ATL.pages.push(ATL.cur); ATL.x=0; ATL.y=0; ATL.rowH=0; }
function atl(src){
  if(!src||!(src instanceof HTMLCanvasElement)) return src;
  const done=ATL.packed.get(src); if(done) return done;
  const w=src.width, h=src.height;
  if(w>256||h>256||w<1||h<1) return src;
  if(!ATL.cur) atlNewPage();
  if(ATL.x+w+1>ATL.S){ ATL.x=0; ATL.y+=ATL.rowH+1; ATL.rowH=0; }
  if(ATL.y+h+1>ATL.S){ if(ATL.pages.length>=10){ atlReset(); } atlNewPage(); }
  const P=ATL.cur;
  P.g.drawImage(src,ATL.x,ATL.y);
  const e={_at:P.c,sx:ATL.x,sy:ATL.y,width:w,height:h};
  ATL.x+=w+1; ATL.rowH=Math.max(ATL.rowH,h);
  ATL.packed.set(src,e);
  return e;
}
function atlReset(){
  // terlalu banyak sprite: kosongkan semua lalu buat ulang seperlunya
  ATL.pages=[]; ATL.cur=null; ATL.packed=new WeakMap();
  Map.prototype.clear.call(cache); Map.prototype.clear.call(R_.bldCache);
}
(function(){
  const orig=CanvasRenderingContext2D.prototype.drawImage;
  CanvasRenderingContext2D.prototype.drawImage=function(s,a,b,c,d,e,f,g,h){
    if(s&&s._at){
      if(arguments.length===3) return orig.call(this,s._at,s.sx,s.sy,s.width,s.height,a,b,s.width,s.height);
      if(arguments.length===5) return orig.call(this,s._at,s.sx,s.sy,s.width,s.height,a,b,c,d);
      return orig.call(this,s._at,s.sx+a,s.sy+b,c,d,e,f,g,h);
    }
    return orig.apply(this,arguments);
  };
  const wrap=m=>{ m.set=function(k,v){
    if(v instanceof HTMLCanvasElement) v=atl(v);
    else if(v&&typeof v==='object'&&v.c instanceof HTMLCanvasElement) v.c=atl(v.c);
    return Map.prototype.set.call(this,k,v); }; };
  wrap(cache); wrap(R_.bldCache);
})();
/* Semua kanvas 2D dirender di CPU. Beberapa GPU HP Android salah menampilkan
   kanvas sumber (medan berkedip/tertukar, layar beku). Dengan mode CPU,
   GPU hanya menerima satu gambar jadi per frame. */
(function(){
  let gpu=false; try{ gpu=localStorage.getItem('tl_cpu')!=='1'; }catch(e){}
  if(gpu) return;
  const og=HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext=function(type,opt){
    if(type==='2d') opt=Object.assign({},opt||{},{willReadFrequently:true});
    return og.call(this,type,opt);
  };
})();
