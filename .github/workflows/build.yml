name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Siapkan project
        run: bash setup.sh
      - name: Build APK
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log; then
            grep -E "error|What went wrong|FAILED|Exception|> " build.log | head -25 | while IFS= read -r l; do echo "::error title=gradle::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk TakhtaLangit.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Takhta Langit build ${{ github.run_number }}
          files: TakhtaLangit.apk
